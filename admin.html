/* The landing view. Eleven tabs and two thousand rows is a wall; this says
   which handful of them changes anything today, and what is already done. */
async function showStart() {
  TAB = '__start';
  beltOff();
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__start'));
  const v = $('#view'); v.innerHTML = '';
  const t = await api('/api/triage');
  const g = t.game || {};

  /* THE COUNTER. Three numbers, and each is chosen to answer a different
     question: how much is on the table, how much of it the public can see
     right now, and whether the paper is clean. Volume is never one of them -
     a wrong ruling here is invisible and permanent, so the craft stat is the
     one that gets the accent colour. */
  /* THE HERO. The penguin earns its place by carrying the one number that
     matters, and the line under it is the product's own voice rather than a
     dashboard caption. Health is shown WITH ITS PARTS: a composite alone
     hides which input moved, and a score nobody can take apart is a score
     nobody trusts. */
  const H = t.health || {};
  const hero = el('div', 'hero');
  const peng = el('img', 'peng');
  peng.src = '/assets/mascot/svg/mascot-slide.svg';
  peng.alt = '';
  hero.appendChild(peng);
  const hbody = el('div', 'herobody');
  hbody.appendChild(el('div', 'heroline', "It's tough SLEDing out there."));
  const hs = el('div', 'health');
  hs.appendChild(el('strong', null, String(H.score ?? '—')));
  hs.appendChild(el('span', null, '/100 board health'));
  hbody.appendChild(hs);
  const parts = el('div', 'parts');
  (H.parts || []).forEach(pt => {
    const row = el('div', 'part');
    row.appendChild(el('span', 'pl', pt.label));
    const bar = el('span', 'pbar');
    const fill = el('span', 'pfill');
    fill.style.width = Math.max(2, pt.pct) + '%';
    if (pt.pct < 50) fill.classList.add('low');
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el('span', 'ppct', pt.pct + '%'));
    row.title = pt.note;
    const note = el('div', 'pnote', pt.note);
    const wrap = el('div');
    wrap.append(row, note);
    parts.appendChild(wrap);
  });
  hbody.appendChild(parts);
  hero.appendChild(hbody);
  v.appendChild(hero);

  const onTable = (t.counts.vendors || 0) + (t.counts.miscategorized || 0)
                + (t.counts.duplicates || 0);
  const visible = (t.recommend.find(r => r.queue === 'miscategorized') || {}).n || 0;
  const counter = el('div', 'counter');
  const big = (num, lbl, cls) => {
    const d = el('div', 'bignum' + (cls ? ' ' + cls : ''));
    d.appendChild(el('strong', null, String(num)));
    d.appendChild(el('span', null, lbl));
    return d;
  };
  /* Labels say what the number is, in words that need no gloss. The first
     drafts - "calls on the table", "visible from the street", "clean paper" -
     were floor slang I invented, and a label you have to explain has already
     failed.

     THE THIRD LABEL NAMES ITS OWN DENOMINATOR. It used to read "of your
     rulings say why" over a percentage taken across the decision files, and
     sat directly above a sitting counter taken from the journal - two
     different populations, both called "your rulings", one above the other.
     A percentage whose denominator is not the one the reader assumes is a
     wrong number even when the arithmetic is right, so the set is said out
     loud: the rulings that HAVE somewhere to put a reason. */
  counter.append(
    big(onTable, 'decisions waiting on you'),
    big(visible, 'of them wrong on the public site right now', 'amber'),
    big(g.why_coverage === null || g.why_coverage === undefined
        ? '—' : g.why_coverage + '%',
      `of your ${g.why_of || 0} rulings that can carry a reason say why`,
      'green'));
  v.appendChild(counter);

  /* Counted in SESSIONS, not calendar days. The rhythm here is bursty - an
     evening of rulings, then nothing for a while - and a daily streak against
     that is a machine for feeling bad about a pattern that is not a problem.
     A session is a run with no gap longer than four hours, so a Sunday
     evening counts the same as a Tuesday one.

     And it counts RULINGS. It used to count every write in the journal, which
     is how an overnight agent's 86 edits to companies.json arrived here as
     the owner's own personal best of 84. */
  const ss = t.sessions || {};
  const line = el('div', 'yourline');
  line.appendChild(el('span', null,
    ss.this_session
      ? `${ss.this_session} ruling${ss.this_session === 1 ? '' : 's'} this sitting`
        + ` · your best sitting is ${ss.best_session}`
      : `${ss.rulings || 0} rulings across ${ss.sessions || 0} sittings · best ${ss.best_session || 0}`));
  /* The badge reads the PACED count, not the raw one. Forty-one rulings in
     2.6 seconds is a real tally and is shown as one; it is not a personal
     best, and a screen that called it one would be handing out the trophy
     this whole pass exists to take back. */
  if (ss.this_considered && ss.this_considered >= (ss.best_considered || 0)
      && ss.best_considered > 1)
    line.appendChild(el('span', 'pb', 'personal best'));
  v.appendChild(line);

  /* THE SORTIES. Each names what the work buys and how close its queue is to
     a state with a title. A bar that fills toward "Clean shelves" finishes;
     a percentage does not. */
  const stateOf = {};
  ((g.states) || []).forEach(st => { stateOf[st.queue] = st; });
  /* REVERSALS SHOWN, NOT HIDDEN. A screen that only ever displays wins is not
     telling you how you are doing. An undo is the system working; the count of
     them is the only honest read on whether the pace is right. */
  const rv = t.reversals || [];
  if (rv.length) {
    const strip = el('div', 'tape');
    strip.appendChild(el('span', 'lbl', 'Last rulings'));
    rv.forEach(r => {
      const chip = el('span', 'stamp' + (r.reversed ? ' undone' : ''));
      chip.textContent = r.action + (r.n > 1 ? ' \u00d7' + r.n : '');
      chip.title = (r.why || r.action) + ' \u00b7 ' + (r.at || '').slice(0, 16)
                 + (r.reversed ? ' \u00b7 you took this one back' : '');
      strip.appendChild(chip);
    });
    const undone = rv.filter(r => r.reversed).length;
    strip.appendChild(el('span', 'kv',
      undone ? `${undone} taken back \u2014 that is the undo working, not a black mark`
             : 'none taken back'));
    v.appendChild(strip);
  }

  if (t.recommend.length) v.appendChild(el('div', 'lbl', "Today's sorties"));
  t.recommend.forEach(r => {
    const card = el('div', 'sortie');
    card.appendChild(el('h3', null, r.headline));
    card.appendChild(el('div', 'kv', r.why));
    /* The bar measures the SITTING, not the queue. A sortie you can finish
       shows a bar that can fill; the queue's own total lives on its tab. */
    if (r.scope) {
      const pct = Math.round(100 * (r.done || 0) / r.scope);
      const wrapb = el('div', 'barwrap');
      const bar = el('div', 'endbar');
      const fill = el('div', 'endfill');
      fill.style.width = Math.max(2, pct) + '%';
      bar.appendChild(fill);
      wrapb.appendChild(bar);
      wrapb.appendChild(el('span', 'toward',
        `${r.done || 0} of ${r.scope}${r.goal ? ' → ' + r.goal : ''}`));
      card.appendChild(wrapb);
    }
    const st = stateOf[r.queue];
    if (st && st.left)
      card.appendChild(el('div', 'far',
        `${st.done + st.left} on the board behind it — “${st.name}” when it is empty`));
    const b = el('button', 'act good', `Open ${META.labels[r.queue]}`);
    b.onclick = () => show(r.queue);
    const row = el('div', 'row'); row.appendChild(b);
    card.appendChild(row);
    v.appendChild(card);
  });

  /* THE FLOORS. The capture worklist is worked by conference, so its
     progress is per conference: doors mapped out of doors known. A floor at
     100% is stamped and stays stamped - nothing here expires. */
  const fl = (t.floors || []).filter(f => f.left > 0).slice(0, 6);
  const done = (t.floors || []).filter(f => f.left === 0);
  if (fl.length || done.length) {
    v.appendChild(el('div', 'lbl', 'The floors'));
    const grid = el('div', 'floors');
    done.slice(0, 3).forEach(f => {
      const d = el('div', 'floor stamped');
      d.innerHTML = '<svg width="34" height="34" viewBox="0 0 52 52" fill="none">'
        + '<circle cx="26" cy="26" r="23" stroke="currentColor" stroke-width="2.5"/>'
        + '<circle cx="26" cy="26" r="18" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>'
        + '<path d="M17 27l6 6 12-13" stroke="currentColor" stroke-width="2.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';
      d.appendChild(el('div', 'fname', f.event));
      d.appendChild(el('div', 'fsub', `all ${f.total} doors mapped`));
      grid.appendChild(d);
    });
    fl.forEach(f => {
      const d = el('div', 'floor');
      d.appendChild(el('div', 'fname', f.event));
      const bar = el('div', 'endbar');
      const fill = el('div', 'endfill');
      fill.style.width = Math.max(3, f.pct) + '%';
      bar.appendChild(fill);
      d.appendChild(bar);
      d.appendChild(el('div', 'fsub',
        f.left === 1 ? 'one door from a full map'
                     : `${f.left} doors left of ${f.total}`));
      grid.appendChild(d);
    });
    v.appendChild(grid);
    v.appendChild(el('div', 'hintline',
      'Doors close in No board found and Missing websites — or on the floor '
      + 'itself, with the capture extension.'));
  }

  /* THE UNLOCKS. Gated on board health and nothing else - the thing being
     bought is a board worth copying, so the price is the board being right.
     Volume never opens anything. The weekly digest is deliberately not here:
     it is already built and already his, and putting a gate in front of
     something somebody already has is a demotion wearing a reward's clothes. */
  if ((t.unlocks || []).length) {
    v.appendChild(el('div', 'lbl', 'Unlocks'));
    const grid = el('div', 'unlocks');
    (t.unlocks || []).forEach(u => grid.appendChild(unlockCard(u)));
    v.appendChild(grid);
  }

  /* THE RECEIPT. What this sitting changed, in differences between two
     states we can both observe. Anything not derivable is left out - a
     receipt that rounds is a receipt nobody reads twice. */
  const rc = t.receipt || {};
  if (rc.open && (rc.stamped || rc.edits || (rc.doors || []).length
                  || (rc.by_others || []).length)) {
    v.appendChild(el('div', 'lbl', 'This sitting'));
    v.appendChild(receiptCard(rc));
  }

  /* THE TAPE. Not a score: a record that the work caused something. */
  if ((g.tape || []).length) {
    v.appendChild(el('div', 'lbl', 'The tape'));
    const tape = el('div', 'tape');
    g.tape.forEach(x => {
      const r = el('div', 'trow');
      r.appendChild(el('span', 'tdate', x.on));
      r.appendChild(el('span', null,
        x.verb === 'refiled' ? `refiled to ${x.what}`
                             : `${x.what} — ${x.call}`));
      if (x.why) r.appendChild(el('span', 'twhy', x.why));
      tape.appendChild(r);
    });
    v.appendChild(tape);
  }

  const notes = el('div', 'sortie muted');
  notes.appendChild(el('h3', null, 'Worth knowing before you judge the numbers'));
  t.notes.forEach(n => notes.appendChild(el('div', 'kv', n)));
  v.appendChild(notes);
}

/* The gate is stated in the units it is actually measured in. The CSV used to
   say "board health 44 of 55", a threshold on a composite whose biggest term
   was max(0, 40 - wrong)/40 — a fraction with an invented denominator
   deciding when a reward opened. It now reads the condition its own
   description always claimed: no company a visitor can see is filed in a
   bucket its record contradicts. */
function unlockCard(u) {
  const n = el('div', 'unlock' + (u.open ? ' open' : ''));
  n.appendChild(el('div', 'uname', u.name));
  n.appendChild(el('div', 'ugate',
    (u.open ? 'open · ' : '') + (u.gate_says || '')));
  if (!u.open && u.pct !== null && u.pct !== undefined) {
    const g = el('div', 'ugap'), fill = el('span');
    fill.style.width = Math.max(2, u.pct) + '%';
    g.appendChild(fill);
    n.appendChild(g);
  }
  n.appendChild(el('div', 'uwhat', u.what));
  n.appendChild(el('div', 'uwhy', u.why));
  if (u.key === 'csv') {
    const row = el('div', 'row');
    const b = el('button', 'act' + (u.open ? ' go' : ''), 'Download the CSV');
    /* Left clickable while locked on purpose. The gate is enforced on the
       server, so pressing it shows the actual refusal rather than a greyed
       button that could be hiding anything. */
    b.onclick = () => downloadCsv(n, b);
    row.appendChild(b);
    n.appendChild(row);
  } else if (!u.built) {
    n.appendChild(el('div', 'uwhy',
      'Nothing sits behind this yet — no endpoint, no key, no waiting list. '
      + 'It is listed as not built rather than shown as a button that '
      + 'apologises.'));
  }
  return n;
}

async function downloadCsv(card, btn) {
  btn.disabled = true;
  const r = await fetch('/api/export.csv');
  btn.disabled = false;
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    const box = el('div', 'refusal');
    box.appendChild(penguin('skeptic'));
    const t = el('div');
    t.appendChild(el('h3', null, 'Not yet'));
    t.appendChild(el('div', 'kv', j.error
      || 'the export is not open at this board health'));
    box.appendChild(t);
    const old = card.querySelector('.refusal');
    if (old) old.remove();
    card.appendChild(box);
    return;
  }
  const text = await r.text();
  const url = URL.createObjectURL(new Blob([text], {type: 'text/csv'}));
  const a = el('a');
  a.href = url;
  a.download = 'sled-jobs-board.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast(`${text.split('\n').length - 2} rows downloaded`);
}

function receiptCard(rc) {
  const n = el('div', 'receipt');
  const line = (num, what) => {
    const r = el('div', 'rline');
    r.appendChild(el('b', null, String(num)));
    r.appendChild(el('span', 'rwhat', what));
    return r;
  };
  /* ONE LINE, BECAUSE THEY ARE ONE PILE. This used to print "55 stamped" and
     "133 edits to company records" as two lines, and every one of the 55 also
     wrote a journal entry — so the 55 were inside the 133 and the receipt
     read as 188 things having happened. Both counts were right; stacking them
     was the lie. */
  if (rc.edits)
    n.appendChild(line(rc.edits, rc.stamped
      ? `edits to company records — ${rc.stamped} of them rulings that carry your name`
      : 'edits to company records, none of them rulings'));
  else if (rc.stamped)
    n.appendChild(line(rc.stamped, 'rulings that carry your name'));
  n.appendChild(line(rc.reversed, rc.reversed
    ? 'reversed — the undo working, not a black mark'
    : 'reversed'));
  /* Somebody else's writes, kept out of the count above rather than folded
     into it. An agent's 86 edits are not your evening. */
  (rc.by_others || []).forEach(o =>
    n.appendChild(line(o.n, `more by ${o.by} — not counted as yours`)));
  (rc.states || []).forEach(s => {
    const r = el('div', 'rline');
    r.appendChild(el('b', null, s.from + '→' + s.to + '%'));
    r.appendChild(el('span', 'rwhat',
      `toward “${s.name}” · ${s.n} ruled this sitting, ${s.left} still to go`));
    n.appendChild(r);
  });
  if ((rc.doors || []).length)
    n.appendChild(line(rc.doors.length,
      'companies now have a board we can read that had none before'));
  n.appendChild(el('div', 'rsince',
    'since ' + (rc.since || '').replace('T', ' ').slice(0, 16)
    + ' · board health is ' + rc.health
    + '. Nothing here is estimated: every line is a difference between two '
    + 'states on file.'));
  return n;
}

/* ─────────────────────────────────────────────── Screen 2: working a queue
   A queue arrives wearing three things: the state it is heading for, how
   often the machine's proposals have actually been taken, and the grip you
   want on it. The list is the old grip and stays. The belt is the new one:
   work arrives at you, one item at a time, and you never choose what to
   open - which is the fastest loop there is, and for that reason is only
   allowed on the queues where the answer is on the card. */

const MASCOT = {
  hunt:    '/assets/mascot/svg/head-on-the-hunt.svg',
  offer:   '/assets/mascot/svg/head-offer-in.svg',
  ghosted: '/assets/mascot/svg/head-ghosted.svg',
  skeptic: '/assets/mascot/svg/head-competitive-pay.svg',
};
function penguin(which, alt) {
  const i = el('img'); i.src = MASCOT[which]; i.alt = alt || ''; return i;
}

let QINFO = null;          // the queue payload on screen: state, agree, total
const MODE = {};           // queue -> 'belt' | 'list', remembered while open

async function show(key) {
  TAB = key;
  beltOff();
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === key));
  const v = $('#view'); v.innerHTML = '';
  const load = el('div', 'empty', 'loading…'); v.appendChild(load);
  const res = await api('/api/queue/' + key);
  load.remove();
  if (res.error) {
    v.appendChild(el('div', 'empty', res.error));
    return;
  }
  QINFO = res;
  const items = res.items || [];
  // the whole set, so a renderer can offer to act on a group it belongs to
  LAST_ITEMS = items; VTHEME = null;
  const body = el('div'); body.id = 'qbody';
  if (res.state || res.belt) v.appendChild(queueHead(key, res, body));
  /* The blurb carries a live count rather than a written one. Two of these
     had numbers typed into the prose - "102 companies are here" when there
     were 50, "537 careers pages" when there were 887 - and a number in prose
     is true on the day it is written and silently wrong afterwards. This one
     comes off the queue that just loaded. */
  const intro = el('p', 'intro');
  if (INTRO[key]) {
    /* res.total, never items.length: the server caps the page at 400 rows and
       sends the real count beside it. items.length said "400 waiting." on a
       queue holding 644, which is a number in prose again - live this time,
       and still wrong. */
    const n = res.total ?? items.length;
    intro.textContent = n
      ? `${n.toLocaleString()} waiting. ${INTRO[key]}`
      : INTRO[key];
    v.appendChild(intro);
  }
  /* The cap notice for queues that render no queueHead. It lived only inside
     queueHead, which only queues with a named end state or a belt get - so
     founded (644) and unclassified (456) served 400 rows with nothing on the
     page admitting more exist. What is on screen is never quietly presented
     as what exists, on EVERY queue, not just the six with a progress bar. */
  if (!(res.state || res.belt) && res.total > items.length)
    v.appendChild(el('p', 'intro',
      `showing the first ${items.length.toLocaleString()} of `
      + `${res.total.toLocaleString()} - the rest load as these are ruled`));
  /* What this queue is holding up. Only duplicates reports a number: every
     other queue asks about a record on its own terms, but a duplicate pair
     asks whether one of the two should stop existing, and every decision
     queued against the loser is work nobody needed to do. 137 of them, across
     eight queues. Ordering is the cheapest lever there is and it is invisible
     unless somebody counts. */
  if (typeof res.unblocks === 'number' && res.unblocks > 0) {
    const u = el('p', 'intro');
    u.appendChild(el('strong', null, res.unblocks.toLocaleString()));
    u.appendChild(document.createTextNode(
      ' decisions in other queues are waiting on records that are half of a '
      + 'pair here. Every merge you make may settle several of them at once, '
      + 'which is why this queue is worth doing first.'));
    v.appendChild(u);
  }
  v.appendChild(body);
  drawQueue(key, items, body);
}

/* The named end state, on the header where it can be seen. A bar that fills
   toward "Clean shelves" finishes; a percentage does not. */
function queueHead(key, res, body) {
  const h = el('div', 'qhead');
  const top = el('div', 'qtop');
  top.appendChild(el('h2', null, META.labels[key]));
  if (res.state)
    top.appendChild(el('span', 'qend', '→ “' + res.state.name + '”'));
  if (res.belt && (res.items || []).length) {
    const seg = el('div', 'seg');
    const mk = (m, label) => {
      const b = el('button', null, label);
      b.setAttribute('aria-pressed', String(modeOf(key) === m));
      b.onclick = () => {
        /* Re-fetch, never re-render the array captured at load. Ruling ten
           vendors on the belt and then clicking List showed all ten pending
           again - and a second click on one silently overwrote the ruling
           made seconds earlier, because act_vendor_scope replaces the keyed
           decision unconditionally. The queue the server sends after the
           rulings is the truth; the array in this closure stopped being it
           at the first commit. */
        MODE[key] = m;
        show(key);
      };
      return b;
    };
    seg.append(mk('belt', 'Belt'), mk('list', 'List'));
    top.appendChild(seg);
  }
  h.appendChild(top);
  if (res.state) {
    const bar = el('div', 'qbar');
    const e = el('div', 'endbar'), f = el('div', 'endfill');
    f.style.width = Math.max(2, res.state.pct) + '%';
    e.appendChild(f);
    bar.append(e, el('span', 'qleft',
      `${res.state.done} ruled · ${res.state.left} to go`));
    h.appendChild(bar);
  }
  /* The page is served 400 rows at most. Saying so is the same rule as
     everywhere else here: what is on screen is never quietly presented as
     what exists. */
  if (res.total > (res.items || []).length)
    h.appendChild(el('div', 'qleft',
      `showing the first ${(res.items || []).length} of ${res.total}`));
  if (res.agree) h.appendChild(agreeLine(res.agree, res.total || 0));
  return h;
}

/* THE AGREE-RATE, shown from the very first ruling.
   Every wrong-bucket row arrived carrying a proposal from an earlier AI pass
   and not one has ever been confirmed or overruled, so "confidence: high" is
   currently a word with no evidence behind it. This is that evidence being
   collected in the open, next to the label it is testing. */
function agreeLine(a, total) {
  const n = el('div', 'agree');
  if (!a.ruled) {
    const p = el('p');
    p.style.margin = '0';
    p.appendChild(el('span', 'unmeasured', 'The guesser has never been checked. '));
    p.appendChild(document.createTextNode(
      `All ${total} of these carry a proposal and not one has ever been `
      + `confirmed or overruled, so its confidence labels mean nothing yet. `
      + `Your rulings are the measurement.`));
    n.appendChild(p);
    return n;
  }
  const p = el('p'); p.style.margin = '0';
  p.appendChild(document.createTextNode('You have taken '));
  p.appendChild(el('strong', null, `${a.agreed} of ${a.ruled}`));
  p.appendChild(document.createTextNode(` proposals — `));
  p.appendChild(el('strong', null, a.pct + '%'));
  p.appendChild(document.createTextNode(' agree-rate.'));
  /* WHY IT IS NOT A MEASUREMENT, IN WORDS — never as a countdown.
     This used to say "N more before that is a measurement", which is a
     progress bar for a keystroke count, and a reviewer emptied it in three
     and a half seconds by holding down A. What replaces it is a sentence
     about the evidence: the two things missing are that the rulings were made
     slowly enough to have been read, and that at least some of them
     disagreed. Neither is shown as a number to chase, because "disagree four
     more times" is an instruction to file four companies wrongly. */
  if (a.why_not) {
    p.appendChild(document.createTextNode(' '));
    p.appendChild(el('span', 'unmeasured', 'Not a measurement yet: '));
    p.appendChild(document.createTextNode(a.why_not + '.'));
  }
  n.appendChild(p);
  if (a.by_confidence.length) {
    const line = el('div', 'conflist');
    a.by_confidence.forEach(c => line.appendChild(el('span', null,
      `${c.confidence}: ${c.agreed}/${c.ruled} (${c.pct}%)`
      + (c.measured ? ' · measured' : ''))));
    n.appendChild(line);
  }
  return n;
}

function modeOf(key) {
  if (MODE[key]) return MODE[key];
  return (QINFO && QINFO.belt) ? 'belt' : 'list';
}

/* ARGUE WITH THE LOGIC, from the row that provoked it.

   Every queue shows its reasoning while asking for a ruling - "the domain
   matches this name", "this is a holding page", "slug does not match - likely
   a parent". When that reasoning is wrong the owner is the only person who
   ever sees it, at the one moment he has the context to say why, and until
   now there was nowhere to put it. The choice was: rule anyway, or lose it.

   Deliberately quiet. It is a small link, not a button competing with the
   ruling, because it must never be the easy way out of deciding. It sends the
   panel's own words along with the argument, so the note still makes sense a
   week later without rebuilding the state that produced it. */
function attachSuggest(key, item, row) {
  if (!row || !row.appendChild) return;
  const bar = el('div', 'kv');
  bar.style.cssText = 'margin-top:6px;opacity:.55';
  const a = el('a', null, 'the logic here is wrong \u2192');
  a.href = '#';
  a.style.cssText = 'font-size:12px;text-decoration:none';
  a.onclick = e => {
    e.preventDefault();
    if (bar.querySelector('textarea')) { bar.querySelector('.sg').remove(); return; }
    const box = el('div', 'sg');
    box.style.cssText = 'display:flex;gap:6px;margin-top:6px;flex-wrap:wrap';
    const ta = el('textarea');
    ta.placeholder = 'what did it get wrong, and what should it do instead?';
    ta.style.cssText = 'flex:1;min-width:280px;min-height:56px;font:inherit;'
      + 'padding:6px;background:var(--panel);color:var(--ink);'
      + 'border:1px solid var(--line)';
    const send = el('button', 'btn', 'Record it');
    send.onclick = async () => {
      const v = ta.value.trim();
      if (!v) return;
      send.disabled = true;
      /* The panel's own text, so the note is readable without the row. */
      const saw = (row.innerText || '').replace(/\s+/g, ' ').slice(0, 600);
      const r = await api('/api/suggest', {
        queue: key, id: item && item.id, name: item && item.name,
        saw: saw, argument: v});
      send.disabled = false;
      if (r.error) return toast(r.error, true);
      toast(r.message);
      box.remove();
      a.textContent = 'noted \u2713';
      a.onclick = e2 => e2.preventDefault();
    };
    box.append(ta, send);
    bar.appendChild(box);
    ta.focus();
  };
  bar.appendChild(a);
  row.appendChild(bar);
}


function drawQueue(key, items, body) {
  beltOff();
  body.innerHTML = '';
  if (!items.length) {
    /* Two different empty states, and they are not the same fact. A queue
       somebody emptied has reached its named end state and gets the offer
       penguin; a queue that was never asking anything gets the ghosted one.
       Collapsing them would congratulate you for work you did not do. */
    const st = QINFO && QINFO.state;
    const finished = st && st.done;
    const e = el('div', 'beltend');
    e.appendChild(penguin(finished ? 'offer' : 'ghosted'));
    const t = el('div');
    t.appendChild(el('h3', null, finished ? st.name : 'Nothing in this queue.'));
    t.appendChild(el('div', 'kv', finished
      ? `Nothing left to rule here. ${st.done} ruled in all.`
      : 'Nothing here is waiting on a person.'));
    e.appendChild(t);
    body.appendChild(e);
    return;
  }
  if (QINFO && QINFO.belt && modeOf(key) === 'belt') return startBelt(key, items, body);
  items.forEach(it => {
    const row = RENDER[key](it);
    attachSuggest(key, it, row);
    body.appendChild(row);
  });
}

/* ── THE BELT ──────────────────────────────────────────────────────────────
   One item, keyboard-first, the next one already built and waiting. The
   whole idea is that you never choose what to open, so the cost of a ruling
   is the ruling and nothing else.

   Two limits are deliberate and neither is a performance problem:

   The belt only runs on the judgment queues, and inside them only on the
   rows that carry something to judge. A wrong-bucket row the guesser could
   not read has nothing on the card to check, so it needs the description
   read slowly and it stays in the list. Acquisitions never belts at all -
   deciding whether a slug belongs to a parent company is exactly the work a
   counter would rush.

   And a ruling takes two acts, not one, until the agree-rate is a real
   number. The first ~40 rulings are what measures a guesser nothing has
   ever checked; optimising the keystroke count of an uncalibrated
   instrument is optimising the wrong thing. */

const BELT = {queue: null, items: [], i: 0, armed: null, ruled: 0,
              skipped: 0, done: null, next: null, nextFor: -1,
              host: null, why: ''};

/* What may ride the belt, and what may not. */
function beltable(key, items) {
  if (key === 'miscategorized')
    return items.filter(c => c.proposed_sector && c.confidence !== 'none');
  if (key === 'vendors')
    return items.filter(v => (v.description || '').trim());
  return items;
}

function beltOff() { BELT.queue = null; BELT.host = null; BELT.armed = null; }

function startBelt(key, items, body) {
  const rideable = beltable(key, items);
  Object.assign(BELT, {queue: key, items: rideable, i: 0, armed: null,
                       ruled: 0, skipped: 0, done: new Set(), next: null,
                       nextFor: -1, host: body, why: ''});
  const held = items.length - rideable.length;
  renderBelt();
  if (held) {
    const note = el('div', 'unbelted');
    note.textContent = held === 1
      ? '1 row has nothing for the guesser to go on and is not on the belt. '
        + 'It needs its description read, and a counter beside it would buy '
        + 'speed with accuracy. Switch to List to reach it.'
      : `${held} rows have nothing for the guesser to go on and are not on `
        + 'the belt. They need their descriptions read, and a counter beside '
        + 'them would buy speed with accuracy. Switch to List to reach them.';
    body.appendChild(note);
  }
}

function renderBelt() {
  const host = BELT.host;
  if (!host) return;
  // keep anything appended under the belt (the unbelted note)
  const first = host.firstChild;
  const fresh = BELT.i >= BELT.items.length
    ? beltEnd()
    : (BELT.nextFor === BELT.i && BELT.next ? BELT.next : beltCard(BELT.i));
  freshen(fresh);
  if (first) host.replaceChild(fresh, first); else host.appendChild(fresh);
  /* Build the NEXT card now, off-document. It is a real element with a real
     logo request already in flight, so advancing is a swap rather than a
     build - which is the entire claim the belt makes. */
  BELT.next = null; BELT.nextFor = -1;
  const nxt = nextIndex(BELT.i);
  if (nxt !== null && nxt < BELT.items.length) {
    BELT.next = beltCard(nxt); BELT.nextFor = nxt;
  }
}

/* A prepared card was built one ruling ago, so the two numbers on it that
   move every ruling are re-read the moment it is shown. Preparing the card
   is what makes the loop fast; letting it show yesterday's agree-rate would
   make the fast loop dishonest, which is the trade this screen exists to
   refuse. */
function freshen(card) {
  const a = QINFO && QINFO.agree;
  const it = BELT.items[BELT.i];
  const at = card.querySelector('.propagree');
  if (at && a) {
    const seen = bandOf(at.dataset.conf);
    at.textContent = seen
      ? `you have taken ${seen.agreed} of ${seen.ruled} at this confidence`
      : 'nothing at this confidence has been ruled on yet';
  }
  const arm = card.querySelector('.beltarm');
  if (arm && !BELT.armed) arm.textContent = armLine(it);
  const enter = card.querySelector('.enterkey');
  if (enter) enter.textContent = oneKeyOk(it) ? 'commit' : 'commit the armed call';
}

function nextIndex(from) {
  for (let j = from + 1; j < BELT.items.length; j++)
    if (!BELT.done.has(j)) return j;
  return BELT.items.length;
}

const CALLS = {
  vendors: [
    {k: 'i', label: 'In: full company', cls: 'go', call: 'in'},
    {k: 's', label: 'SLED-only roles', cls: '', call: 'sled'},
    {k: 'o', label: 'Not this board', cls: 'mute', call: 'out'},
  ],
  miscategorized: [
    {k: 'a', label: 'File it as proposed', cls: 'go', accept: true},
    {k: 'k', label: 'Bucket is right', cls: '', keep: true},
    {k: 'e', label: 'Somewhere else…', cls: 'mute', edit: true},
  ],
};

/* One keystroke commits only once the agree-rate exists FOR THIS CONFIDENCE
   BAND. Forty medium-confidence rulings say nothing about what "high" is
   worth, so they must not buy a one-key ruling on a high-confidence card —
   which is the same complaint the split-by-confidence display exists to
   answer, applied to the thing it actually gates.

   Vendors never get there on purpose: a name ruled out is never asked again
   and the row simply stops existing, which is the invisible permanent error
   this whole tool is built around. Two acts is the price of that. */
function bandOf(conf) {
  const a = QINFO && QINFO.agree;
  if (!a) return null;
  return (a.by_confidence || []).find(
    c => c.confidence === (conf || 'unstated')) || null;
}

function oneKeyOk(it) {
  if (BELT.queue !== 'miscategorized' || !it) return false;
  const b = bandOf(it.confidence);
  return !!(b && b.measured);
}

/* Accepting a LOW-confidence proposal needs a line of typing. Low confidence
   is the guesser saying it does not know; taking that placement with nothing
   written down records a machine's guess as a person's ruling, and the belt
   hands you the next card in under a second. It costs nothing when somebody
   is really reading, and it is deliberately NOT asked on a high-confidence
   row a person simply agrees with — demanding an essay there trains people to
   type junk, which teaches the next pass worse than silence does.
   The server refuses these too; this is so the refusal is not a surprise. */
function needsWhy(it, spec, why) {
  if (BELT.queue !== 'miscategorized') return false;
  if ((it.confidence || '').toLowerCase() !== 'low') return false;
  if ((why || '').trim()) return false;
  const chose = spec.sector
    ? `${spec.sector} / ${spec.category}`
    : (spec.accept ? `${it.proposed_sector} / ${it.proposed_category}` : null);
  return chose !== null
      && chose === `${it.proposed_sector} / ${it.proposed_category}`;
}

function beltCard(idx) {
  const key = BELT.queue, it = BELT.items[idx];
  const n = el('div', 'belt');
  n.appendChild(el('div', 'beltpos',
    `${idx + 1} of ${BELT.items.length} on the belt`));
  const name = el('div', 'beltname');
  name.textContent = it.name;
  if (key === 'miscategorized' && it.id) {
    name.classList.add('hasLogo');
    name.style.display = 'flex';
    name.style.alignItems = 'center';
    name.insertBefore(logoTile(it.name, it.id), name.firstChild);
  }
  n.appendChild(name);
  if (it.description) n.appendChild(el('div', 'beltdesc', it.description));

  const meta = el('div', 'beltmeta');
  if (it.open_roles) meta.appendChild(el('span', 'chip', it.open_roles + ' open'));
  if (key === 'miscategorized')
    meta.appendChild(el('span', 'chip', `now: ${it.sector} / ${it.category}`));
  if (it.theme) meta.appendChild(el('span', 'chip', it.theme));
  if (it.source_event) meta.appendChild(el('span', 'chip', it.source_event));
  if (it.website) {
    const a = el('a', null, it.website.replace(/^https?:\/\//, ''));
    a.href = it.website; a.target = '_blank'; a.rel = 'noopener';
    meta.appendChild(a);
  }
  n.appendChild(meta);
  if (key === 'vendors' && it.why) n.appendChild(el('div', 'kv', it.why));

  /* The proposal, with its confidence AND what that confidence has been
     worth so far. A confidence label with no agree-rate beside it is a
     number the machine gave itself. */
  if (key === 'miscategorized') {
    const p = el('div', 'beltprop');
    p.appendChild(el('div', 'plabel', 'proposed placement'));
    p.appendChild(el('div', 'pval',
      `${it.proposed_sector} / ${it.proposed_category}`));
    const line = el('div', 'kv');
    line.appendChild(el('span', 'chip', 'confidence: ' + (it.confidence || 'unstated')));
    const at = el('span', 'propagree');
    at.dataset.conf = it.confidence || 'unstated';
    line.appendChild(at);
    p.appendChild(line);
    if (it.evidence && it.evidence.length)
      p.appendChild(el('div', 'pnote', it.evidence.join(' · ')));
    n.appendChild(p);
  }

  /* The why. It is the craft stat and the only thing that teaches the next
     pass, so it sits in the loop rather than behind a disclosure. */
  const why = el('input', 'txt');
  /* On a low-confidence row the reason is not optional and the box says so
     before the button refuses, so the requirement reads as part of the job
     rather than as the tool being difficult. */
  why.placeholder = (key === 'miscategorized'
                     && (it.confidence || '').toLowerCase() === 'low')
    ? 'why — required here: the guesser says it does not know'
    : 'why (this is what teaches the next pass)';
  why.value = '';
  const acts = el('div', 'beltacts');
  acts.appendChild(why);
  n.appendChild(acts);

  const row = el('div', 'beltacts');
  (CALLS[key] || []).forEach(spec => {
    const b = el('button', 'act ' + (spec.cls || ''), spec.label);
    b.dataset.k = spec.k;
    b.appendChild(el('span', 'kbd', spec.k.toUpperCase()));
    b.onclick = () => choose(spec, it, why, n, idx);
    row.appendChild(b);
  });
  if (key === 'vendors' && it.theme && it.theme !== 'Everything else') {
    const peers = BELT.items.filter((x, j) => x.theme === it.theme && !BELT.done.has(j));
    const b = el('button', 'act mute', `Settle all ${peers.length} in ${it.theme}`);
    b.dataset.k = 'f';
    b.appendChild(el('span', 'kbd', 'F'));
    b.onclick = () => settleFamily(it, why, n, idx);
    row.appendChild(b);
  }
  const skip = el('button', 'act mute', 'Skip — decide later');
  skip.dataset.k = 'j';
  skip.appendChild(el('span', 'kbd', 'J'));
  skip.onclick = () => { BELT.skipped++; BELT.armed = null; advance(); };
  row.appendChild(skip);
  n.appendChild(row);

  n.appendChild(el('div', 'beltarm', armLine(it)));

  const legend = el('div', 'beltkeys');
  const kv = (k, what, cls) => {
    const s = el('span');
    s.appendChild(el('span', 'kbd', k));
    s.appendChild(el('span', cls, what));
    return s;
  };
  (CALLS[key] || []).forEach(spec =>
    legend.appendChild(kv(spec.k.toUpperCase(), spec.label.replace('…', ''))));
  if (key === 'vendors') legend.appendChild(kv('F', 'settle the family'));
  legend.append(kv('J', 'skip'), kv('W', 'write the why'),
                kv('⏎', oneKeyOk(it) ? 'commit' : 'commit the armed call', 'enterkey'),
                kv('esc', 'disarm'));
  n.appendChild(legend);

  const nxt = nextIndex(idx);
  const after = BELT.items[nxt];
  const line = el('div', 'beltnext');
  if (after) {
    line.appendChild(document.createTextNode('next up: '));
    line.appendChild(el('b', null, after.name));
    line.appendChild(document.createTextNode(' — already loaded'));
  } else {
    line.textContent = 'last one on the belt';
  }
  n.appendChild(line);
  return n;
}

/* No achievement language and no countdown. This used to congratulate you —
   "the second act has been earned away" — for a state a fast clicker reached
   in three and a half seconds, and before that it counted down the rulings
   left until one-key opened, which is a scoreboard for keystrokes. What it
   says now is what is true of the evidence, and the only way to change it is
   to rule slowly enough to have read the card and to disagree when the
   guesser is wrong. */
function armLine(it) {
  if (oneKeyOk(it))
    return 'One key rules on this confidence band: rulings at this confidence '
         + 'have been made slowly enough to have been read, and some of them '
         + 'disagreed. Other bands still take two acts.';
  if (BELT.queue === 'vendors')
    return 'Two acts, always: press a call to arm it, Enter to commit. A '
         + 'vendor ruled out never appears again and nothing errors when it '
         + 'was wrong, so this one does not get a single keystroke.';
  const b = it ? bandOf(it.confidence) : null;
  return 'Two acts: press a call to arm it, Enter to commit. '
       + (b && b.ruled
          ? `Nothing at ${b.confidence} confidence has been ruled on carefully `
            + 'enough yet to say what that label is worth.'
          : 'This confidence label has never been checked against an outcome.');
}

function paintArmed(card) {
  card.querySelectorAll('button.act').forEach(b =>
    b.classList.toggle('armed', !!BELT.armed && b.dataset.k === BELT.armed.k));
  const line = card.querySelector('.beltarm');
  if (line) line.textContent = BELT.armed
    ? `“${BELT.armed.label.replace('…', '')}” is armed — Enter commits it, `
      + 'Esc puts it back.'
    : armLine(BELT.items[BELT.i]);
}

function choose(spec, it, why, card, idx) {
  if (spec.edit) return openEdit(it, why, card, idx);
  if (oneKeyOk(it)) return commit(spec, it, why, card, idx);
  if (BELT.armed && BELT.armed.k === spec.k) return commit(spec, it, why, card, idx);
  BELT.armed = spec;
  paintArmed(card);
}

function ruleBody(spec, it, why) {
  if (BELT.queue === 'vendors')
    return ['/api/vendor-scope', {name: it.name, call: spec.call, why,
      description: it.description, website: it.website,
      source_event: it.source_event}];
  if (spec.keep)
    return ['/api/place', {id: it.id, keep: true, why,
      was: `${it.sector} / ${it.category}`,
      proposed: it.proposed_sector
        ? `${it.proposed_sector} / ${it.proposed_category}` : null,
      confidence: it.confidence, description: it.description}];
  return ['/api/place', {id: it.id, sector: spec.sector || it.proposed_sector,
    category: spec.category || it.proposed_category, why,
    was: `${it.sector} / ${it.category}`,
    proposed: it.proposed_sector
      ? `${it.proposed_sector} / ${it.proposed_category}` : null,
    confidence: it.confidence, description: it.description}];
}

async function commit(spec, it, why, card, idx) {
  if (needsWhy(it, spec, why.value)) {
    const line = card.querySelector('.beltarm');
    if (line) line.textContent = 'The guesser rated this one LOW confidence — '
      + 'it is telling you it does not know. Taking its answer needs a line '
      + 'saying what you saw that it did not. Nothing has been written.';
    why.classList.add('needed');
    why.focus();
    BELT.armed = null;
    return;
  }
  card.querySelectorAll('button.act').forEach(b => b.disabled = true);
  const [path, body] = ruleBody(spec, it, (why.value || '').trim());
  const r = await api(path, body);
  if (r.error) return refuse(r.error, card);
  toast(r.message);
  BELT.armed = null;
  BELT.ruled++;
  BELT.done.add(idx);
  await afterRuling(1);
  advance();
}

/* Families settle in one ruling, literally: one decision writes N records,
   each carrying the same reason, and every one of those names is never asked
   again. The names are listed before the write because a bulk ruling that
   nobody counted out loud is the failure the journal exists to make
   survivable. */
async function settleFamily(it, why, card, idx) {
  if (!BELT.armed || !BELT.armed.call) {
    BELT.armed = null;
    paintArmed(card);
    const line = card.querySelector('.beltarm');
    if (line) line.textContent = 'Arm a call first — I, S or O — then F applies '
      + 'that same call to the whole family.';
    return;
  }
  const peers = [];
  BELT.items.forEach((x, j) => {
    if (x.theme === it.theme && !BELT.done.has(j)) peers.push({x, j});
  });
  const names = peers.map(p => p.x.name);
  if (!confirm(`“${BELT.armed.label}” for all ${names.length} in ${it.theme}?\n\n`
      + names.slice(0, 12).join(', ')
      + (names.length > 12 ? `, and ${names.length - 12} more` : ''))) return;
  card.querySelectorAll('button.act').forEach(b => b.disabled = true);
  const r = await api('/api/vendor-scope-all', {names, call: BELT.armed.call,
    theme: it.theme, why: (why.value || '').trim()});
  if (r.error) return refuse(r.error, card);
  toast(r.message);
  BELT.armed = null;
  BELT.ruled += names.length;
  peers.forEach(p => BELT.done.add(p.j));
  await afterRuling(names.length);
  advance();
}

/* A refusal is the system working, so it gets the skeptical penguin and the
   server's own words - never a swallowed error and never a retry loop. */
function refuse(message, card) {
  /* Disarm on refusal, same as success does. Leaving BELT.armed loaded meant
     the card rebuilt after "Back to the item" showed nothing armed while the
     old call was still primed - one keypress or a bare Enter committed a
     ruling the screen said was not armed. A refused write must put the belt
     back exactly where an unarmed one is. */
  BELT.armed = null;
  const n = el('div', 'refusal');
  n.appendChild(penguin('skeptic'));
  const t = el('div');
  t.appendChild(el('h3', null, 'Refused — nothing was written'));
  t.appendChild(el('div', 'kv', message));
  const row = el('div', 'row');
  const again = el('button', 'act', 'Back to the item');
  again.onclick = () => renderBelt();
  row.appendChild(again);
  t.appendChild(row);
  n.appendChild(t);
  card.replaceWith(n);
  toast(message, true);
}

/* Forward past anything already ruled. A bulk family ruling settles rows
   further down the belt, and being handed one of those again would ask a
   question that has an answer. */
function advance() {
  BELT.i = nextIndex(BELT.i);
  renderBelt();
}

/* The header numbers move on every ruling, because a bar that only updates
   on reload is a bar you stop believing. The state is stepped locally (a
   ruling moves exactly one row from left to done) and the agree-rate is
   refetched, since only the server can recompute it from the records. */
async function afterRuling(n) {
  refreshCounts();
  if (QINFO && QINFO.state) {
    QINFO.state.done += n;
    QINFO.state.left = Math.max(0, QINFO.state.left - n);
    const tot = QINFO.state.done + QINFO.state.left;
    QINFO.state.pct = tot ? Math.round(100 * QINFO.state.done / tot) : 100;
  }
  if (QINFO && QINFO.agree) QINFO.agree = await api('/api/agree');
  repaintHead();
}

function repaintHead() {
  const old = $('.qhead');
  const body = $('#qbody');
  if (!old || !body || !QINFO) return;
  old.replaceWith(queueHead(TAB, QINFO, body));
}

function beltEnd() {
  const n = el('div', 'beltend');
  const st = QINFO && QINFO.state;
  const cleared = st && !st.left;
  n.appendChild(penguin(cleared ? 'offer' : 'hunt'));
  const t = el('div');
  t.appendChild(el('h3', null, cleared && st ? st.name
    : 'Belt empty — that is this run finished'));
  const bits = [];
  if (BELT.ruled) bits.push(`${BELT.ruled} ruled`);
  if (BELT.skipped) bits.push(`${BELT.skipped} skipped and still waiting`);
  if (st) bits.push(`${st.left} left in the queue`);
  t.appendChild(el('div', 'kv', bits.join(' · ') || 'nothing ruled this run'));
  if (st && st.left)
    t.appendChild(el('div', 'kv',
      `“${st.name}” is what this queue is heading for. Not there yet.`));
  const row = el('div', 'row');
  const again = el('button', 'act go', 'Load the belt again');
  again.onclick = () => show(TAB);
  const start = el('button', 'act', 'Back to Start here');
  start.onclick = () => showStart();
  row.append(again, start);
  t.appendChild(row);
  n.appendChild(t);
  return n;
}

/* Somewhere else: the proposal is wrong but the row still needs filing. The
   selects are the same two the list renderer uses, opened in place. */
function openEdit(it, why, card, idx) {
  if (card.querySelector('.beltedit')) {
    card.querySelector('.beltedit select').focus();
    return;
  }
  const box = el('div', 'beltprop beltedit');
  box.appendChild(el('div', 'plabel', 'file it under'));
  const cats = {};
  (SCHEMA.sectors || []).forEach(s => { cats[s.name] = s.categories; });
  const secSel = el('select', 'sel'), catSel = el('select', 'sel');
  const fill = () => {
    catSel.innerHTML = '';
    (cats[secSel.value] || []).forEach(x => {
      const o = el('option', null, x); o.value = x; catSel.appendChild(o);
    });
  };
  Object.keys(cats).forEach(x => {
    const o = el('option', null, x); o.value = x; secSel.appendChild(o);
  });
  secSel.value = cats[it.proposed_sector] ? it.proposed_sector : it.sector;
  fill();
  if (it.proposed_category && (cats[secSel.value] || []).includes(it.proposed_category))
    catSel.value = it.proposed_category;
  secSel.onchange = fill;
  const row = el('div', 'beltacts');
  const go = el('button', 'act go', 'File it here');
  go.onclick = () => commit({sector: secSel.value, category: catSel.value},
                            it, why, card, idx);
  row.append(secSel, catSel, go);
  box.appendChild(row);
  card.querySelector('.beltacts').before(box);
  secSel.focus();
}

/* One listener for the whole belt. Typing in the why box is typing, not
   ruling - the guard is focus, not a mode. */
document.addEventListener('keydown', e => {
  if (!BELT.queue || TAB !== BELT.queue || !BELT.host) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const card = BELT.host.querySelector('.belt');
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'SELECT'
                    || t.tagName === 'TEXTAREA');
  if (typing) {
    if (e.key === 'Escape') { t.blur(); e.preventDefault(); }
    return;
  }
  if (!card) return;
  const hit = k => card.querySelector('button.act[data-k="' + k + '"]');
  if (e.key === 'Escape') {
    BELT.armed = null; paintArmed(card); e.preventDefault(); return;
  }
  if (e.key === 'Enter') {
    if (!BELT.armed) return;
    const b = hit(BELT.armed.k);
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
    return;
  }
  if (e.key === 'w') {
    const w = card.querySelector('input.txt');
    if (w) { w.focus(); e.preventDefault(); }
    return;
  }
  const b = hit((e.key || '').toLowerCase());
  if (b && !b.disabled) { e.preventDefault(); b.click(); }
});

/* The reason sent is the BUTTON'S OWN WORDS, which is a real answer somebody
   chose ("Cannot find it", "Nothing public anywhere"), or nothing at all.
   It used to send the literal string "dismissed in admin" on every dismissal,
   and the why-coverage meter counts any non-empty why — so the one number in
   this admin that measures care was being topped up by the admin itself. */
function dismissBtn(queue, key, label) {
  const b = el('button', 'act mute', label || 'Not an issue');
  b.onclick = async () => {
    const r = await api('/api/dismiss', {queue, key, why: label || ''});
    if (r.error) return toast(r.error, true);
    b.closest('.item').remove(); refreshCounts();
  };
  return b;
}

/* ------------------------------------------------------------------ renderers */
/* A company's own mark, next to its name in the queues.
   Same shape the public board uses: the initials tile is the element, and the
   logo sits ON it rather than replacing it - so a missing or slow logo shows
   the tile underneath instead of an empty square, and nothing shifts when it
   arrives. Deliberately NOT loading="lazy": on the public board that attribute
   silently prevented all 62 logos from ever loading. */
const TILE_BG = ['#e8e3dc','#dfe6e3','#e6e0ea','#eae4dc','#dde5ea','#eae0e0'];
function logoTile(name, cid) {
  const wrap = el('span', 'ltile');
  let h = 0; for (const ch of name || '') h = (h * 31 + ch.charCodeAt(0)) | 0;
  wrap.style.background = TILE_BG[Math.abs(h) % TILE_BG.length];
  const w = (name || '').replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/);
  wrap.textContent = ((w[0] || '?')[0] + (w[1] ? w[1][0] : ((w[0] || '?')[1] || '')))
    .replace(/[^A-Za-z]/g, '').toUpperCase();
  const ext = (META && META.logos) ? META.logos[cid] : null;
  if (ext) {
    const img = el('img');
    img.src = '/assets/logos/' + encodeURIComponent(cid) + '.' + encodeURIComponent(ext);
    img.alt = '';
    img.onerror = () => img.remove();
    wrap.appendChild(img);
  }
  return wrap;
}

function withLogo(h3, c) {
  if (!c || !c.id) return h3;
  h3.insertBefore(logoTile(c.name, c.id), h3.firstChild);
  h3.classList.add('hasLogo');
  return h3;
}

const RENDER = {};

RENDER.duplicates = g => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, g.members.map(m => m.name).join('  ·  ')));
  const cols = el('div', 'cols'); cols.style.marginTop = '10px';
  g.members.forEach(m => {
    const c = el('div', 'mem');
    c.appendChild(el('div', null, m.name));
    const meta = el('div', 'kv', `${m.sector} → ${m.category}`);
    c.appendChild(meta);
    c.appendChild(el('div', 'kv', `${m.website || 'no website'} · ats ${m.ats || 'unknown'}`
      + ` · ${m.postings} posting${m.postings === 1 ? '' : 's'}`));
    const keep = el('button', 'act go', 'Keep this one');
    keep.style.marginTop = '8px';
    keep.onclick = async () => {
      const drops = g.members.filter(x => x.id !== m.id);
      for (const d of drops) {
        const r = await api('/api/merge', {keep: m.id, drop: d.id});
        if (r.error) return toast(r.error, true);
        toast(r.message);
      }
      n.remove(); refreshCounts();
    };
    c.appendChild(keep);
    cols.appendChild(c);
  });
  n.appendChild(cols);
  const row = el('div', 'row'); row.appendChild(dismissBtn('duplicates', g.key, 'Not duplicates'));
  n.appendChild(row);
  return n;
};

RENDER.websites = c => {
  const n = el('div', 'item');
  n.appendChild(withLogo(el('h3', null, c.name), c));
  n.appendChild(el('div', 'kv', `${c.sector} → ${c.category}`
    + (c.description ? ' · ' + c.description : '')));
  /* Eleven of the fifty rows here are one half of a duplicate pair whose other
     half already carries the website. Answering those is work with no possible
     right answer - the answer is a merge, and it lives in the duplicates queue.
     The twin is named rather than the row being hidden, because a pair can turn
     out to be a parent and its division, and then the website question is real
     again. That call is the owner's. */
  if (c.same_name_as && c.same_name_as.length) {
    const t = c.same_name_as[0];
    const w = el('div', 'kv');
    w.appendChild(el('span', 'warn', 'Also on the board as '));
    w.appendChild(el('strong', null, t.name));
    w.appendChild(document.createTextNode(t.website
      ? ` — which already has ${t.website}. If these are one company, this is a merge, not a missing site.`
      : ' — which has no site either. If these are one company, merge them first.'));
    n.appendChild(w);
  }
  const row = el('div', 'row');
  const inp = el('input', 'txt'); inp.type = 'text';
  inp.placeholder = 'https://company.com';
  const check = el('button', 'act', 'Check');
  const save = el('button', 'act go', 'Save'); save.disabled = true;
  let verified = null;
  check.onclick = async () => {
    check.disabled = true; check.textContent = 'checking…';
    const r = await api('/api/verify-website', {url: inp.value, name: c.name});
    check.disabled = false; check.textContent = 'Check';
    n.querySelectorAll('.evi').forEach(e => e.remove());
    if (r.error) return toast(r.error, true);
    verified = r;
    const e = el('div', 'evi');
    /* A page we could not read is not a page that said nothing. Rendering the
       normal panel here invented two negative facts about a company out of a
       failed fetch. */
    if (r.unreadable) {
      const u = el('div');
      /* Not 'warn'. A site that blocks robots is not a problem with the
         address, and colouring it like one told the owner to distrust a link
         that is probably fine. The tone comes from the server so the two
         halves cannot drift. */
      u.appendChild(el('span', r.tone === 'neutral' ? 'kv' : 'warn', r.message));
      e.appendChild(u);
      n.appendChild(e);
      save.disabled = false;
      return;
    }
    /* The title is whatever the pasted site chose to send back, so it is written
       as text and never as markup: a <title> that was an img tag with an onerror
       came back byte for byte and ran when this was one innerHTML template. */
    /* Say what was DONE and what it MEANS, not what the fields are called.
       "Page title: ..." names a field at somebody; what they need to know is
       that we went and looked, what the page called itself, and whether that
       is reason to trust the address. Same facts, told as what happened. */
    let host = r.url, deep = false;
    try { const u = new URL(r.url);
          host = u.hostname.replace(/^www\./, '');
          deep = u.pathname.replace(/\/$/, '') !== ''; } catch (_) {}

    const tline = el('div');
    tline.appendChild(document.createTextNode('We opened '));
    tline.appendChild(el('b', null, host));
    tline.appendChild(document.createTextNode(' and read it.'));
    e.appendChild(tline);

    const said = el('div');
    said.style.marginTop = '4px';
    if (r.title) {
      said.appendChild(document.createTextNode('The page calls itself \u201c'));
      said.appendChild(document.createTextNode(r.title));
      said.appendChild(document.createTextNode('\u201d.'));
    } else {
      said.appendChild(document.createTextNode('The page has no title at all.'));
    }
    e.appendChild(said);

    const vline = el('div');
    vline.style.marginTop = '4px';
    vline.appendChild(r.parked
      ? el('span', 'bad', 'This is a holding page \u2014 the domain is parked or '
                          + 'up for sale, so it is not their site.')
      : el('span', 'ok', 'A real page, not a parked domain.'));
    vline.appendChild(document.createTextNode(' '));
    /* "It never names this company" was being said about eagleview.com, which
       has the company's logo on it. The page said "Eagleview"; the record says
       "EagleView Technologies". Crying wolf on a page that is obviously right
       teaches you to click past the warning - and that warning is the only
       thing between a squatter and the dataset. So name the words. */
    const idn = r.identity || {};
    const nameGuessName = (idn.present || []).join(' ');
    if (r.identifies) {
      vline.appendChild(el('span', 'ok', 'It names this company, so the address is theirs.'));
    } else if (idn.domain_is_lead && (idn.present || []).length) {
      vline.appendChild(el('span', 'warn',
        'The page says \u201c' + idn.present.join(' ') + '\u201d but never \u201c'
        + (idn.missing || []).join(' ') + '\u201d, and the domain matches the part '
        + 'it does say. Usually that is the same company under a shorter name \u2014 '
        + 'but it is also what a different business on the obvious domain looks like. '
        + 'Your call.'));
    } else {
      vline.appendChild(el('span', 'warn',
        'It never names this company \u2014 it may be the wrong business, or one '
        + 'that renamed. Your call.'));
    }

    /* Disagreeing with the check used to cost you the disagreement: you hit
       Save and the reason evaporated. Now it is a fact with somewhere to go -
       the name the page uses goes into also_known_as, so identifies() passes
       for this company from here on, and the label makes it possible to say
       how often this warning is worth heeding. */
    if (!r.identifies) {
      const fix = el('div', 'idfix');
      fix.style.cssText = 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center';
      fix.appendChild(el('span', 'kv', 'It does say the name \u2014 read it off the page:'));
      const nameIn = el('input', 'in');
      nameIn.style.cssText = 'flex:1;min-width:170px';
      nameIn.placeholder = 'leave blank and it will read the page';
      nameIn.value = (idn.present || []).length
        ? (nameGuessName || (idn.present || []).join(' ')) : '';
      const yes = el('button', 'btn primary', 'Yes, that is them');
      const no = el('button', 'btn', 'No, wrong company');
      const out = el('div', 'kv');
      out.style.cssText = 'flex-basis:100%;margin-top:4px';
      const rule = async (verdict, forced) => {
        yes.disabled = no.disabled = true;
        const res = await api('/api/identity-ruling', {
          id: c.id, verdict,
          // deliberately blank unless you picked or typed one: the server
          // reads the page and works the name out, which is one click instead
          // of transcribing something already on screen
          said_name: forced || nameIn.value.trim(),
          page_says: (r.identity || {}).says || r.title || '', url: r.url});
        yes.disabled = no.disabled = false;
        if (res.error) { out.textContent = res.error; out.style.color = 'var(--warn)'; return; }
        if (res.ask) {
          // it read the page and found more than one plausible answer
          out.textContent = '';
          out.appendChild(document.createTextNode(res.message + ' '));
          (res.candidates || []).forEach(cand => {
            const b = el('button', 'btn', cand.name);
            b.title = cand.why;
            b.style.margin = '0 4px 4px 0';
            b.onclick = () => rule('same', cand.name);
            out.appendChild(b);
          });
          return;
        }
        toast(res.message);
        fix.remove();
        if (res.recheck) check.click();   // show it going green, not just say so
      };
      yes.onclick = () => rule('same');
      no.onclick = () => rule('different');
      fix.append(nameIn, yes, no, out);
      e.appendChild(fix);
    }
    e.appendChild(vline);

    /* A deep path is how an acquisition and a product page both sneak in.
       aws.amazon.com/govcloud-us/ looks convincing and is neither the company
       nor the front door the logo and board steps work from. */
    if (deep) {
      const d = el('div');
      d.style.marginTop = '4px';
      d.appendChild(el('span', 'warn',
        'This is a page inside the site, not the front door. Saving it is fine, '
        + 'but the logo and job-board steps work from the homepage \u2014 '
        + host + ' may be the better address.'));
      e.appendChild(d);
    }

    /* SAY WHEN IT IS FINE. Every branch above had something to caveat, so the
       panel only ever spoke up to hedge - and a screen that only hedges reads
       as a screen that always found a problem. When the page is real, names
       the company, and is the front door, there is nothing to weigh: say so
       and get out of the way. */
    if (!r.parked && r.identifies && !deep) {
      const good = el('div');
      good.style.marginTop = '6px';
      good.appendChild(el('span', 'ok', 'Nothing here needs a decision \u2014 '
                        + 'this address checks out. Hit Save.'));
      e.appendChild(good);
    }

    const nxt = el('div', 'kv');
    nxt.style.marginTop = '6px';
    nxt.textContent = 'Save writes this address to the card, fetches their logo, '
                    + 'and looks for a job board. Nothing else changes.';
    e.appendChild(nxt);
    n.appendChild(e);
    save.disabled = r.parked;
    /* The page just told us what the company calls itself. When that differs
       from the stored name, offer the rename with the save - editable,
       because a <title> is marketing copy and the person decides. The old
       name is kept as an alias, same as a merge. */
    n.querySelectorAll('.renamer').forEach(x => x.remove());
    /* Taking the FIRST segment assumes every title is "Company | tagline".
       Plenty are the other way round: eagleview.com is titled "Geospatial
       Intelligence, Aerial Imagery and Data | Eagleview", and taking [0]
       offered to rename EagleView Technologies to a marketing sentence and
       keep the real name as an alias. So: pick the segment that CORROBORATES
       THE DOMAIN, and if none does, offer no rename at all. A silent no is
       cheap; a wrong rename is visible on the public site. */
    /* Choosing which part of a <title> is the company name.

       Taking the FIRST segment assumes every title is "Company | tagline".
       Plenty are the other way round: eagleview.com is titled "Geospatial
       Intelligence, Aerial Imagery and Data | Eagleview", and taking [0]
       offered to rename EagleView Technologies to a marketing sentence.

       But refusing everything the domain does not corroborate is worse in the
       other direction: aframesolutions.com now titles itself "ArcSuite AI",
       which is a genuine rebrand and exactly what this feature is for.

       So: prefer a segment the domain backs up, fall back to one that at
       least LOOKS like a name, and say which of the two happened. The person
       decides; the box just stops proposing sentences. */
    const nameGuess = (() => {
      const segs = (r.title || '').split(/\s*[—|·–]\s*|\s+-\s+/)
        .map(x => x.trim()).filter(Boolean);
      if (!segs.length) return null;
      let host = '';
      try { host = new URL(r.url).hostname.replace(/^www\./, '').split('.')[0]; }
      catch (_) {}
      const squash = x => x.toLowerCase().replace(/[^a-z0-9]/g, '');
      const GENERIC = /^(home|welcome|careers?|jobs?|about|contact|index|untitled|homepage)$/i;
      // a company name is a few words, not a sentence, and does not trail a comma
      const nameish = x => x.split(/\s+/).length <= 4 && !/[,.;:]$/.test(x)
                           && !GENERIC.test(x.replace(/\s+/g, ''))
                           && x.length >= 2 && x.length <= 60;
      if (host) {
        const hit = segs.find(x => squash(x) && squash(x).includes(host));
        if (hit && nameish(hit)) return {name: hit, sure: true};
      }
      const first = segs.find(nameish);
      return first ? {name: first, sure: false} : null;
    })();
    const canonical = nameGuess ? nameGuess.name : '';
    if (canonical && canonical.toLowerCase() !== c.name.toLowerCase()
        && canonical.length >= 2 && canonical.length <= 60) {
      /* IS THE NAME ALREADY TAKEN? conduent.com is titled "Transportation
         Solutions - Conduent", so this offered to rename Conduent
         Transportation to "Conduent" - and a company called Conduent was
         already on the board, on that same domain, with the corporate job
         board wired. Accepting would have manufactured a duplicate to merge
         back tomorrow.
         The check reads the board rather than the page, which is the whole
         point: everything above this line looks at the site in isolation and
         cannot see the rest of the map. */
      (async () => {
        const squash2 = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const res = await api('/api/search-companies', {q: canonical});
        const clash = (res.results || []).find(
          x => x.id !== c.id && squash2(x.name) === squash2(canonical));
        if (!clash) return;
        const w = n.querySelector('.renamer');
        if (w) w.remove();
        const taken = el('div', 'renamer kv');
        taken.appendChild(el('span', 'warn',
          'The page calls itself \u201c' + canonical + '\u201d, and a company '
          + 'called \u201c' + clash.name + '\u201d is already on the board'
          + (clash.sector ? ' under ' + clash.sector : '') + '. '));
        taken.appendChild(document.createTextNode(
          'No rename is offered: if these are one company that is a MERGE, '
          + 'which keeps both records\u2019 research. Renaming would leave two '
          + 'rows with the same name.'));
        n.insertBefore(taken, row.nextSibling);
      })();
      const wrapR = el('div', 'renamer kv');
      wrapR.appendChild(document.createTextNode('rename to '));
      /* whether the domain corroborates the new name is the difference between
         "they rebranded" and "I grabbed a tagline", so it is said out loud */
      const ri = el('input'); ri.value = canonical; ri.id = 'rn-' + c.id;
      wrapR.appendChild(ri);
      wrapR.appendChild(document.createTextNode(` (was “${c.name}”, kept as an alias)`));
      wrapR.appendChild(el('span', nameGuess.sure ? 'ok' : 'warn',
        nameGuess.sure
          ? ' — the domain matches this name'
          : ' — the domain does not mention this name, so it may be a tagline rather '
            + 'than a rebrand. Check before saving.'));
      n.insertBefore(wrapR, row.nextSibling);
    }
  };
  save.onclick = async () => {
    const ri = document.getElementById('rn-' + c.id);
    const newName = ri && ri.value.trim();
    save.disabled = true; save.textContent = 'saving, fetching, probing…';
    // one paste buys three things: the field, the company's mark, and a
    // shot at their board. The button says so while it works.
    const r = await api('/api/save-website', {
      id: c.id, url: verified.url,
      name: (newName && newName.toLowerCase() !== c.name.toLowerCase()) ? newName : ""});
    save.disabled = false; save.textContent = 'Save';
    if (r.error) return toast(r.error, true);
    toast(r.message);
    const won = el('div', 'kv');
    if (r.logo) won.appendChild(el('span', 'chip ok', 'logo'));
    // the board ref was just read off the company's own site
    if (r.board) won.appendChild(el('span', 'chip ok', 'board: ' + r.board));
    n.appendChild(won);
    setTimeout(() => { n.remove(); refreshCounts(); }, r.logo || r.board ? 1400 : 300);
  };
  row.append(inp, check, save, dismissBtn('websites', c.id, 'No site exists'));
  n.appendChild(row);
  return n;
};
