<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLED JOBS — Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap');

  /* ── The Modernist design system from the deck, on the SLED palette ──
     Taken from _ds/modernist/styles.css rather than approximated: Archivo at
     weight 800 for headings, a STRICT 4px spacing scale, the 42/32/25/20/16/13
     type ramp, and radius 0 on everything.

     The zero radius is the character of the whole thing. The deck is a
     modernist grid - hairline rules, tabular figures, square corners - and
     the rounded cards I had been building read as a different product
     entirely. Borders only where two systems meet; whitespace does the rest
     of the grouping.

     The system's own accent is a red-orange (#ec3013). That is the design
     system's default, not this brand, so the palette stays SLED and only the
     structure is borrowed. */
  :root{
    --font-heading:"Archivo",system-ui,sans-serif;
    --font-body:"Archivo",system-ui,sans-serif;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-6:24px; --space-8:32px;
    --radius:0px;
  }
  /* SLED JOBS palette (data/brand.json). Ice is the ground and the only
     white; cards sit on Belly; rules are Frost. --dim is DERIVED - Fog is
     2.7:1 and the kit says labels only, never reading copy - so it is Fog's
     own hue darkened to 4.6:1. --faint IS Fog, and is used only for tiny
     uppercase labels. Beak is a highlight and is never text. */
  :root{ --bg:#E8F1F7; --panel:#FAF7F0; --line:#C9DCE8; --ink:#1F2536; --dim:#556F82;
         --faint:#7C97AA; --accent:#0B57C4; --warn:#C1341F; --bad:#C1341F;
         --beak:#F5A623; --chip:#DCE9F1; }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    /* ground becomes Penguin, so the accents lighten along their own hue
       until they clear AA on it again (Badge 2.3:1 -> 4.7:1) */
    --bg:#1F2536; --panel:#262E42; --line:#39435C; --ink:#E8F1F7; --dim:#A8BCCA;
    --faint:#7C97AA; --accent:#478EF5; --warn:#E46855; --bad:#E46855;
    --beak:#F5A623; --chip:#2E3852; }}
  *{box-sizing:border-box}
  /* every column of numbers lines up, which is half of why the
     deck's tables look the way they do */
  .bignum,.tabn,.num,td,.stamp,.ppct,.health strong{font-variant-numeric:tabular-nums}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 var(--font-body)}
  a{color:var(--accent);text-underline-offset:2px}
  header{max-width:1180px;margin:0 auto;padding:22px 22px 0}
  h1,h2,h3,h4{font-family:var(--font-heading);font-weight:800;
    letter-spacing:-.015em;line-height:1.12}
  h1{font-size:25px;margin:0 0 3px}
  .sub{color:var(--dim);font-size:13px}
  nav{display:flex;gap:3px;margin:16px 0 0;flex-wrap:wrap}
  nav button{background:none;border:0;padding:8px 13px;border-radius:0;font:inherit;
    font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
  nav button[aria-selected=true]{color:var(--ink);background:var(--panel);
    border-bottom-color:var(--accent);font-weight:600}
  nav .n{font-variant-numeric:tabular-nums;color:var(--faint);margin-left:5px;font-size:11.5px}
  main{max-width:1180px;margin:0 auto;padding:0 22px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:18px;min-height:340px}
  .intro{font-size:12.5px;color:var(--faint);margin:0 0 16px;line-height:1.65;max-width:78ch}
  .item{border:1px solid var(--line);border-radius:0;padding:13px 15px;margin-bottom:10px}
  .item h3{margin:0;font-size:14.5px;font-weight:600}
  .kv{color:var(--dim);font-size:12.5px;margin:4px 0 0}
  .chip{font-size:11px;padding:2px 8px;border-radius:0;background:var(--chip);
    color:var(--dim);white-space:nowrap;display:inline-block;margin-right:5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
  button.act{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:0;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  button.act:hover{border-color:var(--accent)}
  button.act.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.act.mute{color:var(--faint)}
  button.act:disabled{opacity:.45;cursor:default}
  input.txt,select.sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);
    border-radius:0;background:var(--bg);color:var(--ink)}
  input.txt{min-width:270px;flex:1}
  /* the reason box when a low-confidence ruling was tried without one */
  input.txt.needed{border-color:var(--warn)}
  /* the console-code prompt. Docked, not modal: it blocks rulings, not
     reading, and the queues are worth looking at either way. */
  /* THE CODE BAR IS NOT A SEARCH BAR, and it read as one: a full-width strip
     pinned to the bottom with a wide text input in it is the shape every site
     uses for search, so it got ignored, and the last rows of every queue sat
     behind it. Now it is a compact card in the corner, the input is six
     characters wide in mono with letter-spacing so it looks like a code, and
     the body gets padding while it is up so it covers nothing. */
  .codebar{position:fixed;right:16px;bottom:16px;left:auto;z-index:40;
    display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;
    max-width:390px;padding:13px 15px;
    background:var(--panel);border:1px solid var(--warn);
    border-left:3px solid var(--warn);
    box-shadow:0 6px 22px rgba(0,0,0,.28);
    color:var(--dim);font-size:12.5px;line-height:1.55}
  .codebar .cb-t{flex:1 1 100%;color:var(--ink);font-weight:600;font-size:13px}
  .codebar .cb-w{flex:1 1 100%}
  /* min-width:270px and flex:1 on input.txt are what made this look like a
     search field; both have to be undone here or the 9ch never applies. */
  .codebar input.txt{width:9ch;min-width:0;flex:0 0 auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.22em;text-transform:uppercase;text-align:center}
  body.has-codebar{padding-bottom:150px}
  @media (max-width:560px){ .codebar{left:16px;max-width:none} }
  .ok{color:var(--accent)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .empty{color:var(--faint);padding:44px 0;text-align:center;font-size:13px}
  .evi{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:0;
    font-size:12.5px;line-height:1.6}
  .evi code{font-size:12px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .mem{border:1px solid var(--line);border-radius:0;padding:10px 12px;font-size:12.5px}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0;
    padding:11px 15px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.13);max-width:380px}
  .toast.bad{border-left-color:var(--bad)}
  .count{color:var(--faint);font-size:12px;margin-left:auto}
  .board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
  .rail{flex:0 0 172px;position:sticky;left:0}
  .rail h4,.col h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  .rail .drop{border:1px dashed var(--line);border-radius:0;padding:8px 10px;margin-bottom:6px;
    font-size:12.5px;color:var(--dim)}
  .col{flex:0 0 236px;background:var(--bg);border:1px solid var(--line);border-radius:0;
    padding:10px;min-height:120px}
  .col.wide{flex:0 0 292px}
  .col .n{color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
  .drop.over,.col.over{border-color:var(--accent);background:var(--chip)}
  .cd{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:7px 9px;
    margin-bottom:6px;font-size:12.5px;cursor:grab;line-height:1.4}
  .cd:active{cursor:grabbing}
  .cd.dragging{opacity:.4}
  .cd .m{color:var(--faint);font-size:11px;margin-top:2px}
  .cd .sug{color:var(--warn);font-size:11px;margin-top:2px}
  .more{font-size:11.5px;color:var(--faint);text-align:center;padding:5px;cursor:pointer}
  .more:hover{color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden}
  .seg button{font:inherit;font-size:12.5px;padding:6px 13px;border:0;background:var(--bg);
    color:var(--dim);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
  .grouphead{margin:22px 0 8px;padding:12px 14px;border:1px solid var(--line);
    border-radius:0;background:var(--chip)}
  .grouphead strong{display:block;margin-bottom:8px;font-size:14px}
  .grouphead input{width:100%;margin-bottom:8px}
  .starthead{display:flex;align-items:baseline;gap:12px;margin:6px 0 16px}
  .starthead strong{font-size:17px}
  .starthead .dim{color:var(--faint);font-size:12.5px;margin-left:auto}
  /* the counter: three numbers, sized like a floor board */
  .counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:2px 0 10px}
  .bignum{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:14px 16px;border-top:3px solid var(--line)}
  .bignum strong{display:block;font-size:34px;font-weight:800;letter-spacing:-.025em;
    line-height:1.05;font-variant-numeric:tabular-nums}
  .bignum span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);margin-top:4px;line-height:1.35}
  .bignum.amber{border-top-color:var(--warn)}
  .bignum.green{border-top-color:var(--accent)}
  .bignum.green strong{color:var(--accent)}
  .yourline{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);
    margin-bottom:20px}
  .yourline .pb{background:var(--accent);color:var(--bg);font-weight:700;font-size:10.5px;
    padding:2px 9px;border-radius:0;letter-spacing:.04em;text-transform:uppercase}
  .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin:22px 0 9px}
  .sortie{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:16px 18px;margin-bottom:10px}
  .sortie h3{margin:0 0 5px;font-size:15.5px;letter-spacing:-.01em}
  .sortie.muted{background:none}
  .barwrap{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
  .endbar{flex:1;height:7px;border-radius:0;background:var(--chip);overflow:hidden}
  .endfill{height:100%;border-radius:0;background:var(--accent)}
  .toward{font-size:11.5px;color:var(--dim);white-space:nowrap}
  .far{font-size:11.5px;color:var(--dim);margin-top:4px}
  /* the floors: stamps for what is finished, bars for what is close */
  .floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .floor{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:13px 14px}
  .floor .fname{font-size:12.5px;font-weight:650;margin-bottom:7px}
  .floor .fsub{font-size:10.5px;color:var(--faint);margin-top:6px}
  .floor.stamped{display:flex;flex-direction:column;align-items:center;text-align:center;
    color:var(--accent);border-color:var(--accent)}
  .floor.stamped .fname{margin-top:6px;color:var(--ink)}
  .hintline{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}
  .tape{background:var(--panel);border:1px solid var(--line);border-radius:0;
    padding:12px 16px;font-size:12px}
  .trow{display:flex;gap:10px;align-items:baseline;padding:4px 0;color:var(--dim)}
  .trow + .trow{border-top:1px solid var(--chip)}
  .tdate{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .twhy{color:var(--faint);font-style:italic;margin-left:auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
  .cdinfo{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    font-size:12.5px;line-height:1.55;color:var(--dim);cursor:default}
  .cdinfo a{display:inline-block;margin-top:5px}
  .cdinfo .chip{margin:4px 4px 0 0}
  .ltile{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:0;font:700 10px/1 system-ui;
    color:#3a352f;margin-right:9px;vertical-align:-6px;position:relative;
    overflow:hidden;flex:none}
  .ltile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    background:#fff}
  h3.hasLogo{display:flex;align-items:center}
  .hero{display:flex;gap:20px;align-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:0;padding:18px 22px;margin:14px 0 12px}
  .hero .peng{width:180px;flex:none}
  .herobody{flex:1;min-width:0}
  .heroline{font-size:19px;font-weight:700;letter-spacing:-.015em}
  .health{margin:6px 0 12px;display:flex;align-items:baseline;gap:7px}
  .health strong{font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .health span{color:var(--dim);font-size:13px}
  .parts{display:flex;flex-direction:column;gap:7px}
  .part{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .part .pl{width:170px;flex:none;color:var(--dim)}
  .pbar{flex:1;height:6px;background:var(--chip);border-radius:0;overflow:hidden}
  .pfill{display:block;height:100%;background:var(--accent)}
  .pfill.low{background:var(--warn)}
  .ppct{width:38px;text-align:right;color:var(--faint);
    font-variant-numeric:tabular-nums}
  .pnote{font-size:11.5px;color:var(--faint);margin:1px 0 0 180px}
  .tape{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
  .stamp{font-size:11px;padding:3px 9px;border-radius:0;background:var(--chip);
    color:var(--dim);white-space:nowrap}
  .stamp.undone{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
  /* ── Screen 2: working one queue ───────────────────────────────────────
     The header a queue wears: the state it is heading for, how far along it
     is, and the grip you are holding it with. Same 4px scale, same hairline
     rules, same zero radius as everything else - a belt that looked like a
     different product would read as a different product. */
  .qhead{border:1px solid var(--line);background:var(--panel);padding:16px 18px;
    margin:0 0 16px}
  .qtop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .qtop h2{font-size:20px;margin:0}
  .qtop .qend{font-size:13px;color:var(--dim)}
  .qtop .seg{margin-left:auto}
  .qbar{display:flex;align-items:center;gap:12px;margin:12px 0 0}
  .qleft{font-size:11.5px;color:var(--faint);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .qhead > .qleft{margin-top:8px}
  /* THE AGREE-RATE. The honest counterweight to a fast loop, so it sits on
     the header where the loop is, not buried in a stats page. */
  .agree{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--dim);line-height:1.6}
  .agree strong{font-variant-numeric:tabular-nums;color:var(--ink)}
  .agree .unmeasured{color:var(--warn)}
  .conflist{margin-top:4px;font-size:11.5px;color:var(--faint)}
  .conflist span{margin-right:12px;font-variant-numeric:tabular-nums}

  /* THE BELT. One item, keyboard-first, the next one already built. */
  .belt{border:1px solid var(--line);background:var(--panel);padding:24px}
  .beltpos{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);font-variant-numeric:tabular-nums}
  .beltname{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.1;
    margin:8px 0 12px;font-family:var(--font-heading)}
  .beltdesc{font-size:16px;color:var(--dim);line-height:1.55;max-width:70ch}
  .beltmeta{margin:12px 0 0;font-size:12.5px;color:var(--dim)}
  .beltprop{margin:16px 0 0;padding:16px;border:1px solid var(--line);
    background:var(--bg)}
  .beltprop .plabel{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint)}
  .beltprop .pval{font-size:20px;font-weight:800;letter-spacing:-.015em;
    margin-top:4px;font-family:var(--font-heading)}
  .beltprop .pnone{font-size:14px;color:var(--warn);margin-top:4px}
  .beltacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
  /* ARMED, not committed. Beak is the highlight here and never the text -
     the rule the palette states outright. */
  button.act.armed{border-color:var(--beak);border-left:3px solid var(--beak);
    font-weight:600}
  .beltarm{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.6}
  .beltkeys{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}
  .kbd{display:inline-block;min-width:18px;text-align:center;border:1px solid var(--line);
    padding:1px 5px;font:inherit;font-size:11px;color:var(--dim);margin-right:5px;
    font-variant-numeric:tabular-nums}
  /* on a filled button the key rides the button's own colour: a Frost border
     and Fog text on Badge blue is 1.4:1, which is a key cap you cannot read */
  button.act .kbd{color:inherit;border-color:currentColor;opacity:.6;
    margin:0 0 0 6px}
  .beltnext{margin-top:12px;font-size:12px;color:var(--faint)}
  .beltnext b{font-weight:600;color:var(--dim)}
  /* end of the belt, and refusals: the penguin does the work here */
  .beltend,.refusal{display:flex;gap:16px;align-items:center;border:1px solid var(--line);
    background:var(--panel);padding:20px}
  .beltend img,.refusal img{width:92px;flex:none}
  .beltend h3,.refusal h3{margin:0 0 4px;font-size:20px}
  .refusal{border-left:3px solid var(--warn)}
  .unbelted{margin-top:16px;font-size:12px;color:var(--faint);line-height:1.65;
    max-width:78ch}

  /* THE UNLOCKS. Gated on board health, never on volume. */
  .unlocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
  .unlock{border:1px solid var(--line);background:var(--panel);padding:16px 18px}
  .unlock.open{border-left:3px solid var(--accent)}
  .unlock .uname{font-size:16px;font-weight:800;font-family:var(--font-heading);
    letter-spacing:-.015em}
  .unlock .ugate{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
  .unlock .uwhat{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.6}
  .unlock .uwhy{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.6}
  .ugap{height:5px;background:var(--chip);margin-top:10px;overflow:hidden}
  .ugap span{display:block;height:100%;background:var(--accent)}

  /* THE RECEIPT. What a sitting actually changed, and nothing it did not. */
  .receipt{border:1px solid var(--line);background:var(--panel);padding:16px 18px}
  .rline{display:flex;gap:10px;align-items:baseline;padding:6px 0;font-size:13px}
  .rline + .rline{border-top:1px solid var(--chip)}
  .rline b{font-size:20px;font-weight:800;font-family:var(--font-heading);
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:44px}
  .rline .rwhat{color:var(--dim)}
  .rsince{font-size:11.5px;color:var(--faint);margin-top:10px}
  @media (max-width:700px){
    .hero{flex-direction:column;align-items:flex-start;gap:10px}
    .hero .peng{width:130px}
    .part .pl{width:120px}
    .pnote{margin-left:0}
    .qtop .seg{margin-left:0}
    .belt{padding:16px}
    .beltname{font-size:25px}
    .beltdesc{font-size:15px}
    .beltend,.refusal{flex-direction:column;align-items:flex-start}
    .beltend img,.refusal img{width:72px}
  }
</style>
</head>
<body>
<header>
  <h1>SLED JOBS — Admin</h1>
  <div class="sub" id="sub">loading…</div>
  <nav id="tabs"></nav>
</header>
<main><div class="panel" id="view"><div class="empty">loading…</div></div></main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
/* This used to be a no-op that only stringified, which handed every page title,
   job title and meta description a remote site sent us straight to innerHTML as
   live markup. Nothing calls it now - every value goes through el() or
   textContent instead - and it is kept correct for whoever writes the next line
   that does build markup as a string. The apostrophe is in the class because a
   value can land inside a single-quoted attribute. Anything built with el() or
   textContent must NOT be run through this: those escape on their own, and a
   second pass prints "&amp;" in a sector name that has an ampersand. */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body) {
  /* Every failure becomes {error}, because half the callers await this inside
     a queue loader whose "loading…" placeholder is removed only on success: a
     server restart or a dropped socket left the queue saying loading… forever,
     with the truth visible only in devtools. An {error} return flows into the
     same toast/empty-state path every handler already has. */
  let r;
  try {
    r = await fetch(path, body ? {method:'POST',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  } catch (e) {
    return {error: 'the admin server did not answer - is it still running? (' + e.message + ')'};
  }
  let j;
  try { j = await r.json(); }
  catch (e) { return {error: `the admin answered ${r.status} with something that is not JSON`}; }
  /* A ruling needs the code printed on the admin's console, which no route
     serves and no page carries — that is what stops a script on this machine
     from ruling 86 companies overnight. If it is missing or stale, say so
     here rather than letting the queue report a bare 403. */
  if (j && j.code_required) codeBar(true);
  return j;
}

/* THE CODE BAR. Normally never seen: the admin prints its URL with the code
   already in the fragment, the page pockets it and strips it from the address
   bar, and the fragment never travels to the server. This is the fallback for
   opening a bookmark instead, or for a code left over from a previous run —
   the code dies with the process, on purpose. */
function codeBar(stale) {
  let bar = $('#codebar');
  if (bar) bar.remove();
  bar = el('div', 'codebar');
  bar.id = 'codebar';
  bar.appendChild(el('div', 'cb-t', stale
    ? 'That code is from an earlier run'
    : 'Ruling code needed'));
  /* Says the CONSEQUENCE, not just the requirement. The old wording explained
     what the code was for and left the reader to work out that without it
     every ruling bounces - which is exactly what happened: a website was
     verified, saved, and refused, after the work was done. */
  bar.appendChild(el('div', 'cb-w', stale
    ? 'The code dies with the admin process, so a restart mints a new one. '
      + 'Until this matches, every ruling is refused and nothing is written.'
    : 'Until you paste it, every ruling is refused and nothing is written. '
      + 'It is printed in the terminal running admin.py; opening the link it '
      + 'prints fills this in for you.'));
  const inp = el('input', 'txt');
  inp.placeholder = '······';
  inp.maxLength = 6;
  inp.setAttribute('aria-label', 'six character ruling code');
  const save = el('button', 'act go', 'Use it');
  const later = el('button', 'act mute', 'Hide');
  const drop = () => { bar.remove(); document.body.classList.remove('has-codebar'); };
  const go = () => {
    const v = (inp.value || '').trim();
    if (!v) return;
    window.gtdCode.set(v);
    drop();
    toast('code accepted for this browser — try that again');
  };
  save.onclick = go;
  later.onclick = drop;   // it comes back on the next refused ruling
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  bar.append(inp, save, later);
  document.body.appendChild(bar);
  document.body.classList.add('has-codebar');
  inp.focus();
}
function toast(msg, bad) {
  const t = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}
