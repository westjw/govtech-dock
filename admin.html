RENDER.boards = c => {
  const n = el('div', 'item');
  n.appendChild(withLogo(el('h3', null, c.name), c));
  const meta = el('div', 'kv');
  meta.append(el('span', 'chip', c.why), el('span', 'chip', 'tier ' + c.tier),
              document.createTextNode(c.sector));
  // the floors this company stands on: how this list is actually worked
  (c.events || []).forEach(ev => meta.appendChild(el('span', 'chip ok', ev)));
  n.appendChild(meta);
  if (c.website) {
    const w = el('div', 'kv');
    const a = el('a', null, c.website); a.href = c.website; a.target = '_blank';
    a.rel = 'noopener'; w.appendChild(a); n.appendChild(w);
  }
  if (c.note) n.appendChild(el('div', 'kv', c.note));
  const row = el('div', 'row');
  const inp = el('input', 'txt'); inp.type = 'text';
  const guess = c.website ? c.website.replace(/\/$/, '') + '/careers' : '';
  inp.placeholder = 'https://company.com/careers';
  inp.value = guess;
  const check = el('button', 'act', 'Detect board');
  const save = el('button', 'act go', 'Save'); save.disabled = true;
  let found = null;
  check.onclick = async () => {
    check.disabled = true; check.textContent = 'reading…';
    const r = await api('/api/verify-board', {id: c.id, url: inp.value});
    check.disabled = false; check.textContent = 'Detect board';
    n.querySelectorAll('.evi').forEach(e => e.remove());
    if (r.error) return toast(r.error, true);
    found = r;
    const slug = r.slug_ok === null ? el('span', 'chip', 'slug not checked')
      : r.slug_ok ? el('span', 'ok', 'slug matches the company')
      : el('span', 'bad', 'slug does not match — likely a parent or another company');
    const e = el('div', 'evi');
    /* Every field here came out of the careers page that was just fetched - the
       ats ref, the note, and each job title - so all of it is built as nodes. A
       posting called "<img onerror=...>" is then a posting with a silly name. */
    const idline = el('div');
    idline.appendChild(el('b', null, r.ats.type));
    idline.appendChild(document.createTextNode(' '));
    idline.appendChild(el('code', null, r.ats.ref));
    e.appendChild(idline);
    const sline = el('div');
    sline.append(slug, document.createTextNode(
      ` · ${r.jobs} title${r.jobs === 1 ? '' : 's'} read`));
    e.appendChild(sline);
    if (r.titles && r.titles.length) {
      const tl = el('div', null, r.titles.map(t => t || '').join(' · '));
      tl.style.cssText = 'margin-top:6px;color:var(--dim)';
      e.appendChild(tl);
    }
    if (r.note) {
      const nt = el('div', null, r.note);
      nt.style.cssText = 'margin-top:6px;color:var(--faint)';
      e.appendChild(nt);
    }
    n.appendChild(e);
    if (r.empty_scan) {
      const warn = el('div', 'kv warn');
      warn.textContent = 'That page returned no titles. A scan that reads nothing has '
        + 'not shown the board is empty, only that we cannot read it — saving it would '
        + 'make an unreadable page look monitored. Try the real careers URL first.';
      e.appendChild(warn);
    }
    if (r.slug_ok === false) {
      /* This used to end "send it to the acquisitions queue instead" - a queue
         written only by the nightly sweep, that no button in this admin can
         add to. It named a door that does not exist, which is worse than
         naming none: the owner goes looking. The ruling it wanted now exists
         on this very row, so point at that. */
      const warn = el('div', 'kv bad');
      warn.appendChild(document.createTextNode(
        'Saving this would record another company\u2019s postings as '
        + c.name + '\u2019s. If their roles really do go on a parent\u2019s board, '
        + 'that is what '));
      const jump = el('a', null, '\u201cPosts elsewhere \u2192 their parent\u2019s board\u201d');
      jump.href = '#';
      /* `elsewhere` is declared further down this function; this callback
         only runs on a click, by which time it exists. Guarded anyway, because
         that is timing rather than structure, and a reorder would turn this
         link into a console error instead of a no-op. */
      jump.onclick = ev => {
        ev.preventDefault();
        try { elsewhere.click(); }
        catch (_) { toast('use the “Posts elsewhere” button on this row', true); }
      };
      warn.appendChild(jump);
      warn.appendChild(document.createTextNode(
        ' records \u2014 it names them and warns that most roles there are not '
        + 'this company\u2019s.'));
      e.appendChild(warn);
    }
    save.disabled = false;
    save.textContent = r.empty_scan || r.slug_ok === false ? 'Save anyway' : 'Save';
  };
  save.onclick = async () => {
    const r = await api('/api/set-board', {id: c.id, ats: found.ats,
      note: 'confirmed by hand in admin ' + new Date().toISOString().slice(0, 10)});
    if (r.error) return toast(r.error, true);
    toast(r.message); n.remove(); refreshCounts();
  };
  /* The third outcome. "Paste an ATS" and "no public board" recorded a company
     advertising every opening on LinkedIn exactly like one that hires by word
     of mouth - opposite facts, so the card ended up implying nobody was hiring
     at a company that was advertising openly. */
  const elsewhere = el('button', 'btn', 'Posts elsewhere');
  elsewhere.onclick = () => {
    const open = row.querySelector('.pa');
    if (open) { open.remove(); return; }
    const pa = el('div', 'pa');
    pa.style.cssText = 'flex-basis:100%;display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
    const sel = el('select', 'sel');
    [['linkedin', 'LinkedIn'], ['indeed', 'Indeed'], ['glassdoor', 'Glassdoor'],
     ['ziprecruiter', 'ZipRecruiter'], ['builtin', 'Built In'],
     ['govportal', 'a government jobs portal'], ['recruiter', 'an outside recruiter'],
     ['email', 'by email only'],
     ['parent', 'their parent company\u2019s board'], ['other', 'somewhere else']]
      .forEach(([v, t]) => { const o = el('option', null, t); o.value = v; sel.appendChild(o); });
    const link = el('input', 'in');
    link.placeholder = 'link to their listings (the jobs page, not the profile)';
    link.style.flex = '1';
    /* WHOSE board. Without the name the card can only say "a parent company",
       which cannot warn a reader that most of the roles they are about to see
       belong to somebody else. Shown only for the parent option. */
    const owner = el('input', 'in');
    owner.placeholder = 'whose board? e.g. SAP';
    owner.style.cssText = 'flex:0 0 190px;display:none';
    const go = el('button', 'btn primary', 'Record');
    const msg = el('div', 'kv');
    msg.style.cssText = 'flex-basis:100%;margin-top:4px';
    sel.onchange = () => {
      link.style.display = ['email', 'recruiter'].includes(sel.value) ? 'none' : '';
      owner.style.display = sel.value === 'parent' ? '' : 'none';
      if (sel.value === 'parent') owner.focus();
    };
    go.onclick = async () => {
      go.disabled = true;
      const r = await api('/api/posts-at',
                          {id: c.id, where: sel.value, url: link.value.trim(),
                           owner: owner.value.trim()});
      go.disabled = false;
      if (r.error) { msg.textContent = r.error; msg.style.color = 'var(--warn)'; return; }
      toast(r.message);
      n.remove();
    };
    pa.append(sel, owner, link, go, msg);
    row.appendChild(pa);
    link.focus();
  };
  row.append(inp, check, save, elsewhere,
             dismissBtn('boards', c.id, 'Nothing public anywhere'));
  n.appendChild(row);
  return n;
};

/* Founding year. Two jobs, one tab.
   A BLANK year is a typing job and nothing else, so it is built for typing:
   the year input, Enter submits, and the two pages where the answer actually
   lives are one click away rather than a search-engine detour. No guess is
   offered — a year scraped from a copyright footer is wrong about as often as
   it is right, and a wrong year is indistinguishable from a right one forever
   after.

   AN UNCONFIRMED year is the other job, and it sits above the blanks because
   it is already on the public card with nobody's name on it. 86 of these were
   written by a build agent in one night. They are mostly correct and none of
   them is being deleted; they are being ASKED. Same links, same evidence, and
   two buttons: the year stands, or it is corrected — one click each. */
RENDER.founded = c => {
  const n = el('div', 'item');
  n.appendChild(withLogo(el('h3', null, c.name), c));
  if (c.kind === 'unconfirmed') {
    const flag = el('div', 'evi');
    const t = el('div');
    t.appendChild(el('b', null, `${c.proposed_by || 'an agent'} proposed ${c.year}`));
    t.appendChild(document.createTextNode(
      ' — no person has stood behind this. It is on the public card now, and a '
      + 'visitor cannot tell a checked year from an unchecked one.'));
    flag.appendChild(t);
    n.appendChild(flag);
  }
  n.appendChild(el('div', 'kv', c.description || ''));
  const links = el('div', 'kv');
  links.style.marginTop = '4px';
  if (c.website) {
    [['their site', c.website], ['about page', c.about],
     ['LinkedIn', c.linkedin]].forEach(([label, href], i) => {
      if (!href) return;
      if (i) links.appendChild(document.createTextNode(' · '));
      const a = el('a', null, label);
      a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      links.appendChild(a);
    });
  } else {
    links.appendChild(document.createTextNode('no website on file — '));
    const a = el('a', null, 'search LinkedIn');
    a.href = c.linkedin; a.target = '_blank'; a.rel = 'noopener noreferrer';
    links.appendChild(a);
  }
  if (c.open_roles) {
    links.appendChild(document.createTextNode(' · '));
    links.appendChild(el('span', 'chip', c.open_roles + ' open roles'));
  }
  n.appendChild(links);

  const row = el('div', 'row');
  const yr = el('input', 'in');
  yr.placeholder = 'year founded'; yr.inputMode = 'numeric'; yr.maxLength = 4;
  yr.style.maxWidth = '140px';
  const save = el('button', 'btn primary',
                  c.kind === 'unconfirmed' ? 'Correct it' : 'Save');
  const msg = el('div', 'kv');
  msg.style.cssText = 'flex-basis:100%;margin-top:4px';
  const fail = r => { msg.textContent = r.error;
                      msg.style.color = 'var(--warn)'; };
  const go = async () => {
    save.disabled = true;
    const r = await api('/api/set-founded', {id: c.id, year: yr.value.trim()});
    save.disabled = false;
    if (r.error) return fail(r);
    toast(r.message);
    n.remove();
  };
  save.onclick = go;
  yr.onkeydown = e => { if (e.key === 'Enter') go(); };
  if (c.kind === 'unconfirmed') {
    /* Confirm writes nothing to the company record — the year is already
       there and does not change. What it writes is a name against it, which
       is the entire difference between "an agent typed this" and "somebody
       checked this". */
    const ok = el('button', 'btn primary', `Confirm ${c.year}`);
    ok.onclick = async () => {
      ok.disabled = true;
      const r = await api('/api/confirm-founded', {id: c.id});
      ok.disabled = false;
      if (r.error) return fail(r);
      toast(r.message);
      n.remove();
    };
    row.appendChild(ok);
    yr.placeholder = `not ${c.year}? type the right one`;
  }
  row.append(yr, save,
             dismissBtn('founded', c.id, 'Cannot find it'));
  row.appendChild(msg);
  n.appendChild(row);
  return n;
};

/* Boards found hiding inside a careers page. Each row is a claim with its
   evidence: what the page named, how many times, what the board calls itself
   and how many postings it holds. Two warnings are loud on purpose, because
   both have already happened in this data - a board that names a different
   company is usually a parent (Prepared's careers page links to Axon's, 500
   postings), and a count wildly out of scale is the same thing wearing a
   disguise. */
/* ONE RENDERER FOR EVERY PROPOSAL KIND, DRAWN FROM A TABLE. This queue had a
   tab, a count, and no renderer: clicking it threw at RENDER[key](it) and
   131 rows were unreachable for a month. A per-kind function is how that
   happens - the next kind arrives and nobody writes one. The verbs (accept,
   reject, why, what the agent saw) are the same for every kind; only the
   evidence block differs, and a table keeps a new kind to one entry. A kind
   missing from the table still renders, with its raw fields, and says so. */
const PROPOSAL_KINDS = {
  read: {
    accept: 'Accept these postings',
    evidence(p, line){
      const e = el('div', 'evi');
      if (p.none_found) {
        e.appendChild(line('The read found:', 'nothing - accepting records that and writes no posting'));
      } else {
        e.appendChild(line('Read off the page:', p.n + ' posting' + (p.n === 1 ? '' : 's')
          + (p.evidence ? ' at ' + p.evidence : '')));
        (p.postings || []).forEach(j => {
          const d = el('div', 'kv', '• ' + (j.title || j) + (j.location ? ' · ' + j.location : ''));
          e.appendChild(d);
        });
        if (p.n > (p.postings || []).length)
          e.appendChild(el('div', 'kv', '…and ' + (p.n - p.postings.length) + ' more'));
      }
      return e;
    },
    needsForce: p => !!p.warn,
  },
  board: {
    accept: 'Wire this board',
    evidence(p, line){
      const e = el('div', 'evi');
      e.appendChild(line('Board found:', (p.ats_type || '?') + ' · ' + String(p.ats_ref || '').slice(0, 70)));
      if (p.rows != null) e.appendChild(line('It reads:', p.rows + ' row' + (p.rows === 1 ? '' : 's')));
      (p.sample || []).slice(0, 6).forEach(s => e.appendChild(el('div', 'kv', '• ' + s)));
      e.appendChild(el('div', 'kv', 'Accepting re-fetches the board and asks whose it is; a MISMATCH refuses.'));
      return e;
    },
    needsForce: p => false,
  },
  bucket: {
    accept: 'File it there',
    evidence(p, line){
      const e = el('div', 'evi');
      e.appendChild(line('Filed now:', p.filed_now || '?'));
      e.appendChild(line('Agent proposes:', (p.proposed_sector || '?') + ' / ' + (p.proposed_category || '?')));
      return e;
    },
    needsForce: p => false,
  },
  rival: {
    accept: 'Accept the shortlist',
    evidence(p, line){
      const e = el('div', 'evi');
      if (!p.rivals || !p.rivals.length) {
        e.appendChild(line('Shortlist:', 'nobody on this roster competes with them (asserted)'));
      } else {
        e.appendChild(line('Shortlist:', p.rivals.length + ' competitor' + (p.rivals.length === 1 ? '' : 's')));
        p.rivals.forEach(r => e.appendChild(el('div', 'kv', '• ' + r.id + ' — ' + (r.why || ''))));
      }
      return e;
    },
    needsForce: p => false,
  },
};
const NO_APPLIER = new Set(['profile', 'news', 'claim', 'card']);

RENDER.proposals = p => {
  const n = el('div', 'item');
  n.appendChild(withLogo(el('h3', null, p.name || p.id), p));
  n.appendChild(el('div', 'kv',
    [p.kind + ' proposal', p.sector, 'by ' + (p.by || 'agent'),
     p.at ? String(p.at).slice(0, 10) : ''].filter(Boolean).join(' · ')));

  const line = (label, val) => {
    const d = el('div');
    d.appendChild(el('b', null, label + ' '));
    d.appendChild(document.createTextNode(val));
    return d;
  };
  const spec = PROPOSAL_KINDS[p.kind];
  if (spec) {
    n.appendChild(spec.evidence(p, line));
  } else {
    const e = el('div', 'evi');
    e.appendChild(line('No renderer for kind:', p.kind + ' — showing the raw fields'));
    e.appendChild(el('div', 'kv', JSON.stringify(p).slice(0, 400)));
    n.appendChild(e);
  }
  // the agent's own case sits beside its answer, so a reader rules on the
  // reasoning and not just the verdict - the council rule
  const c = el('div', 'kv');
  c.appendChild(el('b', null, 'Confidence ' + (p.confidence || '?') + '. '));
  if (p.why) c.appendChild(document.createTextNode(p.why));
  n.appendChild(c);
  if (p.warn) {
    const w = el('div'); w.style.marginTop = '6px';
    w.appendChild(el('span', 'bad', p.warn));
    n.appendChild(w);
  }

  const row = el('div', 'row');
  if (p.evidence && /^https?:/.test(p.evidence)) {
    const open = el('a', 'btn'); open.textContent = 'Open the page';
    open.href = p.evidence; open.target = '_blank'; open.rel = 'noopener noreferrer';
    row.appendChild(open);
  }

RENDER.acquisitions = s => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, s.name || s.id));

  /* Lead with HOW SURE we are, in words. "the board calls itself Versaterm"
     and "the slug is not the name" are different qualities of fact and sorting
     by a hidden number would hide which one you are looking at. */
  const strength = s.strength || 'slug';
  const head = {named: 'Their own board names somebody else',
                /* The strongest signal here, and it earned its own band: not a
                   string that looks odd, but TWO records already in this file
                   pointing at one domain. 22 of the 82. */
                domain: 'Their board is on another tracked company’s own domain',
                redirect: 'Their page ends up somewhere else',
                /* MISSING UNTIL 2026-09-01, and 32 of the rows are this one.
                   The map had no `logo` key, so every logo-family row drew
                   its band as the literal word "undefined" - the strongest
                   evidence in the queue after a named board, rendered as a
                   JavaScript mistake. */
                logo: 'Their logo is the same file as another company’s',
                slug: 'Only the slug looks odd — weakest, most of these are nothing'}[strength]
                || 'Evidence of a kind this page does not have a name for yet';
  const band = el('div', 'kv', head);
  band.style.fontWeight = '700';
  n.appendChild(band);

  const e = el('div', 'evi');
  e.appendChild(document.createTextNode(s.says || ''));
  if (s.postings_on_that_board)
    e.appendChild(el('div', 'kv',
      s.postings_on_that_board + ' postings sit on that board' +
      (s.open_roles ? ', and ' + s.open_roles + ' roles are on ours under this name' : '')));
  if (s.titles && s.titles.length)
    e.appendChild(el('div', 'kv', 'e.g. ' + s.titles.slice(0, 3).join(' · ')));
  /* THE BOOTH TEST, which is the owner's own rule and usually decides it:
     "who has the booth at the conference?" A company standing at one under
     its own name is a standalone and keeps its page; one that does not, while
     its parent does, has been absorbed and belongs inside the parent as a
     brand - where it keeps its name and still answers a search for itself.
     A SUGGESTION, never a ruling: the three buttons below are unchanged and
     both ownership outcomes still refuse without a named parent. */
  if (s.suggests) {
    const b = el('div', 'kv', s.suggests);
    b.style.fontWeight = '700';
    b.style.marginTop = '6px';
    e.appendChild(b);
    const ev = [];
    if (s.owner_by_domain) ev.push('careers page on ' + s.owner_by_domain + '’s domain');
    ev.push(s.exhibits ? 'they exhibit' : 'they do not exhibit');
    if (s.owner_by_domain)
      ev.push(s.owner_exhibits ? s.owner_by_domain + ' exhibits'
                               : s.owner_by_domain + ' does not exhibit');
    e.appendChild(el('div', 'kv', ev.join(' · ')));
  }
  n.appendChild(e);

  /* A ruling that says "somebody else" cannot be checked by anyone later, so
     the name is required for the two outcomes that claim ownership. */
  const who = el('input');
  who.type = 'text';
  who.placeholder = 'Whose board is it? e.g. Axon';
  who.value = s.board_calls_itself || s.parent || s.board_owner || '';
  who.style.cssText = 'width:100%;margin:6px 0';
  n.appendChild(who);

  const rule = async (outcome, label) => {
    const r = await api('/api/acquisition-ruling',
      {id: s.id, outcome, parent: who.value.trim(), why: label});
    if (r.error) return toast(r.error, true);
    toast(r.message); n.remove(); refreshCounts();
  };

  const row = el('div', 'row');
  const unwire = el('button', 'act go',
    'Unwire — the board is all theirs, none of it is ours');
  unwire.onclick = () => rule('unwire', 'the board belongs entirely to the parent');
  const keep = el('button', 'act',
    'Keep & label — our roles are on it too');
  keep.onclick = () => rule('keep', 'the board carries this company among others');
  const no = el('button', 'act mute',
    'Not an acquisition — that is just their slug');
  no.onclick = () => rule('not_acquired', 'the slug is the company\'s own shorthand');
  row.append(unwire, keep, no);
  n.appendChild(row);

  n.appendChild(el('div', 'kv',
    'Unwiring puts them back to no board on file, which is honest — it stops '
    + 'refresh reporting a parent\'s requisitions as theirs. Keeping records '
    + 'who owns it so the card can say so.'));
  return n;
};

       which grip the person happened to be holding. */
    const r = await api('/api/place', {id: c.id, keep: true, why: why.value,

        name: v.name, call, why: why.value,
        description: v.description, website: v.website,
        source_event: v.source_event});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    return b;
  };
  row.append(rule('in', 'In: full company', 'good'),
             rule('sled', 'SLED-only roles', ''),
             rule('out', 'Not this board', 'bad'));
  n.appendChild(row);
  wrap.appendChild(n);
  return wrap;
};

RENDER.scope = p => {
  const n = document.createElement('div');
  n.className = 'item';
  n.appendChild(el('h3', null, p.title));
  const kv = el('div', 'kv');
  kv.append(el('span', 'chip', p.company),
            el('span', 'chip', `${p.sector || ''} / ${p.category || ''}`));
  if (p.quota) kv.appendChild(el('span', 'chip', 'carries a number'));
  if (p.location) kv.appendChild(document.createTextNode(p.location));
  n.appendChild(kv);
  if (p.url) {
    const w = el('div', 'kv');
    const a = el('a', null, 'open the posting');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    w.appendChild(a); n.appendChild(w);
  }

  const row = el('div', 'row');
  const rule = (keep, label, cls) => {
    const b = el('button', 'act ' + cls, label);
    b.onclick = async () => {
      const r = await api('/api/scope', {id: p.id, in_scope: keep});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    return b;
  };
  row.append(rule(true, 'In scope', 'go'), rule(false, 'Not this board', 'mute'));

  // Six near-identical "Federal Civilian Sales" rows is one decision asked six
  // times. Offer to settle the pattern rather than the row.
  // Prefer the term the question is actually about. Matching in title order
  // picked "Public Sector" out of "Applied AI Architect, Public Sector
  // (National Security)", offering to rule on the broader word when the
  // narrow one is the thing in doubt.
  const stem = ['Intelligence Community', 'National Security', 'Federal Civilian',
                'Federal Partners', 'Federal', 'Public Sector']
    .find(t => new RegExp(t, 'i').test(p.title));
  if (stem) {
    /* Two buttons, not one confirm(). The single dialog read "OK keeps them,
       Cancel rules them out" — which spent the universal back-out gesture on a
       permanent bulk ruling: pressing Escape to leave the dialog ruled every
       matching posting off the board, and scope rulings are never re-asked.
       Each button now confirms its own direction, and Cancel/Esc always means
       "do nothing", everywhere, like it does in every other dialog on Earth. */
    const bulk = async (keep) => {
      const verb = keep ? 'KEEP every pending posting matching'
                        : 'rule OUT OF SCOPE every pending posting matching';
      if (!confirm(`${verb} “${stem.trim()}”?\n\nCancel does nothing.`)) return;
      const r = await api('/api/scope-all', {match: stem.trim(), in_scope: keep});
      if (r.error) return toast(r.error, true);
      toast(r.message); show('scope'); refreshCounts();
    };
    const keepAll = el('button', 'act mute', `Keep every “${stem.trim()}”`);
    keepAll.onclick = () => bulk(true);
    const dropAll = el('button', 'act mute', `Every “${stem.trim()}” out of scope`);
    dropAll.onclick = () => bulk(false);
    row.appendChild(keepAll); row.appendChild(dropAll);
  }
  n.appendChild(row);
  return n;
};

RENDER.submissions = s => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, s.kind === 'company'
    ? (s.name || s.url) : s.title));
  const kv = el('div', 'kv');
  kv.append(el('span', 'chip', s.kind), el('span', 'chip', 'sent ' + s.on));
  if (s.submitted_by) kv.append(el('span', 'chip', 'by ' + s.submitted_by));
  n.appendChild(kv);
  if (s.url) {
    const w = el('div', 'kv');
    const a = el('a', null, s.url); a.href = s.url; a.target = '_blank';
    a.rel = 'noopener'; w.appendChild(a); n.appendChild(w);
  }
  if (s.company) n.appendChild(el('div', 'kv', 'at ' + s.company));
  if (s.location) n.appendChild(el('div', 'kv', s.location));
  if (s.note) n.appendChild(el('div', 'kv', s.note));

  const row = el('div', 'row');
  let fields = null;
  if (s.kind === 'company') {
    const look = el('button', 'act', 'Read the page');
    const secSel = el('select', 'sel'), catSel = el('select', 'sel');
    const sectors = SCHEMA.sectors || [];
    sectors.forEach(x => secSel.appendChild(new Option(x.name, x.name)));
    const fillCats = () => {
      catSel.innerHTML = '';
      (sectors.find(x => x.name === secSel.value) || {categories: []})
        .categories.forEach(c => catSel.appendChild(new Option(c, c)));
    };
    fillCats(); secSel.onchange = fillCats;
    look.onclick = async () => {
      look.disabled = true; look.textContent = 'reading…';
      const r = await api('/api/inspect-submission', {url: s.url});
      look.disabled = false; look.textContent = 'Read the page';
      n.querySelectorAll('.evi').forEach(x => x.remove());
      if (r.error) return toast(r.error, true);
      fields = r;
      const e = el('div', 'evi');
      /* The most hostile strings this admin ever holds: name and description are
         og:site_name and the meta description off a URL a stranger submitted,
         and the extractor html-unescapes them on the way back, so a quote-free
         payload arrives intact. One "Read the page" click was the whole attack
         when this was innerHTML, so none of it goes near innerHTML now. */
      const nameLine = el('div');
      nameLine.appendChild(el('b', null, r.name));
      e.appendChild(nameLine);
      const dline = el('div', null, r.description || '');
      dline.style.cssText = 'color:var(--dim)';
      e.appendChild(dline);
      const reads = el('div');
      reads.style.cssText = 'margin-top:6px';
      reads.appendChild(document.createTextNode('reads as '));
      reads.appendChild(el('b', null, r.sector || '—'));
      reads.appendChild(document.createTextNode(
        ` / ${r.category || '—'} · confidence `));
      reads.appendChild(el('span', r.confidence === 'high' ? 'ok' : 'warn',
                           r.confidence || ''));
      e.appendChild(reads);
      if (r.confidence !== 'high')
        e.appendChild(el('div', 'kv warn',
          'Not confident. Place this one yourself rather '
          + 'than letting one incidental keyword decide.'));
      n.insertBefore(e, row);
      if (r.sector) { secSel.value = r.sector; fillCats(); }
      if (r.category) catSel.value = r.category;
    };
    const ok = el('button', 'act go', 'Approve');
    ok.onclick = async () => {
      const r = await api('/api/resolve-submission', {id: s.id, action: 'approve',
        fields: {name: (fields && fields.name) || s.name,
                 description: fields && fields.description,
                 sector: secSel.value, category: catSel.value}});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    row.append(look, secSel, catSel, ok);
  } else {
    const ok = el('button', 'act go', 'Approve');
    ok.onclick = async () => {
      const r = await api('/api/resolve-submission', {id: s.id, action: 'approve'});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    row.append(ok);
  }
  const no = el('button', 'act mute', 'Reject');
  no.onclick = async () => {
    const r = await api('/api/resolve-submission', {id: s.id, action: 'reject'});
    if (r.error) return toast(r.error, true);
    n.remove(); refreshCounts();
  };
  row.appendChild(no);
  n.appendChild(row);
  return n;
};

RENDER.review = r => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, r.name || r.id));
  const w = el('div', 'kv');
  const a = el('a', null, r.url); a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
  w.appendChild(a); n.appendChild(w);
  n.appendChild(el('div', 'kv', 'found ' + (r.found_on || '')));

    await api('/api/dismiss', {queue: 'review', key: r.id, why: 'confirmed'});

/* ------------------------------------------------------------------ capture */

async function showCapture() {
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__capture'));
  const v = $('#view'); v.innerHTML = '';
  v.appendChild(el('p', 'intro', INTRO.capture));

  const help = el('div', 'item');
  help.innerHTML = '<h3>The bookmarklet</h3>'
    + '<div class="kv">Install it once from <a href="/capture" target="_blank">'
    + '/capture</a>, then click it on any careers page or LinkedIn list you have '
    + 'open. It copies what it finds; paste it below.</div>';
  v.appendChild(help);

  const n = el('div', 'item');
  n.appendChild(el('h3', null, 'Paste a capture'));
  const ta = el('textarea');
  ta.placeholder = 'paste here';
  ta.style.cssText = 'width:100%;height:110px;margin-top:9px;font:12px/1.5 '
    + 'ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px;border-radius:0;'
    + 'border:1px solid var(--line);background:var(--bg);color:var(--ink)';
  n.appendChild(ta);

  const row = el('div', 'row');
  const q = el('input', 'txt'); q.type = 'text';
  q.placeholder = 'which company?';
  const hits = el('div'); hits.style.cssText = 'width:100%';
  const go = el('button', 'act go', 'Add to the board'); go.disabled = true;
  let company = null, parsed = null;

  ta.oninput = () => {
    n.querySelectorAll('.evi').forEach(x => x.remove());
    parsed = null; go.disabled = true;
    if (!ta.value.trim()) return;
    try { parsed = JSON.parse(ta.value); }
    catch { 
      const e = el('div', 'evi bad', 'That is not a capture. Click the bookmarklet '
        + 'again and use Copy for admin.');
      n.insertBefore(e, row); return;
    }
    const jobs = parsed.jobs || [];
    const e = el('div', 'evi');
    /* The paste is a careers page quoting itself: the bookmarklet ran on a site
       we do not control, so the page title and every job title in it are remote
       strings that happen to have travelled via the clipboard. */
    const head = el('div');
    head.appendChild(el('b', null,
      `${jobs.length} posting${jobs.length === 1 ? '' : 's'}`));
    if (parsed.page_title)
      head.appendChild(document.createTextNode(' from ' + parsed.page_title));
    e.appendChild(head);
    const list = el('div', null,
      jobs.slice(0, 8).map(j => j.title || '').join(' · ')
      + (jobs.length > 8 ? ` … and ${jobs.length - 8} more` : ''));
    list.style.cssText = 'margin-top:6px;color:var(--dim)';
    e.appendChild(list);
    n.insertBefore(e, row);
    go.disabled = !company;
  };

  let timer;
  q.oninput = () => {
    clearTimeout(timer);
    company = null; go.disabled = true;
    timer = setTimeout(async () => {
      hits.innerHTML = '';
      if (q.value.trim().length < 2) return;
      const r = await api('/api/search-companies', {q: q.value});
      (r.results || []).forEach(c => {
        const d = el('div', null, '');
        d.style.cssText = 'padding:5px 8px;border-radius:0;cursor:pointer;'
          + 'font-size:12.5px';
        d.appendChild(document.createTextNode((c.name || '') + ' '));
        const sec = el('span', null, c.sector || '');
        sec.style.cssText = 'color:var(--faint)';
        d.appendChild(sec);
        d.onmouseenter = () => d.style.background = 'var(--chip)';
        d.onmouseleave = () => d.style.background = '';
        d.onclick = () => {
          company = c; q.value = c.name; hits.innerHTML = '';
          go.disabled = !parsed;
        };
        hits.appendChild(d);
      });
      if (!(r.results || []).length) {
        hits.appendChild(el('div', 'kv warn', 'No company by that name is tracked. '
          + 'Add it from the Submissions tab first.'));
      }
    }, 220);
  };

  go.onclick = async () => {
    const r = await api('/api/capture', {company_id: company.id,
      jobs: parsed.jobs, page_url: parsed.page_url});
    if (r.error) return toast(r.error, true);
    toast(r.message);
    ta.value = ''; q.value = ''; company = null; parsed = null;
    go.disabled = true;
    n.querySelectorAll('.evi').forEach(x => x.remove());
  };

  row.append(q, go);
  n.append(row, hits);
  v.appendChild(n);
}

/* ------------------------------------------------------------------ sort board

   The queue tabs ask one question at a time, which is right when the answer
   needs evidence. Sorting is a different job: you are comparing a company
   against its neighbours, and the fastest way to see that a vendor is in the
   wrong bucket is to see the bucket. Cards carry their posting count because a
   company with a live board is the one worth getting right.
*/
let SORT_MODE = 'companies', SORT_SECTOR = null, SHOWN = {};
const PAGE = 40;

function showSort() {
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__sort'));
  SHOWN = {};
  const v = $('#view'); v.innerHTML = '';
  const bar = el('div', 'row'); bar.style.marginBottom = '14px';
  const seg = el('div', 'seg');
  [['companies', 'Companies'], ['roles', 'Job families']].forEach(([k, lbl]) => {
    const b = el('button', null, lbl);
    b.setAttribute('aria-pressed', SORT_MODE === k);
    b.onclick = () => { SORT_MODE = k; showSort(); };
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  v.appendChild(bar);
  v.appendChild(el('p', 'intro', SORT_MODE === 'companies'
    ? 'Drag a company between categories, or onto a sector on the left to move it '
      + 'out of this sector entirely. Cards are ordered by open postings, so the '
      + 'companies with a live board — the ones worth getting right — come first. '
      + '“Suppliers & Services” is the catch-all the bulk import dumped into; '
      + 'emptying it is most of the work here.'
    : 'Drag a title into the family it belongs to. These are the titles the '
      + 'classifier could not place, so each one is a judgment stored against that '
      + 'exact title — not a rule. A title that suggests a real pattern is better '
      + 'fixed in roles.py with a selftest case.'));
  const host = el('div', 'board'); v.appendChild(host);
  (SORT_MODE === 'companies' ? drawCompanies : drawRoles)(host, bar);
}

/* Takes nodes rather than a markup string. The cards carry company names, ats
   refs and job titles that were read off other people's sites, and any one of
   them spelled as a tag used to become live markup on this board. */
function card(nodes, payload) {
  const c = el('div', 'cd');
  c.draggable = true;
  nodes.forEach(x => c.appendChild(x));
  c.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'move';
    c.classList.add('dragging');
  });
  c.addEventListener('dragend', () => c.classList.remove('dragging'));
  return c;
}

function dropzone(node, onDrop) {
  node.addEventListener('dragover', e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    node.classList.add('over');
  });
  node.addEventListener('dragleave', () => node.classList.remove('over'));
  node.addEventListener('drop', async e => {
    e.preventDefault(); node.classList.remove('over');
    let payload; try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); }
    catch { return; }
    await onDrop(payload, e);
  });
  return node;
}

function fill(col, key, items, make) {
  col.querySelectorAll('.cd,.more').forEach(n => n.remove());
  const limit = SHOWN[key] || PAGE;
  items.slice(0, limit).forEach(it => col.appendChild(make(it)));
  if (items.length > limit) {
    const m = el('div', 'more', `show ${Math.min(PAGE, items.length - limit)} more `
      + `of ${items.length - limit}`);
    m.onclick = () => { SHOWN[key] = limit + PAGE; fill(col, key, items, make); };
    col.appendChild(m);
  }
}

async function drawCompanies(host, bar) {
  const d = await api('/api/sort/companies'
    + (SORT_SECTOR ? '?sector=' + encodeURIComponent(SORT_SECTOR) : ''));
  SORT_SECTOR = d.sector;
  const sel = el('select', 'sel');
  d.sectors.forEach(x => sel.appendChild(new Option(x, x)));
  sel.value = d.sector;
  sel.onchange = () => { SORT_SECTOR = sel.value; showSort(); };
  bar.appendChild(sel);
  bar.appendChild(el('span', 'count', `${d.companies.length} companies`));

  const byCat = {};
  d.categories.forEach(c => byCat[c] = []);
  d.companies.forEach(c => (byCat[c.category] = byCat[c.category] || []).push(c));

  // rail: every other sector, as a drop target
  const rail = el('div', 'rail');
  rail.appendChild(el('h4', null, 'Move to sector'));
  d.sectors.filter(x => x !== d.sector).forEach(x => {
    const z = dropzone(el('div', 'drop', x), async (p) => {
      const r = await api('/api/move', {id: p.id, sector: x});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    rail.appendChild(z);
  });
  host.appendChild(rail);

  const make = c => {
    const rows = [el('div', null, c.name),
      el('div', 'm',
        (c.postings ? `${c.postings} posting${c.postings === 1 ? '' : 's'} · ` : '')
        + (c.ats || 'no board'))];
    if (c.suggested && c.suggested.sector !== d.sector)
      rows.push(el('div', 'sug', 'looks like ' + c.suggested.sector));
    const cd = card(rows, {id: c.id, name: c.name});
    /* Click for the blurb: sorting a company you cannot remember is a
       guess, and a guess filed with confidence is worse than a queue.
       Everything shown is on file already - nothing is fetched. */
    cd.addEventListener('click', () => {
      const open = cd.querySelector('.cdinfo');
      if (open) { open.remove(); return; }
      const info = el('div', 'cdinfo');
      const bits = [];
      const desc = (c.description || '').replace(/\s*-\s*exhibited at [^;.]*/i, '').trim();
      if (desc) bits.push(desc + '.');
      const facts = [c.location, c.year_founded && `founded ${c.year_founded}`]
        .filter(Boolean).join(' · ');
      if (facts) bits.push(facts + '.');
      info.appendChild(el('div', null,
        bits.join(' ') || 'No description on file - the card is the research gap.'));
      if (c.events && c.events.length) {
        const evrow = el('div', 'm');
        c.events.forEach(ev => evrow.appendChild(el('span', 'chip ok', ev)));
        info.appendChild(evrow);
      }
      if (c.website) {
        const a = el('a', null, c.website.replace(/^https?:\/\//, '').replace(/\/$/, ''));
        a.href = c.website; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', e => e.stopPropagation());
        info.appendChild(a);
      }
      cd.appendChild(info);
    });
    return cd;
  };
  d.categories.forEach(cat => {
    const col = el('div', 'col');
    const h = el('h4', null, cat + ' ');
    h.appendChild(el('span', 'n', String((byCat[cat] || []).length)));
    col.appendChild(h);
    dropzone(col, async (p) => {
      const r = await api('/api/move', {id: p.id, sector: d.sector, category: cat});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    fill(col, 'c:' + cat, byCat[cat] || [], make);
    host.appendChild(col);
  });
}

async function drawRoles(host, bar) {
  const d = await api('/api/sort/roles');
  bar.appendChild(el('span', 'count', `${d.titles.length} unplaced titles`));

  const src = el('div', 'col wide');
  const h = el('h4', null, 'Unclassified ');
  h.appendChild(el('span', 'n', String(d.titles.length)));
  src.appendChild(h);
  const make = t => card([el('div', null, t.title),
    el('div', 'm', (t.company || '')
      + (t.count > 1 ? ` · ${t.count} postings` : ''))],
    {title: t.title});
  fill(src, 'roles', d.titles, make);
  host.appendChild(src);

  Object.entries(d.families).forEach(([k, label]) => {
    const col = el('div', 'col');
    col.appendChild(el('h4', null, label));
    dropzone(col, async (p) => {
      const r = await api('/api/set-family', {title: p.title, family: k});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    host.appendChild(col);
  });
}
