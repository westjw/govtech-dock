<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GovTech Dock — Admin</title>
<style>
  :root{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1db; --ink:#1a1815; --dim:#6a655d;
         --faint:#969086; --accent:#2f6f4f; --warn:#a8620f; --bad:#a3342a; --chip:#f1eeea; }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#121110; --panel:#1a1918; --line:#2f2c28; --ink:#eae6e0; --dim:#a09a90;
    --faint:#726c63; --accent:#6fb98a; --warn:#d9973f; --bad:#e0705f; --chip:#232120; }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-underline-offset:2px}
  header{max-width:1180px;margin:0 auto;padding:22px 22px 0}
  h1{font-size:20px;margin:0 0 3px;letter-spacing:-.015em}
  .sub{color:var(--dim);font-size:13px}
  nav{display:flex;gap:3px;margin:16px 0 0;flex-wrap:wrap}
  nav button{background:none;border:0;padding:8px 13px;border-radius:7px 7px 0 0;font:inherit;
    font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
  nav button[aria-selected=true]{color:var(--ink);background:var(--panel);
    border-bottom-color:var(--accent);font-weight:600}
  nav .n{font-variant-numeric:tabular-nums;color:var(--faint);margin-left:5px;font-size:11.5px}
  main{max-width:1180px;margin:0 auto;padding:0 22px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;
    padding:18px;min-height:340px}
  .intro{font-size:12.5px;color:var(--faint);margin:0 0 16px;line-height:1.65;max-width:78ch}
  .item{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:10px}
  .item h3{margin:0;font-size:14.5px;font-weight:600}
  .kv{color:var(--dim);font-size:12.5px;margin:4px 0 0}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);
    color:var(--dim);white-space:nowrap;display:inline-block;margin-right:5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
  button.act{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  button.act:hover{border-color:var(--accent)}
  button.act.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.act.mute{color:var(--faint)}
  button.act:disabled{opacity:.45;cursor:default}
  input.txt,select.sel{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);
    border-radius:7px;background:var(--bg);color:var(--ink)}
  input.txt{min-width:270px;flex:1}
  .ok{color:var(--accent)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .empty{color:var(--faint);padding:44px 0;text-align:center;font-size:13px}
  .evi{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:7px;
    font-size:12.5px;line-height:1.6}
  .evi code{font-size:12px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .mem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
  .toast{position:fixed;right:18px;bottom:18px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
    padding:11px 15px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.13);max-width:380px}
  .toast.bad{border-left-color:var(--bad)}
  .count{color:var(--faint);font-size:12px;margin-left:auto}
  .board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
  .rail{flex:0 0 172px;position:sticky;left:0}
  .rail h4,.col h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  .rail .drop{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;
    font-size:12.5px;color:var(--dim)}
  .col{flex:0 0 236px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    padding:10px;min-height:120px}
  .col.wide{flex:0 0 292px}
  .col .n{color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
  .drop.over,.col.over{border-color:var(--accent);background:var(--chip)}
  .cd{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;
    margin-bottom:6px;font-size:12.5px;cursor:grab;line-height:1.4}
  .cd:active{cursor:grabbing}
  .cd.dragging{opacity:.4}
  .cd .m{color:var(--faint);font-size:11px;margin-top:2px}
  .cd .sug{color:var(--warn);font-size:11px;margin-top:2px}
  .more{font-size:11.5px;color:var(--faint);text-align:center;padding:5px;cursor:pointer}
  .more:hover{color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;font-size:12.5px;padding:6px 13px;border:0;background:var(--bg);
    color:var(--dim);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:600}
  .grouphead{margin:22px 0 8px;padding:12px 14px;border:1px solid var(--line);
    border-radius:10px;background:var(--chip)}
  .grouphead strong{display:block;margin-bottom:8px;font-size:14px}
  .grouphead input{width:100%;margin-bottom:8px}
  .starthead{display:flex;align-items:baseline;gap:12px;margin:6px 0 16px}
  .starthead strong{font-size:17px}
  .starthead .dim{color:var(--faint);font-size:12.5px;margin-left:auto}
  /* the counter: three numbers, sized like a floor board */
  .counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:2px 0 10px}
  .bignum{background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;border-top:3px solid var(--line)}
  .bignum strong{display:block;font-size:34px;font-weight:800;letter-spacing:-.025em;
    line-height:1.05;font-variant-numeric:tabular-nums}
  .bignum span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--dim);margin-top:4px;line-height:1.35}
  .bignum.amber{border-top-color:var(--warn)}
  .bignum.green{border-top-color:var(--accent)}
  .bignum.green strong{color:var(--accent)}
  .yourline{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);
    margin-bottom:20px}
  .yourline .pb{background:var(--accent);color:var(--bg);font-weight:700;font-size:10.5px;
    padding:2px 9px;border-radius:12px;letter-spacing:.04em;text-transform:uppercase}
  .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
    margin:22px 0 9px}
  .sortie{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:10px}
  .sortie h3{margin:0 0 5px;font-size:15.5px;letter-spacing:-.01em}
  .sortie.muted{background:none}
  .barwrap{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
  .endbar{flex:1;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
  .endfill{height:100%;border-radius:4px;background:var(--accent)}
  .toward{font-size:11.5px;color:var(--dim);white-space:nowrap}
  .far{font-size:11.5px;color:var(--dim);margin-top:4px}
  /* the floors: stamps for what is finished, bars for what is close */
  .floors{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
  .floor{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px}
  .floor .fname{font-size:12.5px;font-weight:650;margin-bottom:7px}
  .floor .fsub{font-size:10.5px;color:var(--faint);margin-top:6px}
  .floor.stamped{display:flex;flex-direction:column;align-items:center;text-align:center;
    color:var(--accent);border-color:var(--accent)}
  .floor.stamped .fname{margin-top:6px;color:var(--ink)}
  .hintline{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}
  .tape{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;font-size:12px}
  .trow{display:flex;gap:10px;align-items:baseline;padding:4px 0;color:var(--dim)}
  .trow + .trow{border-top:1px solid var(--chip)}
  .tdate{color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .twhy{color:var(--faint);font-style:italic;margin-left:auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
  .cdinfo{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    font-size:12.5px;line-height:1.55;color:var(--dim);cursor:default}
  .cdinfo a{display:inline-block;margin-top:5px}
  .cdinfo .chip{margin:4px 4px 0 0}
</style>
</head>
<body>
<header>
  <h1>GovTech Dock — Admin</h1>
  <div class="sub" id="sub">loading…</div>
  <nav id="tabs"></nav>
</header>
<main><div class="panel" id="view"><div class="empty">loading…</div></div></main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
/* This used to be a no-op that only stringified, which handed every page title,
   job title and meta description a remote site sent us straight to innerHTML as
   live markup. Nothing calls it now - every value goes through el() or
   textContent instead - and it is kept correct for whoever writes the next line
   that does build markup as a string. The apostrophe is in the class because a
   value can land inside a single-quoted attribute. Anything built with el() or
   textContent must NOT be run through this: those escape on their own, and a
   second pass prints "&amp;" in a sector name that has an ampersand. */
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let META = null, SCHEMA = null, FAMILIES = null, TAB = null, LAST_ITEMS = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  return r.json();
}
function toast(msg, bad) {
  const t = el('div', 'toast' + (bad ? ' bad' : ''), msg);
  document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}

const INTRO = {
  duplicates: 'Two records for one vendor. Merging keeps every field the survivor '
    + 'already has and inherits the ones it is missing, so nothing researched is lost — '
    + 'a discovered job board always beats an unknown one. The old name is kept as an alias.',
  websites: 'Names too generic to guess a domain from, and the key to everything '
    + 'downstream: no site means no logo and no board, so the company can never be '
    + 'monitored and never looks like itself. A pasted URL is checked against the page '
    + 'first, then spent immediately - saved, logo fetched, board probed - so one paste '
    + 'pays three times while you are still looking at it. 102 companies are here, and '
    + 'each one you close is a company that can start showing real postings.',
  blocked: 'Probed and turned away: a 403, a timeout, an SSL failure. Not evidence of '
    + 'anything except that the fetcher was refused - these re-probe themselves after '
    + 'seven days. Retry now is for when the block looked transient or you just fixed '
    + 'the website field.',
  boards: 'Probed, and nothing found. Most of these genuinely have no public job board - '
    + 'they hire on LinkedIn or by email - so this is the capture extension\'s worklist: '
    + 'open the company, find where they actually post, paste the address. The green '
    + 'chips are the conference floors they exhibit on, because the fastest way to work '
    + 'this list is by floor, standing on it. Paste a careers URL and the ATS behind '
    + 'it is detected, with the slug checked against the company name - which is also '
    + 'how an acquisition shows up.',
  placement: 'The description disagrees with the sector the company is filed under. '
    + 'This is the same question intake asks, applied to records that arrived in bulk '
    + 'and never went through the front door.',
  unclassified: 'Titles the role classifier could not place. Most name a rank with no '
    + 'function — "Manager", "Commercial Development" — and the family only exists in the '
    + 'JD body, which the board does not fetch. Assigning one stores it as data, not as a rule.',
  acquisitions: 'The board reads fine but its slug does not match the company name, which '
    + 'usually means the company was acquired and its careers page now redirects to the parent. '
    + 'Confirming wires it up; a parent-company board must never be recorded as the subsidiary’s.',
  miscategorized: 'Companies that call themselves GovTech Products and are filed under '
    + 'Suppliers & Services, the bucket meant for everything that is NOT a product. Most '
    + 'also carry the sector of whichever trade show found them rather than what they sell, '
    + 'which is why Workday sat in Transit & Parking. These sort by open roles because the '
    + 'ones hiring hardest are the top rows on the public Companies tab. Each carries a '
    + 'proposed placement and the words it was inferred from; where the guesser has nothing '
    + 'to go on it says so instead of guessing. A vendor that genuinely sells into several departments can take more than one: File it here replaces the primary, Also file here keeps it and adds another.',
  vendors: 'Real product companies that took a booth on a government floor but sell '
    + 'to every industry: general data platforms, general CRM, general security. Alteryx '
    + 'is the shape of it. They are not consultancies and they are not govtech the way '
    + 'Tyler is, so the research pass refuses to rule either way and asks. In adds a full '
    + 'company; SLED-only adds one whose public-sector roles are the only ones that show; '
    + 'Out leaves it off and remembers, so the same name is never asked twice.',
  scope: 'Postings a filter kept but could not confirm belong on this board. The live '
    + 'case is federal: a Federal Civilian Sales AE is selling technology to government, '
    + 'and it is not state and local, and no pattern settles which of those this board is '
    + 'about. Rather than let a regex decide quietly in either direction, the posting stays '
    + 'visible and asks. A ruling is stored against the title, so a repost is never asked twice.',
  submissions: 'Companies and jobs sent in from outside. A submission is a claim, '
    + 'not a fact — nothing here has touched companies.json or the board. Approving '
    + 'a company runs the same intake check as adding one by hand and shows what the '
    + 'page says about itself first.',
  capture: 'For the boards nothing automated can read. 537 careers pages on file have '
    + 'no enumerable job list at all — rendering them in headless Chromium finds '
    + 'nothing either, because they are widgets in iframes and session-gated boards. '
    + 'Your browser runs all of that. Capture the page you are looking at, paste it '
    + 'here, pick the company.',
  review: 'Short one-word names where the domain matched exactly but the page could belong '
    + 'to anyone — kodex.* is a Samsung ETF brand. The page really does say the word, so no '
    + 'text rule separates them.'
};

async function boot() {
  META = await api('/api/queues');
  [SCHEMA, FAMILIES] = await Promise.all([api('/api/schema'), api('/api/families')]);
  $('#sub').textContent = `${META.companies.toLocaleString()} govtech companies · `
    + `${META.postings.toLocaleString()} postings · board built ${META.generated || '—'}`;
  const nav = $('#tabs'); nav.innerHTML = '';
  const startBtn = el('button', null, 'Start here');
  startBtn.dataset.key = '__start'; startBtn.onclick = () => showStart();
  nav.appendChild(startBtn);
  const capBtn = el('button', null, 'Capture');
  capBtn.dataset.key = '__capture'; capBtn.onclick = () => showCapture();
  nav.appendChild(capBtn);
  const sortBtn = el('button', null, 'Sort board');
  sortBtn.dataset.key = '__sort'; sortBtn.onclick = () => showSort();
  nav.appendChild(sortBtn);
  Object.keys(META.labels).forEach(k => {
    const b = el('button', null, META.labels[k]);
    b.appendChild(el('span', 'n', META.counts[k]));
    b.onclick = () => show(k);
    b.dataset.key = k; nav.appendChild(b);
  });
  showStart();
}

async function refreshCounts() {
  META = await api('/api/queues');
  document.querySelectorAll('nav button').forEach(b => {
    const n = b.querySelector('.n');
    if (n) n.textContent = META.counts[b.dataset.key];
  });
}


/* The landing view. Eleven tabs and two thousand rows is a wall; this says
   which handful of them changes anything today, and what is already done. */
async function showStart() {
  TAB = '__start';
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__start'));
  const v = $('#view'); v.innerHTML = '';
  const t = await api('/api/triage');
  const g = t.game || {};

  /* THE COUNTER. Three numbers, and each is chosen to answer a different
     question: how much is on the table, how much of it the public can see
     right now, and whether the paper is clean. Volume is never one of them -
     a wrong ruling here is invisible and permanent, so the craft stat is the
     one that gets the accent colour. */
  const onTable = (t.counts.vendors || 0) + (t.counts.miscategorized || 0)
                + (t.counts.duplicates || 0);
  const visible = (t.recommend.find(r => r.queue === 'miscategorized') || {}).n || 0;
  const counter = el('div', 'counter');
  const big = (num, lbl, cls) => {
    const d = el('div', 'bignum' + (cls ? ' ' + cls : ''));
    d.appendChild(el('strong', null, String(num)));
    d.appendChild(el('span', null, lbl));
    return d;
  };
  /* Labels say what the number is, in words that need no gloss. The first
     drafts - "calls on the table", "visible from the street", "clean paper" -
     were floor slang I invented, and a label you have to explain has already
     failed. */
  counter.append(
    big(onTable, 'decisions waiting on you'),
    big(visible, 'of them wrong on the public site right now', 'amber'),
    big(g.why_coverage === null || g.why_coverage === undefined
        ? '—' : g.why_coverage + '%', 'of your rulings say why', 'green'));
  v.appendChild(counter);

  const line = el('div', 'yourline');
  line.appendChild(el('span', null,
    `${g.today || 0} today · your best day this month is ${g.best_30 || 0}`));
  if ((g.today || 0) > (g.best_30 || 0) && (g.best_30 || 0) > 0)
    line.appendChild(el('span', 'pb', 'personal best'));
  v.appendChild(line);

  /* THE SORTIES. Each names what the work buys and how close its queue is to
     a state with a title. A bar that fills toward "Clean shelves" finishes;
     a percentage does not. */
  const stateOf = {};
  ((g.states) || []).forEach(st => { stateOf[st.queue] = st; });
  if (t.recommend.length) v.appendChild(el('div', 'lbl', "Today's sorties"));
  t.recommend.forEach(r => {
    const card = el('div', 'sortie');
    card.appendChild(el('h3', null, r.headline));
    card.appendChild(el('div', 'kv', r.why));
    /* The bar measures the SITTING, not the queue. A sortie you can finish
       shows a bar that can fill; the queue's own total lives on its tab. */
    if (r.scope) {
      const pct = Math.round(100 * (r.done || 0) / r.scope);
      const wrapb = el('div', 'barwrap');
      const bar = el('div', 'endbar');
      const fill = el('div', 'endfill');
      fill.style.width = Math.max(2, pct) + '%';
      bar.appendChild(fill);
      wrapb.appendChild(bar);
      wrapb.appendChild(el('span', 'toward',
        `${r.done || 0} of ${r.scope}${r.goal ? ' → ' + r.goal : ''}`));
      card.appendChild(wrapb);
    }
    const st = stateOf[r.queue];
    if (st && st.left)
      card.appendChild(el('div', 'far',
        `${st.done + st.left} on the board behind it — “${st.name}” when it is empty`));
    const b = el('button', 'act good', `Open ${META.labels[r.queue]}`);
    b.onclick = () => show(r.queue);
    const row = el('div', 'row'); row.appendChild(b);
    card.appendChild(row);
    v.appendChild(card);
  });

  /* THE FLOORS. The capture worklist is worked by conference, so its
     progress is per conference: doors mapped out of doors known. A floor at
     100% is stamped and stays stamped - nothing here expires. */
  const fl = (t.floors || []).filter(f => f.left > 0).slice(0, 6);
  const done = (t.floors || []).filter(f => f.left === 0);
  if (fl.length || done.length) {
    v.appendChild(el('div', 'lbl', 'The floors'));
    const grid = el('div', 'floors');
    done.slice(0, 3).forEach(f => {
      const d = el('div', 'floor stamped');
      d.innerHTML = '<svg width="34" height="34" viewBox="0 0 52 52" fill="none">'
        + '<circle cx="26" cy="26" r="23" stroke="currentColor" stroke-width="2.5"/>'
        + '<circle cx="26" cy="26" r="18" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>'
        + '<path d="M17 27l6 6 12-13" stroke="currentColor" stroke-width="2.5" '
        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';
      d.appendChild(el('div', 'fname', f.event));
      d.appendChild(el('div', 'fsub', `all ${f.total} doors mapped`));
      grid.appendChild(d);
    });
    fl.forEach(f => {
      const d = el('div', 'floor');
      d.appendChild(el('div', 'fname', f.event));
      const bar = el('div', 'endbar');
      const fill = el('div', 'endfill');
      fill.style.width = Math.max(3, f.pct) + '%';
      bar.appendChild(fill);
      d.appendChild(bar);
      d.appendChild(el('div', 'fsub',
        f.left === 1 ? 'one door from a full map'
                     : `${f.left} doors left of ${f.total}`));
      grid.appendChild(d);
    });
    v.appendChild(grid);
    v.appendChild(el('div', 'hintline',
      'Doors close in No board found and Missing websites — or on the floor '
      + 'itself, with the capture extension.'));
  }

  /* THE TAPE. Not a score: a record that the work caused something. */
  if ((g.tape || []).length) {
    v.appendChild(el('div', 'lbl', 'The tape'));
    const tape = el('div', 'tape');
    g.tape.forEach(x => {
      const r = el('div', 'trow');
      r.appendChild(el('span', 'tdate', x.on));
      r.appendChild(el('span', null,
        x.verb === 'refiled' ? `refiled to ${x.what}`
                             : `${x.what} — ${x.call}`));
      if (x.why) r.appendChild(el('span', 'twhy', x.why));
      tape.appendChild(r);
    });
    v.appendChild(tape);
  }

  const notes = el('div', 'sortie muted');
  notes.appendChild(el('h3', null, 'Worth knowing before you judge the numbers'));
  t.notes.forEach(n => notes.appendChild(el('div', 'kv', n)));
  v.appendChild(notes);
}

async function show(key) {
  TAB = key;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === key));
  const v = $('#view'); v.innerHTML = '';
  v.appendChild(el('p', 'intro', INTRO[key] || ''));
  const load = el('div', 'empty', 'loading…'); v.appendChild(load);
  const { items } = await api('/api/queue/' + key);
  load.remove();
  if (!items.length) { v.appendChild(el('div', 'empty', 'Nothing in this queue.')); return; }
  // the whole set, so a renderer can offer to act on a group it belongs to
  LAST_ITEMS = items; VTHEME = null;
  items.forEach(it => v.appendChild(RENDER[key](it)));
}

function dismissBtn(queue, key, label) {
  const b = el('button', 'act mute', label || 'Not an issue');
  b.onclick = async () => {
    const r = await api('/api/dismiss', {queue, key, why: 'dismissed in admin'});
    if (r.error) return toast(r.error, true);
    b.closest('.item').remove(); refreshCounts();
  };
  return b;
}

RENDER.websites = c => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, c.name));
  n.appendChild(el('div', 'kv', `${c.sector} → ${c.category}`
    + (c.description ? ' · ' + c.description : '')));
  const row = el('div', 'row');
  const inp = el('input', 'txt'); inp.type = 'text';
  inp.placeholder = 'https://company.com';
  const check = el('button', 'act', 'Check');
  const save = el('button', 'act go', 'Save'); save.disabled = true;
  let verified = null;
  check.onclick = async () => {
    check.disabled = true; check.textContent = 'checking…';
    const r = await api('/api/verify-website', {url: inp.value, name: c.name});
    check.disabled = false; check.textContent = 'Check';
    n.querySelectorAll('.evi').forEach(e => e.remove());
    if (r.error) return toast(r.error, true);
    verified = r;
    const e = el('div', 'evi');
    /* The title is whatever the pasted site chose to send back, so it is written
       as text and never as markup: a <title> that was an img tag with an onerror
       came back byte for byte and ran when this was one innerHTML template. */
    /* Say what was DONE and what it MEANS, not what the fields are called.
       "Page title: ..." names a field at somebody; what they need to know is
       that we went and looked, what the page called itself, and whether that
       is reason to trust the address. Same facts, told as what happened. */
    let host = r.url, deep = false;
    try { const u = new URL(r.url);
          host = u.hostname.replace(/^www\./, '');
          deep = u.pathname.replace(/\/$/, '') !== ''; } catch (_) {}

    const tline = el('div');
    tline.appendChild(document.createTextNode('We opened '));
    tline.appendChild(el('b', null, host));
    tline.appendChild(document.createTextNode(' and read it.'));
    e.appendChild(tline);

    const said = el('div');
    said.style.marginTop = '4px';
    if (r.title) {
      said.appendChild(document.createTextNode('The page calls itself \u201c'));
      said.appendChild(document.createTextNode(r.title));
      said.appendChild(document.createTextNode('\u201d.'));
    } else {
      said.appendChild(document.createTextNode('The page has no title at all.'));
    }
    e.appendChild(said);

    const vline = el('div');
    vline.style.marginTop = '4px';
    vline.appendChild(r.parked
      ? el('span', 'bad', 'This is a holding page \u2014 the domain is parked or '
                          + 'up for sale, so it is not their site.')
      : el('span', 'ok', 'A real page, not a parked domain.'));
    vline.appendChild(document.createTextNode(' '));
    vline.appendChild(r.identifies
      ? el('span', 'ok', 'It names this company, so the address is theirs.')
      : el('span', 'warn', 'It never names this company \u2014 it may be the wrong '
                           + 'business, or one that renamed. Your call.'));
    e.appendChild(vline);

    /* A deep path is how an acquisition and a product page both sneak in.
       aws.amazon.com/govcloud-us/ looks convincing and is neither the company
       nor the front door the logo and board steps work from. */
    if (deep) {
      const d = el('div');
      d.style.marginTop = '4px';
      d.appendChild(el('span', 'warn',
        'This is a page inside the site, not the front door. Saving it is fine, '
        + 'but the logo and job-board steps work from the homepage \u2014 '
        + host + ' may be the better address.'));
      e.appendChild(d);
    }

    const nxt = el('div', 'kv');
    nxt.style.marginTop = '6px';
    nxt.textContent = 'Save writes this address to the card, fetches their logo, '
                    + 'and looks for a job board. Nothing else changes.';
    e.appendChild(nxt);
    n.appendChild(e);
    save.disabled = r.parked;
    /* The page just told us what the company calls itself. When that differs
       from the stored name, offer the rename with the save - editable,
       because a <title> is marketing copy and the person decides. The old
       name is kept as an alias, same as a merge. */
    n.querySelectorAll('.renamer').forEach(x => x.remove());
    const canonical = (r.title || '').split(/\s+[—|·–]\s+|\s+-\s+/)[0].trim();
    if (canonical && canonical.toLowerCase() !== c.name.toLowerCase()
        && canonical.length >= 2 && canonical.length <= 60) {
      const wrapR = el('div', 'renamer kv');
      wrapR.appendChild(document.createTextNode('rename to '));
      const ri = el('input'); ri.value = canonical; ri.id = 'rn-' + c.id;
      wrapR.appendChild(ri);
      wrapR.appendChild(document.createTextNode(` (was “${c.name}”, kept as an alias)`));
      n.insertBefore(wrapR, row.nextSibling);
    }
  };
  save.onclick = async () => {
    const ri = document.getElementById('rn-' + c.id);
    const newName = ri && ri.value.trim();
    save.disabled = true; save.textContent = 'saving, fetching, probing…';
    // one paste buys three things: the field, the company's mark, and a
    // shot at their board. The button says so while it works.
    const r = await api('/api/save-website', {
      id: c.id, url: verified.url,
      name: (newName && newName.toLowerCase() !== c.name.toLowerCase()) ? newName : ""});
    save.disabled = false; save.textContent = 'Save';
    if (r.error) return toast(r.error, true);
    toast(r.message);
    const won = el('div', 'kv');
    if (r.logo) won.appendChild(el('span', 'chip ok', 'logo'));
    // the board ref was just read off the company's own site
    if (r.board) won.appendChild(el('span', 'chip ok', 'board: ' + r.board));
    n.appendChild(won);
    setTimeout(() => { n.remove(); refreshCounts(); }, r.logo || r.board ? 1400 : 300);
  };
  row.append(inp, check, save, dismissBtn('websites', c.id, 'No site exists'));
  n.appendChild(row);
  return n;
};

    check.disabled = false; check.textContent = 'Detect board';

    found = r;
    const slug = r.slug_ok === null ? el('span', 'chip', 'slug not checked')
      : r.slug_ok ? el('span', 'ok', 'slug matches the company')
      : el('span', 'bad', 'slug does not match — likely a parent or another company');
    const e = el('div', 'evi');
    /* Every field here came out of the careers page that was just fetched - the
       ats ref, the note, and each job title - so all of it is built as nodes. A
       posting called "<img onerror=...>" is then a posting with a silly name. */
    const idline = el('div');
    idline.appendChild(el('b', null, r.ats.type));

    if (r.titles && r.titles.length) {

      tl.style.cssText = 'margin-top:6px;color:var(--dim)';
      e.appendChild(tl);

    if (r.note) {
      const nt = el('div', null, r.note);
      nt.style.cssText = 'margin-top:6px;color:var(--faint)';
      e.appendChild(nt);
    }
    n.appendChild(e);
    if (r.empty_scan) {
      const warn = el('div', 'kv warn');
      warn.textContent = 'That page returned no titles. A scan that reads nothing has '
        + 'not shown the board is empty, only that we cannot read it — saving it would '
        + 'make an unreadable page look monitored. Try the real careers URL first.';
      e.appendChild(warn);
    }
    if (r.slug_ok === false) {
      const warn = el('div', 'kv bad');
      warn.textContent = 'Saving this would record another company’s postings as '
        + c.name + '’s. Send it to the acquisitions queue instead unless you know better.';
      e.appendChild(warn);

    save.disabled = false;
    save.textContent = r.empty_scan || r.slug_ok === false ? 'Save anyway' : 'Save';
  };
  save.onclick = async () => {
    const r = await api('/api/set-board', {id: c.id, ats: found.ats,
      note: 'confirmed by hand in admin ' + new Date().toISOString().slice(0, 10)});
    if (r.error) return toast(r.error, true);
    toast(r.message); n.remove(); refreshCounts();
  };
  /* The third outcome. "Paste an ATS" and "no public board" recorded a company
     advertising every opening on LinkedIn exactly like one that hires by word
     of mouth - opposite facts, so the card ended up implying nobody was hiring
     at a company that was advertising openly. */
  const elsewhere = el('button', 'btn', 'Posts elsewhere');
  elsewhere.onclick = () => {
    const open = row.querySelector('.pa');
    if (open) { open.remove(); return; }
    const pa = el('div', 'pa');
    pa.style.cssText = 'flex-basis:100%;display:flex;gap:6px;margin-top:8px;flex-wrap:wrap';
    const sel = el('select', 'sel');
    [['linkedin', 'LinkedIn'], ['indeed', 'Indeed'], ['glassdoor', 'Glassdoor'],
     ['ziprecruiter', 'ZipRecruiter'], ['builtin', 'Built In'],
     ['govportal', 'a government jobs portal'], ['recruiter', 'an outside recruiter'],
     ['email', 'by email only'], ['other', 'somewhere else']]
      .forEach(([v, t]) => { const o = el('option', null, t); o.value = v; sel.appendChild(o); });
    const link = el('input', 'in');
    link.placeholder = 'link to their listings (the jobs page, not the profile)';
    link.style.flex = '1';
    const go = el('button', 'btn primary', 'Record');
    const msg = el('div', 'kv');
    msg.style.cssText = 'flex-basis:100%;margin-top:4px';
    sel.onchange = () => {
      link.style.display = ['email', 'recruiter'].includes(sel.value) ? 'none' : '';
    };
    go.onclick = async () => {
      go.disabled = true;
      const r = await api('/api/posts-at',
                          {id: c.id, where: sel.value, url: link.value.trim()});
      go.disabled = false;
      if (r.error) { msg.textContent = r.error; msg.style.color = 'var(--warn)'; return; }
      toast(r.message);
      n.remove();
    };
    pa.append(sel, link, go, msg);
    row.appendChild(pa);
    link.focus();
  };
  row.append(inp, check, save, elsewhere,
             dismissBtn('boards', c.id, 'Nothing public anywhere'));
  n.appendChild(row);
  return n;
};

RENDER.vendors = v => {
  const wrap = document.createDocumentFragment();
  if (v.theme && v.theme !== VTHEME) {
    VTHEME = v.theme;
    const peers = (LAST_ITEMS || []).filter(x => x.theme === v.theme);
    const h = el('div', 'grouphead');
    h.appendChild(el('strong', null, `${v.theme} — ${peers.length}`));
    const why = el('input');
    why.placeholder = 'why (recorded against every one of them)';
    const bulk = (call, label, cls) => {
      const b = el('button', 'act ' + cls, label);
      b.onclick = async () => {
        const names = peers.map(x => x.name);
        if (!confirm(`${label} for all ${names.length} in ${v.theme}?\n\n`
                     + names.slice(0, 12).join(', ')
                     + (names.length > 12 ? `, and ${names.length - 12} more` : '')))
          return;
        const r = await api('/api/vendor-scope-all',
          {names, call, theme: v.theme, why: why.value});
        if (r.error) return toast(r.error, true);
        toast(r.message); show(TAB); refreshCounts();
      };
      return b;
    };
    if (v.theme !== 'Everything else') {
      const row = el('div', 'row');
      row.append(bulk('in', 'All in', 'good'), bulk('sled', 'All SLED-only', ''),
                 bulk('out', 'All out', 'bad'));
      h.append(why, row);
    }
    wrap.appendChild(h);
  }
  const n = document.createElement('div');
  n.className = 'item';
  n.appendChild(el('h3', null, v.name));
  const kv = el('div', 'kv');
  if (v.source_event) kv.appendChild(el('span', 'chip', v.source_event));
  if (v.description) kv.appendChild(document.createTextNode(v.description));
  n.appendChild(kv);
  if (v.why) n.appendChild(el('div', 'kv', v.why));
  if (v.website) {
    const w = el('div', 'kv');
    const a = el('a', null, v.website.replace(/^https?:\/\//, ''));
    a.href = v.website; a.target = '_blank'; a.rel = 'noopener';
    w.appendChild(a); n.appendChild(w);
  }
  const why = el('input');
  why.placeholder = 'why (optional, but it is what teaches the next pass)';
  n.appendChild(why);

  const row = el('div', 'row');
  const rule = (call, label, cls) => {
    const b = el('button', 'act ' + cls, label);
    b.onclick = async () => {
      const r = await api('/api/vendor-scope', {
        name: v.name, call, why: why.value,
        description: v.description, website: v.website,
        source_event: v.source_event});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    return b;
  };
  row.append(rule('in', 'In: full company', 'good'),
             rule('sled', 'SLED-only roles', ''),
             rule('out', 'Not this board', 'bad'));
  n.appendChild(row);
  wrap.appendChild(n);
  return wrap;
};

RENDER.scope = p => {
  const n = document.createElement('div');
  n.className = 'item';
  n.appendChild(el('h3', null, p.title));
  const kv = el('div', 'kv');
  kv.append(el('span', 'chip', p.company),
            el('span', 'chip', `${p.sector || ''} / ${p.category || ''}`));
  if (p.quota) kv.appendChild(el('span', 'chip', 'carries a number'));
  if (p.location) kv.appendChild(document.createTextNode(p.location));
  n.appendChild(kv);
  if (p.url) {
    const w = el('div', 'kv');
    const a = el('a', null, 'open the posting');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    w.appendChild(a); n.appendChild(w);
  }

  const row = el('div', 'row');
  const rule = (keep, label, cls) => {
    const b = el('button', 'act ' + cls, label);
    b.onclick = async () => {
      const r = await api('/api/scope', {id: p.id, in_scope: keep});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    return b;
  };
  row.append(rule(true, 'In scope', 'go'), rule(false, 'Not this board', 'mute'));

  // Six near-identical "Federal Civilian Sales" rows is one decision asked six
  // times. Offer to settle the pattern rather than the row.
  // Prefer the term the question is actually about. Matching in title order
  // picked "Public Sector" out of "Applied AI Architect, Public Sector
  // (National Security)", offering to rule on the broader word when the
  // narrow one is the thing in doubt.
  const stem = ['Intelligence Community', 'National Security', 'Federal Civilian',
                'Federal Partners', 'Federal', 'Public Sector']
    .find(t => new RegExp(t, 'i').test(p.title));
  if (stem) {
    const all = el('button', 'act mute', `Rule every “${stem.trim()}” at once`);
    all.onclick = async () => {
      const keep = confirm(`Keep every pending posting matching “${stem.trim()}”?\n\n`
        + `OK keeps them on the board. Cancel rules them out of scope.`);
      const r = await api('/api/scope-all', {match: stem.trim(), in_scope: keep});
      if (r.error) return toast(r.error, true);
      toast(r.message); show('scope'); refreshCounts();
    };
    row.appendChild(all);
  }
  n.appendChild(row);
  return n;
};

RENDER.submissions = s => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, s.kind === 'company'
    ? (s.name || s.url) : s.title));
  const kv = el('div', 'kv');
  kv.append(el('span', 'chip', s.kind), el('span', 'chip', 'sent ' + s.on));
  if (s.submitted_by) kv.append(el('span', 'chip', 'by ' + s.submitted_by));
  n.appendChild(kv);
  if (s.url) {
    const w = el('div', 'kv');
    const a = el('a', null, s.url); a.href = s.url; a.target = '_blank';
    a.rel = 'noopener'; w.appendChild(a); n.appendChild(w);
  }
  if (s.company) n.appendChild(el('div', 'kv', 'at ' + s.company));
  if (s.location) n.appendChild(el('div', 'kv', s.location));
  if (s.note) n.appendChild(el('div', 'kv', s.note));

  const row = el('div', 'row');
  let fields = null;
  if (s.kind === 'company') {
    const look = el('button', 'act', 'Read the page');
    const secSel = el('select', 'sel'), catSel = el('select', 'sel');
    const sectors = SCHEMA.sectors || [];
    sectors.forEach(x => secSel.appendChild(new Option(x.name, x.name)));
    const fillCats = () => {
      catSel.innerHTML = '';
      (sectors.find(x => x.name === secSel.value) || {categories: []})
        .categories.forEach(c => catSel.appendChild(new Option(c, c)));
    };
    fillCats(); secSel.onchange = fillCats;
    look.onclick = async () => {
      look.disabled = true; look.textContent = 'reading…';
      const r = await api('/api/inspect-submission', {url: s.url});
      look.disabled = false; look.textContent = 'Read the page';
      n.querySelectorAll('.evi').forEach(x => x.remove());
      if (r.error) return toast(r.error, true);
      fields = r;
      const e = el('div', 'evi');
      /* The most hostile strings this admin ever holds: name and description are
         og:site_name and the meta description off a URL a stranger submitted,
         and the extractor html-unescapes them on the way back, so a quote-free
         payload arrives intact. One "Read the page" click was the whole attack
         when this was innerHTML, so none of it goes near innerHTML now. */
      const nameLine = el('div');
      nameLine.appendChild(el('b', null, r.name));
      e.appendChild(nameLine);
      const dline = el('div', null, r.description || '');
      dline.style.cssText = 'color:var(--dim)';
      e.appendChild(dline);
      const reads = el('div');
      reads.style.cssText = 'margin-top:6px';
      reads.appendChild(document.createTextNode('reads as '));
      reads.appendChild(el('b', null, r.sector || '—'));
      reads.appendChild(document.createTextNode(
        ` / ${r.category || '—'} · confidence `));
      reads.appendChild(el('span', r.confidence === 'high' ? 'ok' : 'warn',
                           r.confidence || ''));
      e.appendChild(reads);
      if (r.confidence !== 'high')
        e.appendChild(el('div', 'kv warn',
          'Not confident. Place this one yourself rather '
          + 'than letting one incidental keyword decide.'));
      n.insertBefore(e, row);
      if (r.sector) { secSel.value = r.sector; fillCats(); }
      if (r.category) catSel.value = r.category;
    };
    const ok = el('button', 'act go', 'Approve');
    ok.onclick = async () => {
      const r = await api('/api/resolve-submission', {id: s.id, action: 'approve',
        fields: {name: (fields && fields.name) || s.name,
                 description: fields && fields.description,
                 sector: secSel.value, category: catSel.value}});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    row.append(look, secSel, catSel, ok);
  } else {
    const ok = el('button', 'act go', 'Approve');
    ok.onclick = async () => {
      const r = await api('/api/resolve-submission', {id: s.id, action: 'approve'});
      if (r.error) return toast(r.error, true);
      toast(r.message); n.remove(); refreshCounts();
    };
    row.append(ok);
  }
  const no = el('button', 'act mute', 'Reject');
  no.onclick = async () => {
    const r = await api('/api/resolve-submission', {id: s.id, action: 'reject'});
    if (r.error) return toast(r.error, true);
    n.remove(); refreshCounts();
  };
  row.appendChild(no);
  n.appendChild(row);
  return n;
};

RENDER.review = r => {
  const n = el('div', 'item');
  n.appendChild(el('h3', null, r.name || r.id));
  const w = el('div', 'kv');
  const a = el('a', null, r.url); a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
  w.appendChild(a); n.appendChild(w);
  n.appendChild(el('div', 'kv', 'found ' + (r.found_on || '')));

    toast(res.message); n.remove(); refreshCounts();

/* ------------------------------------------------------------------ capture */

async function showCapture() {
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__capture'));
  const v = $('#view'); v.innerHTML = '';
  v.appendChild(el('p', 'intro', INTRO.capture));

  const help = el('div', 'item');
  help.innerHTML = '<h3>The bookmarklet</h3>'
    + '<div class="kv">Install it once from <a href="/capture" target="_blank">'
    + '/capture</a>, then click it on any careers page or LinkedIn list you have '
    + 'open. It copies what it finds; paste it below.</div>';
  v.appendChild(help);

  const n = el('div', 'item');
  n.appendChild(el('h3', null, 'Paste a capture'));
  const ta = el('textarea');
  ta.placeholder = 'paste here';
  ta.style.cssText = 'width:100%;height:110px;margin-top:9px;font:12px/1.5 '
    + 'ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px;border-radius:7px;'
    + 'border:1px solid var(--line);background:var(--bg);color:var(--ink)';
  n.appendChild(ta);

  const row = el('div', 'row');
  const q = el('input', 'txt'); q.type = 'text';
  q.placeholder = 'which company?';
  const hits = el('div'); hits.style.cssText = 'width:100%';
  const go = el('button', 'act go', 'Add to the board'); go.disabled = true;
  let company = null, parsed = null;

  ta.oninput = () => {
    n.querySelectorAll('.evi').forEach(x => x.remove());
    parsed = null; go.disabled = true;
    if (!ta.value.trim()) return;
    try { parsed = JSON.parse(ta.value); }
    catch { 
      const e = el('div', 'evi bad', 'That is not a capture. Click the bookmarklet '
        + 'again and use Copy for admin.');
      n.insertBefore(e, row); return;
    }
    const jobs = parsed.jobs || [];
    const e = el('div', 'evi');
    /* The paste is a careers page quoting itself: the bookmarklet ran on a site
       we do not control, so the page title and every job title in it are remote
       strings that happen to have travelled via the clipboard. */
    const head = el('div');
    head.appendChild(el('b', null,
      `${jobs.length} posting${jobs.length === 1 ? '' : 's'}`));
    if (parsed.page_title)
      head.appendChild(document.createTextNode(' from ' + parsed.page_title));
    e.appendChild(head);
    const list = el('div', null,
      jobs.slice(0, 8).map(j => j.title || '').join(' · ')
      + (jobs.length > 8 ? ` … and ${jobs.length - 8} more` : ''));
    list.style.cssText = 'margin-top:6px;color:var(--dim)';
    e.appendChild(list);
    n.insertBefore(e, row);
    go.disabled = !company;
  };

  let timer;
  q.oninput = () => {
    clearTimeout(timer);
    company = null; go.disabled = true;
    timer = setTimeout(async () => {
      hits.innerHTML = '';
      if (q.value.trim().length < 2) return;
      const r = await api('/api/search-companies', {q: q.value});
      (r.results || []).forEach(c => {
        const d = el('div', null, '');
        d.style.cssText = 'padding:5px 8px;border-radius:6px;cursor:pointer;'
          + 'font-size:12.5px';
        d.appendChild(document.createTextNode((c.name || '') + ' '));
        const sec = el('span', null, c.sector || '');
        sec.style.cssText = 'color:var(--faint)';
        d.appendChild(sec);
        d.onmouseenter = () => d.style.background = 'var(--chip)';
        d.onmouseleave = () => d.style.background = '';
        d.onclick = () => {
          company = c; q.value = c.name; hits.innerHTML = '';
          go.disabled = !parsed;
        };
        hits.appendChild(d);
      });
      if (!(r.results || []).length) {
        hits.appendChild(el('div', 'kv warn', 'No company by that name is tracked. '
          + 'Add it from the Submissions tab first.'));
      }
    }, 220);
  };

  go.onclick = async () => {
    const r = await api('/api/capture', {company_id: company.id,
      jobs: parsed.jobs, page_url: parsed.page_url});
    if (r.error) return toast(r.error, true);
    toast(r.message);
    ta.value = ''; q.value = ''; company = null; parsed = null;
    go.disabled = true;
    n.querySelectorAll('.evi').forEach(x => x.remove());
  };

  row.append(q, go);
  n.append(row, hits);
  v.appendChild(n);
}

/* ------------------------------------------------------------------ sort board

   The queue tabs ask one question at a time, which is right when the answer
   needs evidence. Sorting is a different job: you are comparing a company
   against its neighbours, and the fastest way to see that a vendor is in the
   wrong bucket is to see the bucket. Cards carry their posting count because a
   company with a live board is the one worth getting right.
*/
let SORT_MODE = 'companies', SORT_SECTOR = null, SHOWN = {};
const PAGE = 40;

function showSort() {
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.key === '__sort'));
  SHOWN = {};
  const v = $('#view'); v.innerHTML = '';
  const bar = el('div', 'row'); bar.style.marginBottom = '14px';
  const seg = el('div', 'seg');
  [['companies', 'Companies'], ['roles', 'Job families']].forEach(([k, lbl]) => {
    const b = el('button', null, lbl);
    b.setAttribute('aria-pressed', SORT_MODE === k);
    b.onclick = () => { SORT_MODE = k; showSort(); };
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  v.appendChild(bar);
  v.appendChild(el('p', 'intro', SORT_MODE === 'companies'
    ? 'Drag a company between categories, or onto a sector on the left to move it '
      + 'out of this sector entirely. Cards are ordered by open postings, so the '
      + 'companies with a live board — the ones worth getting right — come first. '
      + '“Suppliers & Services” is the catch-all the bulk import dumped into; '
      + 'emptying it is most of the work here.'
    : 'Drag a title into the family it belongs to. These are the titles the '
      + 'classifier could not place, so each one is a judgment stored against that '
      + 'exact title — not a rule. A title that suggests a real pattern is better '
      + 'fixed in roles.py with a selftest case.'));
  const host = el('div', 'board'); v.appendChild(host);
  (SORT_MODE === 'companies' ? drawCompanies : drawRoles)(host, bar);
}

/* Takes nodes rather than a markup string. The cards carry company names, ats
   refs and job titles that were read off other people's sites, and any one of
   them spelled as a tag used to become live markup on this board. */
function card(nodes, payload) {
  const c = el('div', 'cd');
  c.draggable = true;
  nodes.forEach(x => c.appendChild(x));
  c.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'move';
    c.classList.add('dragging');
  });
  c.addEventListener('dragend', () => c.classList.remove('dragging'));
  return c;
}

function dropzone(node, onDrop) {
  node.addEventListener('dragover', e => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    node.classList.add('over');
  });
  node.addEventListener('dragleave', () => node.classList.remove('over'));
  node.addEventListener('drop', async e => {
    e.preventDefault(); node.classList.remove('over');
    let payload; try { payload = JSON.parse(e.dataTransfer.getData('text/plain')); }
    catch { return; }
    await onDrop(payload, e);
  });
  return node;
}

function fill(col, key, items, make) {
  col.querySelectorAll('.cd,.more').forEach(n => n.remove());
  const limit = SHOWN[key] || PAGE;
  items.slice(0, limit).forEach(it => col.appendChild(make(it)));
  if (items.length > limit) {
    const m = el('div', 'more', `show ${Math.min(PAGE, items.length - limit)} more `
      + `of ${items.length - limit}`);
    m.onclick = () => { SHOWN[key] = limit + PAGE; fill(col, key, items, make); };
    col.appendChild(m);
  }
}

async function drawCompanies(host, bar) {
  const d = await api('/api/sort/companies'
    + (SORT_SECTOR ? '?sector=' + encodeURIComponent(SORT_SECTOR) : ''));
  SORT_SECTOR = d.sector;
  const sel = el('select', 'sel');
  d.sectors.forEach(x => sel.appendChild(new Option(x, x)));
  sel.value = d.sector;
  sel.onchange = () => { SORT_SECTOR = sel.value; showSort(); };
  bar.appendChild(sel);
  bar.appendChild(el('span', 'count', `${d.companies.length} companies`));

  const byCat = {};
  d.categories.forEach(c => byCat[c] = []);
  d.companies.forEach(c => (byCat[c.category] = byCat[c.category] || []).push(c));

  // rail: every other sector, as a drop target
  const rail = el('div', 'rail');
  rail.appendChild(el('h4', null, 'Move to sector'));
  d.sectors.filter(x => x !== d.sector).forEach(x => {
    const z = dropzone(el('div', 'drop', x), async (p) => {
      const r = await api('/api/move', {id: p.id, sector: x});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    rail.appendChild(z);
  });
  host.appendChild(rail);

  const make = c => {
    const rows = [el('div', null, c.name),
      el('div', 'm',
        (c.postings ? `${c.postings} posting${c.postings === 1 ? '' : 's'} · ` : '')
        + (c.ats || 'no board'))];
    if (c.suggested && c.suggested.sector !== d.sector)
      rows.push(el('div', 'sug', 'looks like ' + c.suggested.sector));
    const cd = card(rows, {id: c.id, name: c.name});
    /* Click for the blurb: sorting a company you cannot remember is a
       guess, and a guess filed with confidence is worse than a queue.
       Everything shown is on file already - nothing is fetched. */
    cd.addEventListener('click', () => {
      const open = cd.querySelector('.cdinfo');
      if (open) { open.remove(); return; }
      const info = el('div', 'cdinfo');
      const bits = [];
      const desc = (c.description || '').replace(/\s*-\s*exhibited at [^;.]*/i, '').trim();
      if (desc) bits.push(desc + '.');
      const facts = [c.location, c.year_founded && `founded ${c.year_founded}`]
        .filter(Boolean).join(' · ');
      if (facts) bits.push(facts + '.');
      info.appendChild(el('div', null,
        bits.join(' ') || 'No description on file - the card is the research gap.'));
      if (c.events && c.events.length) {
        const evrow = el('div', 'm');
        c.events.forEach(ev => evrow.appendChild(el('span', 'chip ok', ev)));
        info.appendChild(evrow);
      }
      if (c.website) {
        const a = el('a', null, c.website.replace(/^https?:\/\//, '').replace(/\/$/, ''));
        a.href = c.website; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', e => e.stopPropagation());
        info.appendChild(a);
      }
      cd.appendChild(info);
    });
    return cd;
  };
  d.categories.forEach(cat => {
    const col = el('div', 'col');
    const h = el('h4', null, cat + ' ');
    h.appendChild(el('span', 'n', String((byCat[cat] || []).length)));
    col.appendChild(h);
    dropzone(col, async (p) => {
      const r = await api('/api/move', {id: p.id, sector: d.sector, category: cat});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    fill(col, 'c:' + cat, byCat[cat] || [], make);
    host.appendChild(col);
  });
}

async function drawRoles(host, bar) {
  const d = await api('/api/sort/roles');
  bar.appendChild(el('span', 'count', `${d.titles.length} unplaced titles`));

  const src = el('div', 'col wide');
  const h = el('h4', null, 'Unclassified ');
  h.appendChild(el('span', 'n', String(d.titles.length)));
  src.appendChild(h);
  const make = t => card([el('div', null, t.title),
    el('div', 'm', (t.company || '')
      + (t.count > 1 ? ` · ${t.count} postings` : ''))],
    {title: t.title});
  fill(src, 'roles', d.titles, make);
  host.appendChild(src);

  Object.entries(d.families).forEach(([k, label]) => {
    const col = el('div', 'col');
    col.appendChild(el('h4', null, label));
    dropzone(col, async (p) => {
      const r = await api('/api/set-family', {title: p.title, family: k});
      if (r.error) return toast(r.error, true);
      toast(r.message); showSort(); refreshCounts();
    });
    host.appendChild(col);
  });
}
