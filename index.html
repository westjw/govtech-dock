<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GovTech Dock</title>
<style>
  :root{ --bg:#fbfaf8; --panel:#fff; --line:#e5e1db; --ink:#1a1815; --dim:#6a655d;
         --faint:#969086; --accent:#2f6f4f; --warn:#a8620f; --bad:#a3342a; --chip:#f1eeea; }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#121110; --panel:#1a1918; --line:#2f2c28; --ink:#eae6e0; --dim:#a09a90;
    --faint:#726c63; --accent:#6fb98a; --warn:#d9973f; --bad:#e0705f; --chip:#232120; }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-underline-offset:2px}
  header{max-width:1340px;margin:0 auto;padding:22px 22px 0}
  h1{font-size:20px;margin:0 0 3px;letter-spacing:-.015em}
  .sub{color:var(--dim);font-size:13px}
  nav{display:flex;gap:3px;margin:16px 0 0;flex-wrap:wrap}
  nav button{background:none;border:0;padding:8px 14px;border-radius:7px 7px 0 0;font:inherit;
    font-size:13px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
  nav button[aria-selected=true]{color:var(--ink);background:var(--panel);
    border-bottom-color:var(--accent);font-weight:600}
  main{max-width:1340px;margin:0 auto;padding:0 22px 60px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;
    padding:18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],select{font:inherit;font-size:13px;padding:7px 10px;
    border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  input[type=search]{min-width:220px;flex:1}
  .count{color:var(--faint);font-size:12px;margin-left:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--faint);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:var(--chip)}
  .clk{cursor:pointer}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--chip);
    color:var(--dim);white-space:nowrap;display:inline-block}
  .ok{color:var(--accent)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .kv{color:var(--dim);font-size:12.5px;margin:3px 0 0}
  .wrap{overflow-x:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
    margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .bignum{font-size:25px;font-weight:600;letter-spacing:-.02em}
  .lbl{font-size:11.5px;color:var(--dim);margin-top:2px}
  .hint{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.65}
  .barfill{display:inline-block;height:8px;border-radius:4px;background:var(--accent);
    vertical-align:middle;margin:0 8px}
  .empty{color:var(--faint);padding:26px 0;text-align:center;font-size:13px}

  /* ---------------------------------------------------------------- phones
     Below 768px the table becomes a card list. Six columns cannot survive a
     375px screen and a horizontal scroll is not an answer: on a phone the
     three facts that matter are the role, who it is with, and whether it
     carries a number. Everything else drops to a chip row.

     Done in CSS rather than a second render path, so there is one source of
     truth for what a row contains. */
  .fbar{display:none}
  @media (max-width:768px){
    header{padding:16px 14px 0}
    main{padding:0 14px 48px}
    h1{font-size:18px}
    .panel{padding:14px;border-radius:0 10px 10px 10px}

    /* the filter row is ten selects; on a phone it hides behind a toggle */
    .fbar{display:flex;gap:7px;align-items:center;margin-bottom:11px}
    .fbar button{font:inherit;font-size:13px;padding:9px 13px;border:1px solid var(--line);
      border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:40px}
    .bar{flex-direction:column;align-items:stretch;gap:7px}
    .bar:not(.open) select{display:none}
    .bar input[type=search]{min-width:0;width:100%;padding:10px 11px;min-height:40px}
    .bar select{width:100%;padding:10px 11px;min-height:40px}
    .count{margin-left:0;order:99}

    .wrap{overflow-x:visible}
    table,thead,tbody,tr,td{display:block;width:auto}
    thead{position:absolute;left:-9999px}          /* keep it for screen readers */
    table{border-collapse:separate}
    tbody tr{border:1px solid var(--line);border-radius:9px;padding:12px 13px;
      margin-bottom:9px;background:var(--panel)}
    tbody tr:hover{background:var(--panel)}
    td{border:0;padding:0}

    /* role is the heading, company sits under it, the rest becomes chips */
    td:nth-child(1){font-size:14.5px;font-weight:600;line-height:1.35}
    td:nth-child(2){font-size:13.5px;margin-top:4px}
    td:nth-child(3),td:nth-child(4),td:nth-child(5){display:inline-block;font-size:12px;
      margin:6px 6px 0 0}
    td:nth-child(4)::before{content:"· "}
    td:nth-child(5):not(:empty)::before{content:"· "}
    td:nth-child(6){display:block;margin-top:7px;font-size:12.5px}
    td .chip{margin:3px 4px 0 0}
    td a{display:inline-block;min-height:24px}
  }
</style>
</head>
<body>
<header>
  <h1>GovTech Dock</h1>
  <div class="sub" id="sub">loading</div>
  <div class="sub" style="margin-top:6px">
    <a href="https://github.com/westjw/govtech-dock/issues/new?template=add-company.yml"
       target="_blank" rel="noopener">Add a company &rarr;</a>
    <span style="color:var(--faint)">submit a link; a bot works out the sector and
    board, then a person reviews it</span>
  </div>
  <nav id="tabs"></nav>
</header>
<main><div class="panel" id="view"></div></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null, tab="jobs";
const TABS=[["jobs","Job board"],["companies","Companies"],["intel","Market intel"]];
const FAM={gtm:"GTM",cs:"Customer Success",ops:"Ops / RevOps",engineering:"Engineering",
  product:"Product & Design",data:"Data & Research",policy:"Policy & Gov Affairs",
  ga:"G&A",exec:"Executive",field:"Field & implementation",other:"Unclassified"};
const ATSNOTE={hard:"Ranking engine likely. Seed exact keywords once.",
  soft:"Searchable board, rarely auto-rejecting.",
  none:"A person opens this list. Keyword tuning buys little."};

function filters(id,extra){return `<div class="fbar">
    <button type="button" onclick="toggleFilters(this)" aria-expanded="false">Filters</button>
    <span class="count" id="${id}-nm"></span>
  </div>
  <div class="bar" id="${id}-bar">
  <input type="search" id="${id}-q" placeholder="Search roles, companies, locations...">
  ${extra||""}<span class="count" id="${id}-n"></span></div>`;}

/* The phone filter toggle. The desktop bar is always open; .open only means
   anything inside the max-width:768px block. */
function toggleFilters(btn){
  const bar=btn.closest(".fbar").nextElementSibling;
  const open=bar.classList.toggle("open");
  btn.setAttribute("aria-expanded",open);
  btn.textContent=open?"Hide filters":"Filters";
}

// ------------------------------------------------------------------- job board
function jobs(){
  const fams=[...new Set(D.postings.map(p=>p.family))].sort((a,b)=>(FAM[a]||a).localeCompare(FAM[b]||b));
  const secs=[...new Set(D.postings.map(p=>p.sector))].sort();
  const states=[...new Set(D.postings.flatMap(p=>p.states||[]))].sort();
  const regions=[...new Set(D.postings.map(p=>p.region).filter(Boolean))].sort();
  $("#view").innerHTML=filters("j",`
    <select id="j-fam"><option value="">All role families</option>
      ${fams.map(f=>`<option value="${f}">${esc(FAM[f]||f)}</option>`).join("")}</select>
    <select id="j-sec"><option value="">All sectors</option>
      ${secs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
    <select id="j-us"><option value="">Anywhere</option><option value="1">US only</option>
      <option value="0">Outside the US</option></select>
    <select id="j-quota"><option value="">Any role</option>
      <option value="1">Quota-carrying only</option></select>
    <select id="j-src"><option value="">Any source</option>
      <option value="ats">From a job board</option>
      <option value="manual">Checked by hand</option></select>
    <select id="j-state"><option value="">Any state</option>
      ${states.map(x=>`<option>${x}</option>`).join("")}</select>
    <select id="j-region"><option value="">Any region</option>
      ${regions.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
    <select id="j-mode"><option value="">Any work mode</option>
      <option value="remote">Remote</option><option value="hybrid">Hybrid</option>
      <option value="territory">Field territory</option>
      <option value="onsite">Onsite</option><option value="unknown">Not stated</option></select>
    <select id="j-sen"><option value="">Any level</option>
      <option value="junior">Junior</option><option value="mid">Mid</option>
      <option value="senior">Senior</option><option value="leadership">Leadership</option></select>`)
    +`<div class="wrap"><table><thead><tr><th>Role</th><th>Company</th><th>Family</th>
      <th>Sector</th><th>Level</th><th>Where</th></tr></thead><tbody id="j-body"></tbody></table></div>
      <p class="hint">Every open posting across ${D.organizations.length} state and local
      government technology companies, refreshed weekly. Roles link straight to the posting.
      Undetermined location means the posting did not say, not that it is remote.
      Level is inferred from the title, which is a proxy: the years a posting actually
      asks for live in the job description, and only titles are fetched for every
      company. Field territory means the states are named in the title, so the role
      covers them rather than sitting in them.</p>`;
  ["j-q","j-fam","j-sec","j-us","j-quota","j-src","j-state","j-region","j-mode","j-sen"].forEach(i=>$("#"+i).addEventListener("input",drawJobs));
  drawJobs();
}
function drawJobs(){
  const q=$("#j-q").value.toLowerCase(),f=$("#j-fam").value,s=$("#j-sec").value,
        u=$("#j-us").value,k=$("#j-quota").value,src=$("#j-src").value,
        st=$("#j-state").value,rg=$("#j-region").value,md=$("#j-mode").value,
        sen=$("#j-sen").value;
  const rows=D.postings.filter(p=>{
    if(q&&!`${p.title} ${p.company} ${p.location||""} ${p.category}`.toLowerCase().includes(q))return false;
    if(f&&p.family!==f)return false;
    if(s&&p.sector!==s)return false;
    if(u==="1"&&p.is_us!==true)return false;
    if(u==="0"&&p.is_us!==false)return false;
    if(k==="1"&&!p.quota_carrying)return false;
    if(src&&(p.source||"ats")!==src)return false;
    if(st&&!(p.states||[]).includes(st))return false;
    if(rg&&p.region!==rg)return false;
    if(md&&p.work_mode!==md)return false;
    if(sen&&p.seniority!==sen)return false;
    return true;
  }).sort((a,b)=>(b.quota_carrying?1:0)-(a.quota_carrying?1:0)||a.company.localeCompare(b.company));
  $("#j-n").textContent=`${rows.length} of ${D.postings.length} postings`;
  $("#j-body").innerHTML=rows.slice(0,400).map(p=>`<tr>
    <td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}
      ${p.quota_carrying?'<span class="chip ok">quota</span>':""}
      ${p.source==="manual"?'<span class="chip warn">checked by hand</span>':""}</td>
    <td class="clk" onclick="co('${encodeURIComponent(p.company_id)}')"><strong>${esc(p.company)}</strong></td>
    <td class="kv">${esc(FAM[p.family]||p.family)}</td>
    <td class="kv">${esc(p.sector)} / ${esc(p.category)}</td>
    <td class="kv">${esc(p.seniority||"")}</td>
    <td class="kv">${esc(p.location||"not stated")}
      ${p.work_mode&&p.work_mode!=="unknown"?`<span class="chip">${esc(p.work_mode)}</span>`:""}
      ${(p.states||[]).length?`<span class="chip">${esc((p.states||[]).slice(0,4).join(" "))}</span>`:""}
      ${p.is_us===false?'<span class="chip">non-US</span>':""}</td></tr>`).join("")
    ||`<tr><td colspan="6" class="empty">No postings match.</td></tr>`;
  if(rows.length>400) $("#j-n").textContent+=" (showing 400)";
}

// ------------------------------------------------------------------- companies
function companies(){
  const secs=[...new Set(D.organizations.map(o=>o.sector))].sort();
  $("#view").innerHTML=filters("c",`
    <select id="c-sec"><option value="">All sectors</option>
      ${secs.map(s=>`<option>${esc(s)}</option>`).join("")}</select>
    <select id="c-phase"><option value="">Any phase</option>
      <option value="selling">Selling</option><option value="building">Building</option>
      <option value="absorbing">Absorbing</option><option value="mixed">Mixed</option></select>
    <select id="c-hiring"><option value="">All</option>
      <option value="1">Has open roles</option><option value="q">Hiring quota-carriers</option>
      <option value="x">Roles not readable</option></select>`)
    +`<div class="wrap"><table><thead><tr><th>Company</th><th class="num">Open</th>
      <th class="num">Quota</th><th>Phase</th><th>Sector</th><th>ATS</th><th>HQ</th>
      </tr></thead><tbody id="c-body"></tbody></table></div>`;
  ["c-q","c-sec","c-phase","c-hiring"].forEach(i=>$("#"+i).addEventListener("input",drawCos));
  drawCos();
}
function drawCos(){
  const q=$("#c-q").value.toLowerCase(),s=$("#c-sec").value,
        ph=$("#c-phase").value,h=$("#c-hiring").value;
  const rows=D.organizations.filter(o=>{
    if(q&&!`${o.name} ${o.description||""} ${o.location||""} ${o.category}`.toLowerCase().includes(q))return false;
    if(s&&o.sector!==s)return false;
    if(ph&&!(o.phase||"").startsWith(ph))return false;
    if(h==="1"&&!o.open_roles)return false;
    if(h==="q"&&!o.quota_roles)return false;
    if(h==="x"&&o.enumerable!==false&&!o.unreadable)return false;
    return true;
  }).sort((a,b)=>b.quota_roles-a.quota_roles||b.open_roles-a.open_roles||a.name.localeCompare(b.name));
  $("#c-n").textContent=`${rows.length} of ${D.organizations.length} companies`;
  $("#c-body").innerHTML=rows.map(o=>`<tr class="clk" onclick="co('${encodeURIComponent(o.id)}')">
    <td><strong>${esc(o.name)}</strong><div class="kv">${esc((o.description||"").slice(0,72))}</div></td>
    <td class="num">${o.open_roles||"-"}</td>
    <td class="num">${o.quota_roles?`<strong class="ok">${o.quota_roles}</strong>`:"-"}</td>
    <td class="kv">${esc(o.phase||"")}${o.enumerable===false?' <span class="chip warn">not readable</span>':""}</td>
    <td class="kv">${esc(o.sector)}</td>
    <td><span class="chip ${o.ats_ranks==="hard"?"bad":o.ats_ranks==="soft"?"warn":""}">${esc(o.ats||"unknown")}</span></td>
    <td class="kv">${esc(o.location||"")}</td></tr>`).join("")
    ||`<tr><td colspan="7" class="empty">No companies match.</td></tr>`;
}

// --------------------------------------------------------------- company card
function co(encId){
  const id=decodeURIComponent(encId), o=D.organizations.find(x=>x.id===id);
  if(!o) return;
  const mine=D.postings.filter(p=>p.company_id===id);
  const fam=Object.entries(o.families||{}).sort((a,b)=>b[1]-a[1]);
  const tot=fam.reduce((n,[,v])=>n+v,0);
  $("#view").innerHTML=`
    <p><button onclick="tab='companies';render()" style="background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;padding:0">&larr; back</button></p>
    <h2 style="margin:6px 0 2px;font-size:19px">${esc(o.name)}</h2>
    <div class="sub">${esc(o.sector)} / ${esc(o.category)}${o.location?" &middot; "+esc(o.location):""}
      ${o.year_founded?" &middot; founded "+o.year_founded:""}${o.tier?" &middot; tier "+o.tier:""}</div>
    ${o.description?`<p class="kv" style="max-width:72ch">${esc(o.description)}</p>`:""}
    ${o.parent?`<p class="kv"><span class="chip">part of ${esc(o.parent)}</span>
      ${esc(o.ats_note||"")}</p>`:""}
    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="bignum">${o.open_roles||0}</div><div class="lbl">open roles</div></div>
      <div class="card"><div class="bignum">${o.quota_roles||0}</div><div class="lbl">quota-carrying</div></div>
      <div class="card"><div class="bignum" style="font-size:14px;padding-top:8px">${esc(o.phase||"")}</div>
        <div class="lbl">hiring phase</div></div>
      <div class="card"><div class="bignum" style="font-size:13px;padding-top:9px">
        <span class="chip ${o.ats_ranks==="hard"?"bad":o.ats_ranks==="soft"?"warn":""}">${esc(o.ats||"unknown")}</span></div>
        <div class="lbl">${esc(ATSNOTE[o.ats_ranks]||"")}</div></div>
    </div>
    ${o.board_url?`<p><a href="${esc(o.board_url)}" target="_blank" rel="noopener">Open their hiring board &rarr;</a>
      ${o.unreadable?` <span class="chip warn">board could not be read: ${esc(o.unreadable)}</span>`:""}
      ${o.enumerable===false?` <span class="chip warn">their board is live but its roles cannot be read automatically, so this list may be incomplete</span>`:""}
      ${o.checked_by_hand?` <span class="chip">checked by hand ${esc(o.checked_by_hand)}</span>`:""}</p>`
      :o.unreadable?`<p><span class="chip warn">board could not be read: ${esc(o.unreadable)}</span></p>`:""}
    <h3 style="font-size:13px;margin-top:20px">What kind of hiring</h3>
    ${tot?fam.map(([f,n])=>`<div class="kv"><span style="display:inline-block;width:26px;text-align:right">${n}</span>
      <span class="barfill" style="width:${Math.max(6,Math.round(n/tot*200))}px"></span>
      ${esc(FAM[f]||f)}</div>`).join(""):'<div class="kv">No open roles on file.</div>'}
    <h3 style="font-size:13px;margin-top:20px">Open roles</h3>
    <div class="wrap"><table><thead><tr><th>Role</th><th>Family</th><th>Location</th></tr></thead><tbody>
      ${mine.map(p=>`<tr><td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}
        ${p.quota_carrying?'<span class="chip ok">quota</span>':""}</td>
        <td class="kv">${esc(FAM[p.family]||p.family)}</td>
        <td class="kv">${esc(p.location||"not stated")}</td></tr>`).join("")
        ||'<tr><td colspan="3" class="empty">No open roles.</td></tr>'}
    </tbody></table></div>`;
}

// ------------------------------------------------------------------ market intel
function intel(){
  const t=D.totals, secs=Object.entries(t.sectors).sort((a,b)=>b[1]-a[1]);
  const fams=Object.entries(t.families).sort((a,b)=>b[1]-a[1]);
  const maxF=Math.max(...fams.map(([,n])=>n));
  const byPhase={};
  D.organizations.forEach(o=>{const k=(o.phase||"").split(":")[0];byPhase[k]=(byPhase[k]||0)+1;});
  const hiring=D.organizations.filter(o=>o.open_roles>0).length;
  const topGtm=[...D.organizations].sort((a,b)=>(b.families?.gtm||0)-(a.families?.gtm||0)).slice(0,8);
  const topEng=[...D.organizations].sort((a,b)=>(b.families?.engineering||0)-(a.families?.engineering||0)).slice(0,8);
  $("#view").innerHTML=`
    <div class="cards">
      <div class="card"><div class="bignum">${t.postings}</div><div class="lbl">open postings</div></div>
      <div class="card"><div class="bignum">${t.quota_carrying}</div><div class="lbl">quota-carrying</div></div>
      <div class="card"><div class="bignum">${hiring}</div><div class="lbl">companies hiring</div></div>
      <div class="card"><div class="bignum">${D.unreadable}</div><div class="lbl">boards unreadable</div></div>
    </div>
    <h3 style="font-size:13px">Where the hiring is, by function</h3>
    ${fams.map(([f,n])=>`<div class="kv"><span style="display:inline-block;width:34px;text-align:right">${n}</span>
      <span class="barfill" style="width:${Math.max(6,Math.round(n/maxF*300))}px"></span>
      ${esc(FAM[f]||f)}</div>`).join("")}
    <h3 style="font-size:13px;margin-top:20px">By sector</h3>
    ${secs.map(([s,n])=>`<div class="kv"><span style="display:inline-block;width:34px;text-align:right">${n}</span>
      <span class="barfill" style="width:${Math.max(6,Math.round(n/secs[0][1]*300))}px"></span>
      ${esc(s)}</div>`).join("")}
    <h3 style="font-size:13px;margin-top:20px">Company phase</h3>
    ${Object.entries(byPhase).sort((a,b)=>b[1]-a[1]).map(([k,n])=>
      `<div class="kv"><strong>${n}</strong> ${esc(k)}</div>`).join("")}
    <div style="display:flex;gap:34px;flex-wrap:wrap;margin-top:20px">
      <div><h3 style="font-size:13px">Biggest GTM pushes</h3>
        ${topGtm.filter(o=>o.families?.gtm).map(o=>`<div class="kv clk"
          onclick="co('${encodeURIComponent(o.id)}')"><strong>${o.families.gtm}</strong> ${esc(o.name)}</div>`).join("")}</div>
      <div><h3 style="font-size:13px">Biggest engineering builds</h3>
        ${topEng.filter(o=>o.families?.engineering).map(o=>`<div class="kv clk"
          onclick="co('${encodeURIComponent(o.id)}')"><strong>${o.families.engineering}</strong> ${esc(o.name)}</div>`).join("")}</div>
    </div>
    <p class="hint">Hiring composition is the signal. A company hiring mostly engineers is
    building; one hiring mostly sellers is pushing go to market; one hiring mostly delivery
    and support is absorbing customers it already won. ${D.unreadable} boards could not be
    read this run, so those companies show zero openings rather than none existing.</p>`;
}

const VIEWS={jobs,companies,intel};
function render(){VIEWS[tab]();[...$("#tabs").children].forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab));}
fetch("data/board.json").then(r=>r.json()).then(d=>{
  D=d;
  $("#sub").textContent=`${d.totals.postings} open roles across ${d.organizations.length} `
    +`state and local govtech companies · ${d.totals.quota_carrying} quota-carrying · refreshed ${d.generated}`;
  $("#tabs").innerHTML=TABS.map(([t,l])=>`<button data-t="${t}">${l}</button>`).join("");
  [...$("#tabs").children].forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
  render();
}).catch(()=>{$("#view").innerHTML=`<div class="empty">Could not load data/board.json.
  Run <code>python3 scripts/build_board.py</code>, then serve this folder.</div>`;});
</script>
</body>
</html>
