name: add-company

# Public submission flow for a static site: an issue comes in, a bot proposes an
# entry, and a pull request goes out. No backend, publicly auditable, and
# moderated by default because merging is a human action.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    if: contains(github.event.issue.labels.*.name, 'add-company')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Extract the submitted URL
        id: url
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # Take the first http(s) URL in the issue body. Nothing else from the
          # submission is trusted or used: the bot derives every field itself.
          URL=$(printf '%s' "$BODY" | grep -oE 'https?://[^ )>"]+' | head -1)
          if [ -z "$URL" ]; then
            echo "::error::no http(s) URL in the issue body, so there is nothing to research" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Propose the entry
        id: propose
        env:
          SUBMITTED_URL: ${{ steps.url.outputs.url }}
        run: |
          set +e
          python scripts/add_company.py "$SUBMITTED_URL" > proposal.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat proposal.txt

      - name: Write it in, if nothing is blocking
        id: write
        if: steps.propose.outputs.status == '0'
        env:
          SUBMITTED_URL: ${{ steps.url.outputs.url }}
        run: |
          set +e
          python scripts/add_company.py "$SUBMITTED_URL" --write --by "bot:add-company"
          echo "wrote=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open a pull request
        if: steps.write.outputs.wrote == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMITTED_URL: ${{ steps.url.outputs.url }}
        run: |
          BR="add-company/issue-${{ github.event.issue.number }}"
          git config user.name "govtech-dock-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git add data/companies.json
          git commit -m "Add company from #${{ github.event.issue.number }}"
          git push -u origin "$BR"
          gh pr create --title "Add company from #${{ github.event.issue.number }}" \
            --body "$(printf 'Proposed from %s\n\nCloses #%s\n\n```\n%s\n```' \
              "$SUBMITTED_URL" "${{ github.event.issue.number }}" \
              "$(cat proposal.txt)")"

      # THE LAST STEP MUST NOT BE THE ONE THAT FAILS. Reporting back is how a
      # submitter learns what happened; a red X here tells them nothing and
      # hides the finding. It runs whatever came before it, says which of the
      # three outcomes this was, and never exits nonzero.
      - name: Report back on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSE_STATUS: ${{ steps.propose.outputs.status }}
          WROTE: ${{ steps.write.outputs.wrote }}
        run: |
          set +e
          if [ "$WROTE" = "0" ]; then
            MSG="A pull request is open with the proposed entry. Monitoring starts on the next daily build once it is merged."
          elif [ "$PROPOSE_STATUS" = "3" ]; then
            MSG="This company is already on the board. Nothing to add, and nothing went wrong."
          else
            MSG="The bot could not add this automatically. Its findings are below; a person needs to fill the gaps."
          fi
          [ -s proposal.txt ] || echo "(the bot produced no output; see the workflow run)" > proposal.txt
          gh issue comment ${{ github.event.issue.number }} \
            --body "$(printf '%s\n\n```\n%s\n```' "$MSG" "$(cat proposal.txt)")" || true
          # ALREADY TRACKED CLOSES THE ISSUE. It is answered, not abandoned.
          if [ "$PROPOSE_STATUS" = "3" ]; then
            gh issue close ${{ github.event.issue.number }} --reason "not planned" || true
          fi
          exit 0
