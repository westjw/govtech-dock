name: daily-refresh

on:
  schedule:
    # Daily. GitHub cron is always UTC regardless of the TZ env below, which only
    # sets the container clock for date stamps. 10:00 UTC is 06:00 ET, so a role
    # posted overnight is on the board before the working day starts.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # GitHub's default is 360. The run is ~2.5h now that both pipelines render
    # (fetch ~40m + refresh's render ration ~20m + build_board's ~30m), and it
    # grows if a budget is raised. Fail at 300 with a clear signal rather than
    # drifting into the hard limit, where the kill looks like an outage. The
    # data commit deliberately sits before the slow tail, so a timeout costs
    # the spreadsheet and the issue, never the day's snapshots.
    # Runners are UTC. Snapshots are keyed by date, so an evening manual run
    # would otherwise be stamped tomorrow and sort ahead of a same-evening
    # local run. Pin to the owner's clock so dates match their calendar.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the browser used for JS-rendered boards
        # Optional at runtime: build_board falls back to the requests path when
        # Playwright is absent, so a failure here degrades the board rather than
        # breaking the run.
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # Conditional-request bodies from previous runs. ats._get keeps the
      # ETag and Last-Modified each board handed over and sends them back, so
      # a board that has not changed answers 304 with no body at all.
      #
      # WITHOUT THIS THE FEATURE IS INERT HERE. A runner is a fresh machine
      # every night, so the cache starts empty and every one of 1,140 boards
      # is downloaded in full - which is exactly what it was written to stop.
      # Restoring it is what turns the second night onward into revalidation.
      #
      # The key rolls daily so the store cannot grow without bound, and
      # restore-keys falls back to yesterday's, which is the whole point:
      # today's run starts from what last night learned.
      #
      # A cache miss is not a failure. Nothing here depends on it; the worst
      # case is the crawl this workflow already did every night before.
      - name: Restore the conditional-request cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/http_cache
          key: http-cache-${{ github.run_id }}
          restore-keys: |
            http-cache-

      - name: Self-test
        run: python scripts/selftest.py

      - name: Apply rulings recorded on the web
        # The web admin appends opinions; this is where they become moves,
        # in Python, behind validate(). A ruling that would break an
        # invariant stays pending and says why, rather than half-applying.
        run: python scripts/apply_web_rulings.py

      - name: Refresh hiring data
        # --force so a manual re-run on the same day still works; the previous
        # snapshot stays recoverable in git history, which is the audit trail here.
        # --render-budget: seconds this run may spend driving a browser at
        # JS-shelled careers pages. Boards are taken least-recently-rendered
        # first, so 1200s (~100 boards) still reaches all ~649 within a week
        # rather than rendering the same hundred every night.
        run: python scripts/refresh.py --ci --force --render-budget 1200

      - name: Build the job board and market intel
        # Keeps every posting, not only AE reqs: the board and the intel both
        # depend on knowing what KIND of hiring a company is doing.
        # Same rationing, separate queue: refresh renders to learn a STATUS,
        # this renders to ENUMERATE the postings. 1800s is ~250 boards a night
        # against a backlog of 564.
        run: python scripts/build_board.py --render-budget 1800

      - name: Record what is in the queues
        # AFTER the board is rebuilt, because half the queues are derived from
        # it, and BEFORE the commit so the line ships with the data it counted.
        # continue-on-error because a counting step must never be able to lose
        # a day's crawl - the numbers are worth having and they are not worth
        # that.
        continue-on-error: true
        run: python scripts/queue_stats.py

      - name: Commit the refreshed data
        # BEFORE the spreadsheet and everything after it, deliberately: the
        # fetch takes ~40 minutes and is the part that cannot be re-created
        # for free. A crash in any later step once discarded a whole day's
        # snapshots because this commit sat at the end of the job.
        run: |
          git config user.name "govtech-dock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "chore: daily hiring refresh ($(date +%F))"
            # Main may have moved during the 40-minute fetch. Rebase, and on a
            # conflict in generated files let this run's freshly built data
            # win (-X theirs = the commit being replayed, i.e. ours-just-built).
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Sound the alarm if the board collapsed
        # The sanity gate's real home is the Cloudflare Pages build, where a
        # refusal keeps the old site up - but a Pages failure is invisible
        # unless someone opens that dashboard. Running the same check here
        # AFTER the data commit makes a collapse fail this workflow, which
        # emails the owner. The data is already safe; this step only shouts.
        run: python scripts/build_site.py --check-only

      - name: Regenerate spreadsheet
        run: python scripts/export_xlsx.py

      - name: Commit the spreadsheet
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Spreadsheet unchanged."
          else
            git commit -m "chore: spreadsheet rebuild ($(date +%F))"
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Open an issue for new AE openings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python scripts/alert.py "$RUNNER_TEMP/alert.md")" = "alert" ]; then
            COUNT=$(grep -c '^### ' "$RUNNER_TEMP/alert.md")
            gh issue create \
              --title "$COUNT new AE opening(s) — $(date +%F)" \
              --body-file "$RUNNER_TEMP/alert.md" \
              --assignee "${{ github.repository_owner }}"
          else
            echo "No new AE openings this run."
          fi

      # Digests go out AFTER the board is committed, so an email never links
      # to a role the site has not published yet. It runs on the refreshed data
      # in this checkout - the same JSON the site will serve - rather than
      # re-fetching anything.
      #
      # Every one of these secrets is optional. With none of them set the step
      # prints that alerts are not configured and exits 0: a job board whose
      # daily refresh fails because nobody set up email would be a worse
      # trade than one that quietly sends no email.
      - name: Send alert digests
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$RESEND_KEY" ]; then
            python scripts/send_digests.py --send
          else
            python scripts/send_digests.py
          fi

      # ------------------------------------------------------------- deploy
      # There is no deploy step here on purpose. Cloudflare Pages is connected
      # to this repository and builds on every push to main, running
      # `python3 scripts/build_site.py` as its build command - so the sanity
      # gate stands in the real deploy path: a board that shrank more than 25%
      # exits non-zero, the Pages build fails, and the previous site stays up.
      #
      # A second deploy step here would be a second door to production, and the
      # one that skips silently when a variable is unset is exactly the door
      # nobody remembers to check.
