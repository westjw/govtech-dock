name: weekly-refresh

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (~8am ET)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python scripts/selftest.py

      - name: Refresh hiring data
        run: python scripts/refresh.py --ci

      - name: Regenerate spreadsheet
        run: python scripts/export_xlsx.py

      - name: Commit changes
        run: |
          git config user.name "govtech-dock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "chore: weekly hiring refresh ($(date -u +%F))"
            git push
          fi
